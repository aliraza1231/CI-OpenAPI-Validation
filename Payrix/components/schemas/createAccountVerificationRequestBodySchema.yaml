properties:
  account:
    type: string
    description: The identifier of the Account that you want to verify.
  type:
    type: string
    description: "The type of account verification you want to perform. \n\n<details>\n<summary>Valid Values</summary>\n\n\
                 - `debit` - **Makes two challenge debits (debit1 and debit2).**\n\n- `credentials` - **Uses a bank account credential (username/password).**\
                 \ \n\n</details> \n"
    enum: [debit, credential]
    x-enum-descriptions: [Debit amount verification, Credential verification.]
  username:
    type: string
    description: "The username that relates to the bank account that is\
                 \ to be verified. \nThis username is used to log in to verify the\
                 \ account."
  password:
    type: string
    description: "The password that relates to the bank account that is\
                 \ to be verified. \nThis password is used to log in to verify the\
                 \ account."
  identification:
    type: string
    description: "An additional authentication field that can be used to\
                 \ log in to the bank account that is to be verified. \nThis field\
                 \ is only required by certain banks."
required: [account, type]
