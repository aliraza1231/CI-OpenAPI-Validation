properties:
  id: { $ref: ../id.yaml }
  created: { $ref: ../created.yaml }
  modified: { $ref: ../modified.yaml }
  creator: { $ref: ../creator.yaml }
  modifier: { $ref: ../modifier.yaml }
  login: { type: string, description: The Login that owns this resource. }
  payoutLogin: { type: string, description: 'The Login that will own the Payout
                             resource. When set to null, the Payout resource will be
                             owned by the triggerring Entity.' }
  org:
    type: string
    description: "The identifier of the Org that this payoutFlows\
                             \ resource applies to. \nIf you set this field, then the\
                             \ payoutFlow applies to all Entities in the Org."
  division: { type: string, description: The identifier of the Division in
    which entities will have automated payouts generated. }
  partition: { type: string, description: The identifier of the Partition in
    which entities will have automated payouts generated. }
  entity: { type: string, description: The identifier of the Entity that this
    payoutFlow applies to. }
  billing:
    type: string
    description: "The identifier of a Billing that this PayoutFlow\
                             \ is associated with. \nThe Billing identifier will be\
                             \ carried over to Payouts created based on this PayoutFlow."
  trigger:
    type: string
    description: "The event on the Org or Entity that should trigger the creation of an associated Payout resource.
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `accountCreate` - Primary payment account creation (primary must be 1)\n\n 
                             - `board` - Merchant boarding\n\n
                             </details>\n"
    enum: [ accountCreate, board ]
    x-enum-descriptions: [ '', '' ]
  schedule:
    type: string
    description: |
      the schedule that determines when the Payout resource that is created should be triggered to be paid.
      <details>
      <summary>Valid Values</summary>
      - `days` - Payout schedule every day.
      - `weeks` - Payout schedule every week.
      - `months` - Payout schedule every month.
      - `years` - Payout schedule every year.
      - `single` - Payout schedule for one time.
      </details>
    enum: [ days, weeks, months, years, single ]
    x-enum-descriptions: [ '', '', '', '', '' ]
  scheduleFactor:
    type: integer
    description: "A multiplier that you can use to adjust the\
                             \ schedule set in the 'schedule' field, if it is set to\
                             \ a duration-based trigger, such as daily, weekly, monthly,\
                             \ or annually. \nThis affects the Payout resource that\
                             \ is created by this payoutFlow. \nThis field is specified\
                             \ as an integer and its value determines how the interval\
                             \ is multiplied."
    x-enum-descriptions: [ Subscription to trigger daily. ]
  start:
    type: integer
    description: "The date on which payment of the Payout should\
                             \ start. \nThe date is specified as an eight digit string\
                             \ in YYYYMMDD format, for example, '20160120' for January\
                             \ 20, 2016."
  um:
    type: string
    description: The unit of measure for the Payout resource
      that is created. For example, if the Entity has a negative
      balance of $10 and the amount is set to 10000 (100%),
      then $10 will be drawn from their account to fully replenish
      the balance to $0.
    x-enum-descriptions: [ '' ]
  amount:
    type: integer
    description: "The total amount of the Payout resource that\
                             \ is created. \nThe units used in this field are determined\
                             \ by the value of the 'um' field on the Payout. If the\
                             \ 'um' field is set to '1' or '3', then this field specifies\
                             \ the Payout percentage to levy in basis points. If the\
                             \ 'um' field is set to '2', then this field specifies\
                             \ the Payout in cents."
  minimum: { type: integer, description: The minium amout of payout that will process. }
  secondaryDescriptor: { type: string, description: The secondary billing descriptor
    to appear on the bank statements in which entities will
    have automated payouts generated. }
  payoutInactive:
    type: integer
    description: "Whether the Payout resource will be marked as inactive
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `0` - **Inactive**\n\n 
                             - `1` - **Active**\n\n
                             </details>\n"
    enum: [ 0, 1 ]
    x-enum-descriptions: [ Inactive, Active ]
  skipOffDays:
    type: integer
    description: "Whether the Payout resource will be marked to skip the creation of disbursements on holidays and weekends.
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `0` - Do not skip Holidays and Weekends. Disbursement will be generated in a Requested status and process the next business day.\n\n 
                             - `1` - Skip Holidays and Weekends. IMPORTANT: We do not advise setting this for weekly, monthly, or yearly Payout schedules as the disbursement will skip and not be generated until the next scheduled date.\n\n
                             </details>\n"
    enum: [ 0, 1 ]
    x-enum-descriptions: [ Do not skip Holidays and Weekends.
      Disbursement will be generated in a Requested status
      and process the next business day., 'Skip Holidays and
                               Weekends. IMPORTANT: We do not advise setting this for
                               weekly, monthly, or yearly Payout schedules as the disbursement
                               will skip and not be generated until the next scheduled
                               date.' ]
  sameDay:
    type: integer
    description: "Whether the payout workflow allows for same day payouts.
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `0` - **Disabled**\n\n 
                             - `1` - **Enabled**\n\n
                             </details>\n"
    enum: [ 0, 1 ]
    x-enum-descriptions: [ '', '' ]
