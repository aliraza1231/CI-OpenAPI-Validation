  type: { description: "The type of Transaction.
      \n\n<details>\n<summary>Valid Values</summary>\n\
      \n`1` - **Credit Card Only:** Sale Transaction, processes a sale and charges the customer;\n\
      \n`2` - **Credit Card Only:** Auth Transaction, authorizes and holds the requested total on the credit card;\n\
      \n`3` - **Credit Card Only:** Capture Transaction, finalizes a prior Auth Transaction and charges the customer;\n\
      \n`4` - **Credit Card Only:** Reverse Authorization, reverses a prior Auth or Sale Transaction and releases the credit hold;\n\
      \n`5` - **Credit Card Only:** Refund Transaction, refunds a prior Capture or Sale Transaction (total may be specified for a partial refund);\n\ 
      \n`7` - **Echeck Only:** Echeck Sale Transaction, sale transaction for ECheck payment;\n\
      \n`8` - **Echeck Only:** ECheck Refund Transaction, refund transaction for prior ECheck Sale Transaction;\n\
      \n`11` - **Echeck Only:** Echeck Redeposit Transaction, attempt to redeposit a prior failed eCheck Sale Transaction;\n\
      \n`12` - **Echeck Only:** Echeck Account Verification Transaction, attempt to verify eCheck payment details.</details>\n",
          enum: [ apikey, fromEmail, replyToEmail, dba, address1, address2,
                  city, state, zip, country, phone, website, receiptTitle,
                  receiptMessage, billingRequired, shippingRequired, eCheckAuthorization ],
          x-enum-descriptions: [ The apikey that will be used for the
            invoice., The email the invoice will be sent from.,
            '', Name of the company that will shown on invoice., Address1
              shown on invoice., Address2 shown on invoice., City
              shown on invoice., State shown on invoice., Zip code
              shown on invoice., Country shown on invoice., Phone
              shown on invoice., Website address shown on invoice.,
            The title when invoice is sent., The message when invoice
              is sent., Whether the billling address will be required
              from the customer., Whether the shipping address will
              be required from the customer., '' ],
          type: string }
