status:
  {
    type: integer,
    description: "The status of the Merchant.\n  \n<details>\n<summary>Valid\
      \ Values</summary>\n  - `0` - **Not ready**. Occurs when a new Merchant\
      \ is created. Unable to process payments.\n  \n  - `1` - **Ready**.\
      \ New Merchant submitted for underwriting approval after submitting\
      \ a signup form.\n  \n  - `2` - **Boarded**. Merchant has been approved\
      \ and boarded to the platform. Payment processing now available. \n\
      \  \n  - `3` - **Manual**. Set internally by platform underwriting.\
      \ New Merchant is pending manual verification. \n  \n  - `4` - **Closed**.\
      \ Set internally by platform underwriting. New Merchant was declined\
      \ and cannot access the platform. \n  \n  - `5` - **Incomplete**.\
      \ Set by user boarding the merchant. Can be manually set to \"save\"\
      \ an incomplete Merchant boarding request for a later time. \n  \n\
      \  - `6` - **Pending**. New Merchant was submitted for boarding, platform\
      \ access pending review.\n  </details>\n",
    enum: [0, 1, 3, 4, 5, 6],
    x-enum-descriptions: [Not ready, Ready, Boarded, Manual, Closed, Incomplete,Pending]
  }
