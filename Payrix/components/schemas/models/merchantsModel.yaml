saqType:
  {
    type: string,
    description: "Payment Card Industry Data Security Standard (PCI DSS)\
      \ Self-assessment questionnaire (SAQ). Details about a merchant's\
      \ business and the way the currently accept payments or plan to in\
      \ the future. \n\nFor more information, see [Understanding SAQs PCI\
      \ DSS provided by The PCI Security Standards Council](https://listings.pcisecuritystandards.org/documents/Understanding_SAQs_PCI_DSS_v3.pdf).\
      \  \n\n<details>\n<summary>Note about SAQ Types</summary>\n- `SAQ-A`\
      \ is not applicable to face-to-face channels.\n- `SAQ-A-EP` is only\
      \ applicable to e-commerce channels.\n- `SAQ-B` is not applicable\
      \ to e-commerce channels.\n- `SAQ-B-IP` is not applicable to e-commerce\
      \ channels.\n- `SAQ-C-VT` is not applicable to e-commerce channels.\n\
      - `SAQ-C` is not applicable to e-commerce channels.\n- `SAQ-P2PE-HW`\
      \ is not applicable to e-commerce channels.\n</details>\n\n<details>\n\
      <summary>Valid Values</summary>\n  - `SAQ-A` - **Card-not-present\
      \ merchants (e-commerce or mail/telephone-order) with PCI DSS-validated\
      \ third-party payments service provider(s) and does not store cardholder\
      \ data.**\n\n  - `SAQ-A-EP` - **E-commerce merchants with PCI DSS-validated\
      \ third-party payments service provider(s) with a website that doesn't\
      \ directly collect cardholder data, but may impact it in some way,\
      \ and does not store cardholder data.**\n\n  - `SAQ-B` - **Merchants\
      \ with imprint machines or standalone, dial-out terminals that do\
      \ not store cardholder data.**\n\n  - `SAQ-B-IP` - **Merchants with\
      \ standalone, PTS-approved payment terminals that have an IP connection\
      \ to the payment processor, but do not store cardholder data.**\n\n\
      \  - `SAQ-C-VT` - **Merchants that enter single transactions manually\
      \ into an internet-based terminal hosted by PCI DSS-validated third-party\
      \ payments service provider(s) and does not store cardholder data.**\n\
      \n  - `SAQ-C` - **Merchants with payment application systems connected\
      \ to the internet that do not store cardholder data.**\n\n  - `SAQ-P2PE-HW`\
      \ - **Merchants with hardware-only payment terminals managed by a\
      \ PCI SSC-listed P2PE solution, and does not store cardholder data.\
      \ \n\n  - `SAQ-D` - Generic field for all Merchants that do not fall\
      \ under the requirements for any above SAQ types. \n\n</details>\n",
    enum: [SAQ-A, SAQ-A-EP, SAQ-B, SAQ-B-IP, SAQ-C-VT, SAQ-C, SAQ-P2PE-HW,
      SAQ-D],
    x-enum-descriptions: ['', '', '', '', '', '', '', '']
  }
