properties:
  id: { $ref: ../id.yaml }
  created: { $ref: ../created.yaml }
  modified: { $ref: ../modified.yaml }
  creator: { $ref: ../creator.yaml }
  modifier: { $ref: ../modifier.yaml }
  type:
    type: string
    description: 'The medium to use to deliver this Alert.'': '
    enum: [email, web, app, sms]
    x-enum-descriptions: [Deliver the Alert to an email address.,
      Deliver the Alert through a web site notification., Deliver
        the Alert through a mobile application notification.,
      Deliver the Alert through an SMS message to a mobile device.]
  options: {type: string, description: 'When the ''type'' field of this resource
                             is set to ''web'', this field determines the format that
                             the Alert data should be sent in.'}
  value: {type: string, description: 'A value used to deliver the alert. The
                             field should be set to an email address if the type is
                             email, an endpoint if the type is web, etc.'}
  headerName: {type: string, description: The request header name for authentication
                 to the endpoint.}
  headerValue: {type: string, description: The request header value for authentication
                  to the endpoint.}
  retries: {type: integer, description: The number of times an alert should
              be resent in case of a failure. This fields can only be
              set for web type alertActions.}
  maxAttemptsTempDisabled:
    type: integer
    description: "Whether it was temporarily disabled for reaching
      maximum number of failed attempts \n\n<details>\n<summary>Valid Values</summary>\n\
      \n- `0` - **Not Temporarily Disabled** \n\n- `1` - **Temporarily Disabled**\n\
      </details>\n"
    enum: [0, 1]
    x-enum-descriptions: ['', '']
  inactive: {$ref: ../inactive.yaml}
  frozen: {$ref: ../frozen.yaml}
  alert: {type: string, description: The identifier of the Alert resource
            that defines this alertAction.}