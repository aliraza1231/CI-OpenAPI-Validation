                      XPD, XPF, XPT, XSU, XUA, YER, ZAR, ZMW, ZWL ],
              example: USD }
  txnFee: { type: integer, description: "Indicator to extract fee from txn supplied fee. When set, amount will correspond to the fee amount in the txn and only that amount will be extractable, anything over that amount will not be extracted.
        <details><summary>Valid Values</summary>\n\
        \n- `0` - **Disabled.** Fee will be calculated normally.\n\
        \n- `1` - **Enabled.** Fee will be calculated based on transaction fee.\n\
        \n\n</details>",
            enum: [ 0, 1 ] }
  inactive: { $ref: ../inactive.yaml }
  frozen: { $ref: ../frozen.yaml }
