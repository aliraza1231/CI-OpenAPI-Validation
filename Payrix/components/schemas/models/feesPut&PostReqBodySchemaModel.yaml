  scheduleFactor: { type: integer,
                    description: "A multiplier that you can use to adjust the schedule\
                            \ set in the 'schedule' field, if it is set to a duration-based\
                            \ trigger, such as daily, weekly, monthly, or annually. \n\
                            This field is specified as an integer and its value determines\
                            \ how the interval is multiplied.." }
  start: { type: integer,
           description: "The date on which charging of the Fee should start.\
                            \ \nThe date is specified as an eight digit string in YYYYMMDD\
                            \ format, for example, '20160120' for January 20, 2016. \n\
                            The value of this field must represent a date in the future,\
                            \ or the present date." }
  finish: { type: integer,
            description: "The date on which charging of the Fee should end.\
                            \ \nThe date is specified as an eight digit string in YYYYMMDD\
                            \ format, for example, '20160120' for January 20, 2016. \n\
                            The value of this field must represent a date in the future." }
  collection: { type: integer,
                description: "Applies the fee based on the volume of a resource.\n\
                            \n<details>\n<summary>Valid Values</summary>\n\n  - `1` -\
                            \ **Txn.** The total amount of all transactions.\n  \n  -\
                            \ `2` - **Txn-TaxID.** The total amount of all transactions\
                            \ per entity EIN/tax ID.\n\n  - `3` - **Txn-Merchant.** The\
                            \ total amount of all transactions per entity.\n\n\n</details>\n",
                enum: [ 1, 2, 3 ] }
  collectionFactor: { type: integer,
                      description: "A multiplier that you can use to adjust the set\
                            \ of data to be used in the collection calculation. \nThis\
                            \ field is specified as an integer and its value determines\
                            \ the period of time to be used." }
  collectionOffset: { type: integer, description: 'The number of days, weeks, months
                            or years to go back when selecting data for collection calculation.' }
  collectionIncludeCurrent: { type: integer, description: Whether to include the
    current period for the colleciton calculation. }
  um: { type: integer, description: "The unit of measure for this Fee. \n\nNotes: \n\
                            \  * Percentage and Surcharge units will only apply to Fee\
                            \ schedules set to trigger from monetary events, such as an\
                            \ authorization, capture, or refund.\n\n<details>\n<summary>Valid\
                            \ Values</summary>\n\n  - `1` - **Percentage.** The Fee is\
                            \ a percentage of the related event amount, specified in the\
                            \ 'amount' field in basis points. \n  \n  - `2` - **Fixed\
                            \ Amount.** The Fee is a fixed amount, specified in the 'amount'\
                            \ field as an integer in cents.\n\n  - `3` - **Surcharge.**\
                            \ The Fee is a percentage of the related event amount as a\
                            \ surcharge (the calculated amount will be based on the assumption\
                            \ that the related event amount already contains the fee amount\
                            \ in it), specified in the 'amount' field in basis points.\
                            \ \n\n</details>\n",
        enum: [ 1, 2, 3 ] }
  amount: { type: integer,
            description: "The total amount of this Fee. \nThe units used\
                            \ in this field are determined by the value of the 'um' field\
                            \ on the Fee. If the 'um' field is set to 'percentage', then\
                            \ this field specifies the Fee percentage to levy in basis\
                            \ points. If the 'um' field is set to 'amount', then this\
                            \ field specifies the Fee in cents." }
  maximum: { type: integer,
             description: "The maximum amount to charge for this fee when\
                            \ setting a percent-based fee. \n\n* Will be `null` for all\
                            \ other units.\n" }
  currency: { type: string,
              description: "The currency of the amount in this assessments
                      resource.",
