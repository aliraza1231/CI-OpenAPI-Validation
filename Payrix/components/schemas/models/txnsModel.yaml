  settledTotal:
    type: integer
    description: "The total amount that was settled. \nThis\
                              \ field is specified as an integer in cents and is set\
                              \ automatically."
  allowPartial:
    type: integer
    description: "Whether to allow partial amount authorizations
      of this Transaction, For example, if the transaction amount
      is $1000 and the processor only authorizes a smaller amount,
      then enabling this field lets the Transaction proceed
      anyway. <details> <summary>Valid Values</summary>\n\n
       - `0` - **Partial amount authorizations are not allowed.**\n\n
       - `1` - **Partial amount authorizations are allowed**\n\n
       </details>\n\n"
    enum: [0, 1]
    x-enum-descriptions: [Partial amount authorizations are
      not allowed., Partial amount authorizations are allowed]
  order:
    type: string
    description: "The identifier of the Order associated with\
                              \ this Transaction. \nThis field is stored as a text string\
                              \ and must be between 0 and 1000 characters long."
  description:
    type: string
    description: "A description of this Transaction. \nThis\
                              \ field is stored as a text string and must be between\
                              \ 0 and 1000 characters long."
  descriptor:
    type: string
    description: "The descriptor used in this Transaction. \n\
                              This field is stored as a text string and must be between\
                              \ 1 and 50 characters long. If a value is not set, an\
                              \ attempt is made to set a default value from the merchant\
                              \ information."
  traceNumber: {type: integer, description: Sequencial number that uniquely
                  identifies the txn.}
  discount: {type: integer, description: The discount applied to the transaction.}
  shipping: {type: integer, description: The shipping fee pertaining to this
               transaction.}
  duty: {type: integer, description: The duty fee applicable to this transaction.}
  terminal:
    type: string
    description: "The identifier of the terminal that processed\
                              \ this Transaction. \nThe identifier is taken from the\
                              \ terminal system and varies in format according to the\
                              \ type of terminal. \nThis field is stored as a text string\
                              \ and must be between 0 and 50 characters long."
  terminalCapability:
    type: integer
    description: "Capabilities of the terminal device capabilities\
                              \ of the terminal device.\n\n<details>\n<summary>Valid\
                              \ Values</summary>\n\n- `1`  - **Key entry only terminal.**\n\
                              \n- `2`  - **Can read magnetic stripe.**\n\n- `3`  - **Integrated\
                              \ circuit reader.** \n\n</details>"
    enum: [1, 2, 3, 4]
    x-enum-descriptions: [Key entry only terminal., Can read
      magnetic stripe., Integrated circuit reader., '']
  entryMode: {$ref: ../properties/terminalTxnsEntryModeProperty.yaml}
  origin:
    type: integer
    description: "The origin of the transaction.\n\n<details>\n\
      <summary>Valid Values</summary>\n\n  
      - `1` - **Originated at a credit card terminal.**\n\n  
      - `2` - **Originated through an eCommerce system.**\n\n  
      - `3` - **Originated as a mail order or telephone order transaction.**\n\n
      - `4` - **Originated with Apple Pay.**\n\n
      - `5` - **Originated as a Successful 3D Secure transaction.**\n\n
      - `6` - **Originated as an Attempted 3D Secure transaction.**\n\n
      - `7` - **Originated as a recurring transaction on the card.**\n\n
      - `8` - **Originated in a PayFrame.**\n\n </details>\n\n"
    enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    x-enum-descriptions: [Originated at a credit card terminal.,
