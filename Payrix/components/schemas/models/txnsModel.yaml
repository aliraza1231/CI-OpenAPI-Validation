  cvvStatus:
    type: string
    description: |-
      The status of the CVV on the card.
      
      <details>
      <summary>Valid Values</summary>
      
      - `notPresent`  - **CVV is not present.**
      
      - `illegible`  - **CVV is illegible.**
      
      - `notProvided`  - **CVV was not provided.**
      </details>
    enum: [notPresent, illegible, notProvided]
    x-enum-descriptions: [CVV is not present., CVV is illegible.,
                          CVV was not provided.]
  swiped:
    type: integer
    description: Whether the card was swiped during this Transaction.
      This field is set to '1' automatically if 'track' data
      was received, and can have valid values of 
      `0` (**Not swiped**) or `1` (**Swiped**).
    enum: [0, 1]
    x-enum-descriptions: [Not swiped., Swiped.]
  emv:
    type: integer
    description: Whether the card was dipped (using the EMV
      chip) during this transaction.
    enum: [0, 1]
    x-enum-descriptions: [Not dipped, Dipped]
  signature:
    type: integer
    description: Whether a signature was captured during this
      Transaction. You can set this field if you took a signature
      for the Transaction. The API also sets this field automatically
      if you associate a signature to the Transaction by creating
      a 'txnDatas' resource. <details> <summary>Valid Values</summary>
      - `0`  - **Not captured**  - `1`  - **Captured** </details>
    enum: [0, 1]
    x-enum-descriptions: [Not captured., Captured.]
  pin:
    type: integer
    description: Whether this Transaction was verified with
      a PIN or not.
    enum: [0, 1]
    x-enum-descriptions: ['', '']
  pinEntryCapability:
    type: string
    description: |-
      Indicates the PIN entry capability of the device, which can be unknown, capable, notCapable, or pinPadDown.
      
      <details>
      <summary>Valid Values</summary>
      
      - `unknown` - **Unknown PIN Entry Capability.**
      - `capable` - **Terminal can accept PINs.**
      - `notCapable` - **Terminal cannot accept entry of PINs.**
      - `pinPadDown` - **Terminal PIN Pad is down.**
      
      </details>
    enum: [unknown, capable, notCapable, pinPadDown]
    x-enum-descriptions: [Unknown PIN Entry Capability, Terminal
      can accept PINs, Terminal cannot accept entry of PINs,
      Terminal PIN Pad is down]
  unattended:
    type: integer
    description: Whether the card was swiped at an unattended
      terminal during this Transaction, This field is set to
      '0' by default.
    enum: [0, 1]
    x-enum-descriptions: [Attended terminal., Unattended terminal.]
  cofType:
    type: string
    description: |-
      The type of Card On File transaction when using a token is single, scheduled, or unscheduled.
      
      <details>
      <summary>Valid Values</summary>
      
      - `single`  - **Individual Transaction.**
      - `scheduled`  - **Scheduled Transaction.**
      - `unscheduled`  - **Unscheduled sequential Transaction.**
      </details>
    enum: [single, scheduled, unscheduled]
    x-enum-descriptions: [Individual Transaction, Scheduled
      Transaction, Unscheduled sequential Transaction]
  copyReason:
    type: string
