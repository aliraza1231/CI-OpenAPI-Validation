  authorization: {type: string, description: 'The authorization code for this
                              Transaction, as returned by the network.'}
  originalApproved: {type: integer, description: "The amount, in 'cents', of funds originally authorized for the transaction."}
  approved:
    type: integer
    description: "The total amount that was approved for this\
                              \ Transaction by the processor. \nThis field is specified\
                              \ as an integer in cents."
  authentication: {type: string, description: Authentication token returned
