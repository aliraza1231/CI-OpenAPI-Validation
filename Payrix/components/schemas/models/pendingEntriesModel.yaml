  entity: { type: string, description: The identifier of the Entity that owns
    this PendingEntry. }
  onentity: { type: string, description: The identifier of the Entity that
    this PendingEntry refers to. This is the owner of the
    record that triggered the charge. }
  fromentity: { type: string, description: 'If the activity that this PendingEntry
                              refers to involves two parties in the system with one
                              paying a charge of any kind, then this field stores the
                              identifier of the Entity that the charge or other activity
                              is for.' }
  fund: { type: string, description: The identifier of the Fund that this PendingEntry
    refers to. }
  opposingEntry: { type: string, description: The identifier of the Entry that
    this entry was created based on. }
  entry: { type: string, description: 'The entry ID associated with this pendingEntry.' }
  adjustment: { type: string, description: 'The adjustment ID from which the funding activity was
triggered.' }
  profitShare: { type: string, description: 'If the activity that this PendingEntry
                              refers to is a ProfitShare, then this field stores the
                              identifier of the corresponding ProfitShare resource.' }
  statement: { type: string, description: 'If the activity that this PendingEntry
                              refers to is a Statement, then this field stores the identifier
                              of the corresponding Statement resource.' }
  chargeback: { type: string, description: 'If the activity that this PendingEntry
                              refers to is a Chargeback, then this field stores the
                              identifier of the corresponding Chargeback resource.' }
  disbursement: { type: string, description: 'If the activity that this PendingEntry
                              refers to is the charging of a Disbursement, then this
                              field stores the identifier of the corresponding Disbursement
                              resource.' }
  fee: { type: string, description: 'If the activity that this PendingEntry
                              refers to is the charging of a Fee, then this field stores
                              the identifier of the corresponding Fee resource.' }
  refund: { type: string, description: 'If the activity that this PendingEntry
                              refers to is the paying of a Refund, then this field stores
                              the identifier of the corresponding Refund resource.' }
  settlement: { type: string, description: 'If the activity that this PendingEntry
                              refers to is a Settlement, then this field stores the
                              identifier of the corresponding Settlement resource.' }
  txn: { type: string, description: 'If the activity that this PendingEntry
                              refers to is a Transaction, then this field stores the
                              identifier of the corresponding Transaction resource.' }
  terminalTxn: { type: string, description: 'The terminal transaction ID from which the funding activity was triggered.' }
  entityDebt: { type: string, description: 'The ID of the entityDebt representing the relationship for
the debt' }
