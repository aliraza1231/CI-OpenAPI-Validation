  bankCode:
    description: "Transaction result bank platform code. \\
         \n\n<details>\n<summary>Valid Values</summary> \n\n
             - `accepted_but_not_yet_processed` - **Fiserv (aka First Data) only, code 385, accepted but not yet processed.**\n\n
             - `account_blocked` - **Fiserv (aka First Data) only, code 224, account blocked - possible.**\n\n
             - `account_is_purged` - **Fiserver (aka First Data) only, code 378, account is purged - the account
                                       record was purged from the database.**\n\n
             - `account_locked` - **Fiserv (aka First Data) only, code 332, account locked**\n\n
             - `account_on_hold_or_not_active` - **Fiserv (aka First Data) only, code 370, Account on hold or subscriber not active**\n\n
             - `account_reloads_exceeded` - **Fiserv (aka First Data) only, code 322, Exceeded account reloads. The clerk/user/location was only permitted to reload some number of accounts. That number was exceeded. (See your Business Manager in order to extend this limit.)**\n\n
             - `account_row_locked` - **Fiserv (aka First Data) only, code 384, account row locked.**\n\n
             - `account_status_is_void_lock` - **Fiserv (aka First Data) only, code 376, account status is void lock.**\n\n
             - `ach_payment_not_accepted` - **Unused. ACH payment is not accepted.**\n\n
             - `acquirer_channel_unavailable` - **Fiserv (aka First Data) only, code 963, acquirer channel unavailable.**\n\n
             - `activation_failed` - **Fiserv (aka First Data) only, code 151, activation failed.**\n\n
             - `additive_limit_exceeded` - **Fiserv (aka First Data) only, code 568, over additive limit.**\n\n
             - `zip_match_address_mismatch` - **TBD**\n\n
             - `zip_match_address_not_verified` - **TBD**\n\n
             - `already_redeemed` - **Fiserv (aka First Data) only, code 568, over additive limit.**\n\n
             - `already_reversed` - **Fiserv (aka First Data) only, code 334, already reversed.**\n\n
             - `amount_limit_exceeded` - **Fiserv (aka First Data) only, codes 587 and 771, transaction amount is above the limit allowed.**\n\n
             - `amount_too_large` - **WorldPay (aka Vantiv) Core only, code 066, transaction amount too large.**\n\n
             - `approve_with_id` - **Transaction approved with identification.**\n\n
             - `approved` - **Transaction approved.**\n\n
             - `approved_emv_key_load` - **Fiserv (aka First Data) only, codes 701 and 703, EMV key load approved.**\n\n
