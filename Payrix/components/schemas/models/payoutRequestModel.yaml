properties:
  login: { type: string, description: The Login that owns this resource. }
  entity: { type: string, description: The identifier of the Entity that this Payout is
    associated with. }
  billing: { type: string, description: The identifier of a Billing that this Payout is
    associated with. Payout associated with a Billing record will be used
    to pay for Statements. }
  account:
    type: string
    description: "The token of the Account that this Payout is associated\
                 \ with. \nThis account will either receive the funds or be debited\
                 \ for the funds every time a Disbursement occurs, depending on the\
                 \ direction of the Disbursement."
  payoutFlow: { type: string, description: The identifier of the PayoutFlow associated
    with this Payout. }
  name:
    type: string
    description: "The name of this Payout. \nThis field is stored as a text\
                 \ string and must be between 0 and 100 characters long."
  description:
    type: string
    description: "A description of this Payout. \nThis field is stored as\
                 \ a text string and must be between 0 and 100 characters long."
  secondaryDescriptor: { type: string, description: The secondary billing descriptor to
    appear on the bank statements for the payout. }
  schedule:
    type: integer
    description: |-
      The schedule that determines when this Payout is triggered to be paid defines the frequency of payment.
      
      <details>
      <summary>Valid Values</summary>
      
      - `1` - **Daily.** The Payout is paid every day.
      - `2` - **Weekly.** The Payout is paid every week.
      - `3` - **Monthly.** The Payout is paid every month.
      - `4` - **Annually.** The Payout is paid once per year.
      - `5` - **Single.** The Payout is an individual, one-off payment.
      
      </details>
    enum: [ 0, 1, 2, 3, 4, 5 ]
    x-enum-descriptions: [ Daily. The Payout is paid every day., Weekly.
      The Payout is paid every week., Monthly. The Payout is paid every
      month., Annually. The Payout is paid every year., Single. The Payout
      is a one-off payment. ]
  scheduleFactor:
    type: integer
    description: "A multiplier that you can use to adjust the schedule set\
                 \ in the 'schedule' field, if it is set to a duration-based trigger,\
                 \ such as daily, weekly, monthly, or annually. \nThis field is specified\
                 \ as an integer and its value determines how the interval is multiplied."
  start:
    type: integer
    description: "The date on which payment of the Payout should start.\
                 \ \nThe date is specified as an eight digit string in YYYYMMDD format,\
                 \ for example, '20160120' for January 20, 2016. \nThe value of this\
                 \ field must represent a date in the future, or the present date."
