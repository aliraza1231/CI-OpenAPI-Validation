  um:
    type: string
    description: The unit of measure for this Payout is the percentage of
      funds, and if the Entity has a negative balance of $10 and the amount
      is set to 10000 (100%), then $10 will be drawn from their account
      to fully replenish the balance to $0. <details> <summary>Valid Values</summary>
      - `percent`  - **Percentage unit measurement.** (Percentage of Funds).
      - `actual`  - **Actual unit measurement.** (Exact Currency Amount).
      - `percentneg`  - **Negative Percentage unit measurement.** (Replenish
      account by percent negative back to $0). </details>
    enum: [ percent, actual, percentneg ]
    x-enum-descriptions: [ '', '', '' ]
  amount:
    type: integer
    description: "The total amount of this Payout. \nThe units used in this\
                 \ field are determined by the value of the 'um' field on the Payout.\
                 \ If the 'um' field is set to '1' or '3', then this field specifies\
                 \ the Payout percentage to levy in basis points. If the 'um' field\
                 \ is set to '2', then this field specifies the Payout in cents."
  minimum: { type: integer, description: The threshold that will ensure no disbursement
    is generated if it doesn't reach the minimum value. }
  maximum: { type: integer, description: 'The maximum threshold for a disbursement. Any
                 amount in a disbursement exceeding this value will not be released,
                 and will roll over to the next disbursement.' }
  float:
    type: integer
    description: "An optional field indicating the minimum balance you want\
                 \ to maintain, despite any Payouts occurring. If the Payout would\
                 \ reduce the balance to below this value, then it is not processed.\
                 \ \nThis field is specified as an integer in cents. \nFor example,\
                 \ a float value of 1000 would ensure that a balance of 10 USD is maintained\
                 \ at all times."
  skipOffDays:
    type: integer
    description: "Whether to skip the creation of disbursements on holidays and weekends.
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `0` - Do not skip Holidays and Weekends. Disbursement will be generated in a Requested status and process the next business day.\n\n 
                             - `1` - Skip Holidays and Weekends. IMPORTANT: We do not advise setting this for weekly, monthly, or yearly Payout schedules as the disbursement will skip and not be generated until the next scheduled date.\n\n
                             </details>\n"
    enum: [ 0, 1 ]
    x-enum-descriptions: [ Do not skip Holidays and Weekends. Disbursement
      will be generated in a Requested status and process the next business
      day., 'Skip Holidays and Weekends. IMPORTANT: We do not advise setting
                   this for weekly, monthly, or yearly Payout schedules as the disbursement
                   will skip and not be generated until the next scheduled date.' ]
  sameDay:
    type: integer
    description: "Whether sameDay payout is enabled or disabled.
                             \n\n<details>\n<summary>Valid Values</summary> \n\n 
                             - `0` - **Disabled**\n\n 
                             - `1` - **Enabled**\n\n
                             </details>\n"
    enum: [ 0, 1 ]
    x-enum-descriptions: [ '', '' ]
