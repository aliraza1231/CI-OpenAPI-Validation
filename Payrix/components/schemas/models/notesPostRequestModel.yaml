  type:
    type: string
    description: "The desired type to take on the referenced Note.\n\n \
      \ <details>\n  <summary>Valid Values</summary>\n\n  - `note` - Note.\
      \ Just add a note to the hold. \n\n  - `release` - Release. Release\
      \ the hold for this Hold.\n\n  - `review` - Review. Mark the hold\
      \ as having been reviewed.\n\n  - `reReview` - Re-Review. If the hold\
      \ was marked as reviewed, this will allow resetting the review. \n\
      \n  - `amexSales` - Amex Sales. If the entity does sales with AMEX.\n\
      \n  - `businessSales` - Business Sales. If the entity does business\
      \ direct sales.\n\n  - `consumerSales` - Consumer Sales. If the entity\
      \ does consumer direct sales. \n\n  - `deliverySchedule` - Delivery\
      \ Schedule. The delivery schedule of the entity. \n\n  - `immediateDeliveryPercent`\
      \ - Immediate Delivery Percent. The amount of immediate deliveries\
      \ with 0 day after the transaction.\n\n  - `sevenDayDeliveryPercent`\
      \ - Seven Day Delivery Percent. The amount of deliveries between 1-7\
      \ days after the transaction.\n\n  - `fourteenDayDeliveryPercent`\
      \ - Fourteen Day Delivery Percent. The amount of deliveries between\
      \ 8-14 days after the transaction.\n\n  - `thirtyDayDeliveryPercent`\
      \ - Thirty Day Delivery Percent. The amount of deliveries between\
      \ 15-30 days after the transaction.\n\n  - `cardPresentSales` - Card\
      \ Present Sales. If the entity does sales with card present.\n\n \
      \ - `motoSales` - Moto Sales. If the entity does sales over the phone\
      \ or mail. \n\n  - `ecommerceSales` - Ecommerce Sales. If the entity\
      \ does ecommerce sales.\n\n  - `siteVisit` - Site Visit. If the entity\
      \ had the site visit. \n\n  - `goodsSold` - Goods Sold. The type of\
      \ goods the entity sales. \n\n  - `authorizationFlatFee` - Authorization\
      \ Flat Fee. The flat fee agreement for each authorization. \n\n  -\
      \ `capturePercentFee` - Capture Percent Fee. The percentage fee agreement\
      \ for each capture. \n\n  - `captureFlatFee` - Capture Flat Fee. The\
      \ flat fee agreement for each capture.\n\n  - `riskApproved` - Risk\
      \ Approved. The entity was approved. \n\n  - `riskPending` - Risk\
      \ Pending. The entity is in pending status. \n\n  - `riskCancelled`\
      \ - Risk Cancelled. The entity has a cancelled status. \n\n  - `riskDenied`\
      \  Risk Denied. The entity has a denied status. \n\n  - `riskClosed`\
      \ - Risk Denied. The entity has a closed status. \n\n  - `riskInvestigation`\
      \ - Risk Investigagion. The entity is in investigation status.\n\n\
      \  - `riskPendingData` - Risk Pending Data. Pending Docs/Info for\
      \ The entity. \n\n  - `riskFundsReleased` - Risk Funds Released. Funds\
      \ released for The entity. \n\n  - `riskActivityApproved` - Risk Activity\
      \ Approved. Activity approved for the entity.          \n  </details>\n"
    enum: [note, release, review, reReview, amexSales, businessSales, consumerSales,
      deliverySchedule, immediateDeliveryPercent, sevenDayDeliveryPercent,
      fourteenDayDeliveryPercent, thirtyDayDeliveryPercent, cardPresentSales,
