properties:
  id: { $ref: ../id.yaml }
  created: { $ref: ../created.yaml }
  modified: { $ref: ../modified.yaml }
  creator: { $ref: ../creator.yaml }
  modifier: { $ref: ../modifier.yaml }
  disbursement: { type: string, description: The identifier of the Disbursement
    that this disbursementReresult resource refers to. }
  disbursementRef: { type: string, description: The ID of the disbursementRef for which this result is recorded. }
  code:
    type: string
    description: "The code identifying the disbursement result.\n\
                             \n<details>\n<summary>Valid Values</summary> \n\n- `pending`\
                             \ - Disbursement processing is pending account verification.\n\
                             \n- `internal` - Failed. Internal note and/or failure.\n\
                             \n- `nsf` - Failed.Disbursement return due to insufficient\
                             \ funds.\n\n- `badAccount` - Failed. Disbursement return\
                             \ due to incorrect payment account information.\n\n- `unauthorized`\
                             \ - Failed. Disbursement return due to customer dispute\
                             \ of authorization.\n\n- `general` - General note and/or\
                             \ failure.\n\n- `noc` - Notice of change.\n\n- `parameter`\
                             \ - Disbursement processing withheld due to parameter\
                             \ configuration.\n\n- `sameDay` - Failed. Same-day processing\
                             \ note and/or failure.\n\n- `transferDetails` - Trace\
                             \ number note and/or data.\n\n- `platform` - Failed. Processor\
                             \ note and/or failure.\n\n</details>\n"
    enum: [ pending, internal, nsf, badAccount, unauthorized,
            general, noc, parameter, sameDay, transferDetails, platform ]
    x-enum-descriptions: [ The disbursement is currently pending.,
      The disbursement failed due to an internal issue., The
        disbursement failed due to insufficient funds (NSF).,
      The disbursement failed due to incorrect account information.,
      The disbursement failed because it was unauthorized.,
      The disbursement encountered a general issue., There's
        been a notification of change (NOC) for this disbursement.,
      '', '', '', '' ]
  originalCode: { type: string, description: "The original, unmapped code as received from the processor for this result" }
  platform:
    type: string
    description: "The platform used to process this Transaction. \n\n<details>\n\
                 <summary>Valid Values</summary>\n\n- `ELAVON`  - The Elavon processor.\n\n\
                 - `VANTIV`  - The WorldPay (aka Vantiv or Litle) eComm (aka VAP) processor.\n\n- `VCORE` - The WorldPay (aka Vantiv) Core processor.\n\n\
                 - `TDBANK` - External funding with TD Bank via the Operating Account.\n\n- `TDBANKCA` - External funding with TD Bank Canada via the Operating Account.\n\n\
                 - `WELLSACH` - The Wells Fargo ACH processor.\n\n- `WELLSFARGO` - The Wells Fargo Merchant Services processor.\n\n\
                 - `WFSINGLE` - The WFSINGLE processor.\n\n- `WORLDPAY` - The WORLDPAY processor.\n\n</details>\n"
    enum: [ ELAVON, VANTIV, VCORE, TDBANK, TDBANKCA, WELLSACH, WELLSFARGO,
            WFSINGLE, WORLDPAY ]
    example: VCORE
    x-enum-descriptions: [ '', '', '', '', '', '', '', '', '' ]
  message: { type: string, description: The message string for this result. }
  amount: { type: integer, description: The amount of the disbursement relevant for this result. }
  data: { type: string, description: Data (the trace number will go here if
    applicable). }
  frozen:
    { $ref: ../frozen.yaml }
  inactive:
    { $ref: ../inactive.yaml }