properties:
  id: { $ref: ../id.yaml }
  created: { $ref: ../created.yaml }
  modified: { $ref: ../modified.yaml }
  creator: { $ref: ../creator.yaml }
  modifier: { $ref: ../modifier.yaml }
  entity: { type: string, description: The paying entity for which this statementEntry applies. }
  onentity: { type: string, description: The identifier of the Entity that
    triggered the charge. }
  forentity: { type: string, description: The identifier of the Entity that
    will be paid for this charge. }
  billing: { type: string, description: The identifier of the Billing that
    this StatementEntry refers to. }
  statement: { type: string, description: The identifier of the Statement that
    this StatementEntry refers to. }
  fee: { type: string, description: 'If the activity that this StatementEntry
                              refers to is the charging of a Fee, then this field stores
                              the identifier of the corresponding Fee resource.' }
  profitShare: { type: string, description: 'If the activity that this StatementEntry
                              refers to is a ProfitShare, then this field stores the
                              identifier of the corresponding ProfitShare resource.' }
  event: { $ref: ../properties/statementEntryEventProperty.yaml }
  eventId: { type: string, description: The identifier of the record that is
    associated with this StatementEntry. }
  originalEventId: { type: integer, description: 'ID of the original event.' }
  originalEvent: { $ref: ../properties/statementEntryEventProperty.yaml }
  description: { type: string, description: A description of this StatementEntry. }
  amount: { type: integer, description: 'The amount involved in this StatementEntry.
                              It refers to the amount charged, transferred, or disbursed.
                              This field is specified as an integer in cents.' }
  deductedFromBalance: { type: integer, description: "Whether or not the amount was deducted from\
                              \ the paying entity's balance and is already paid for.\
                              \ \n\n  <details>\n  <summary>Valid Values</summary>\n\
                              \n  - `0` - **Not deducted from balance.** \n\n  - `1`\
                              \ - **Deducted from balance.**\n\n  </details>\n",
                         enum: [ 0, 1 ],
                         x-enum-descriptions: [ '', '' ] }
  revShareStatement: { type: string, description: 'If the activity that this
                              StatementEntry refers to is a Revenue Share, then this
                              field stores the identifier of the corresponding RevShareStatement
                              resource' }