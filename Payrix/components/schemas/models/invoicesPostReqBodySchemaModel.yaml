      \ reusable invoice. (Payment Page.)**\n\n- `recurring` - **A subscription-based\
      \ invoice.**\n\n</details>          \n",
      enum: [ single, multiUse, recurring ],
      x-enum-descriptions: [ '', '', '' ] }
  frozen: { $ref: ../frozen.yaml }
  inactive: { $ref: ../inactive.yaml }

