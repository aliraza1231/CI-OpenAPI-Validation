          x-enum-descriptions: [Private entity, Public entity]
      }               
tcVersion: {
      type: string,
      description: "An indicator showing the version of the terms and conditions\
      \ that this Entity has accepted. The API indicates the version as\
      \ a string. \nThis field is stored as a text string and must be between\
      \ 0 and 20 characters long."
  }               
tcAcceptDate: {
    type: integer,
    description: "Date and time on which this Entity accepted the Terms\
      \ and Conditions, if different than tcDate. \nThe date is specified\
      \ as a twelve digit string in YYYYMMDDHHII format, for example, '201601201528'\
      \ for January 20, 2016 at 15:28 (3:28 pm)."
  } 
tcAcceptIp: {type: string, description: 'IP address from which this Entity accepted
      the Terms and Conditions, if different than tcIp.'}
custom: {type: integer, description: "Custom, free-form field for client-supplied text, must be between 0 and 1000 characters long."}
reserved:
    {
      type: integer,
      description: "\n\n<details>\n<summary>Valid Values</summary> \n\n 
                - `0` - **No reserve.**\n\n 
                - `1` - **Transaction processing withheld.**\n\n
                - `3` - **Transaction capture withheld pending manual review.**\n\n
                - `4` - **Move all funds from this Transaction into a reserve.**\n\n
                - `5` - **Block current activity, no change for merchant.**\n\n  
                - `6` - **Will not be set anywhere, will only be used for integration purposes.**\n\n 
                - `7` - **We did not have policies to process.**\n\n
                - `8` - **We onboard the merchant and wait for manual check later.**\n\n
                </details>\n",
      enum: [0, 1, 3, 4, 5, 6, 7, 8],
      x-enum-descriptions: ['No reserve', 'Transaction processing withheld.',
        'Transaction capture withheld pending manual review.', 'Move all funds
          from this Transaction into a reserve.', 'Block current activity, no change for merchant',
          'Will not be set anywhere, will only be used for integration purposes', 'We did not have policies to process',
          'We onboard the merchant and wait for manual check later'] }               
pendingRiskCheck: {
    type: string,
    description: Whether it is pending a risk check.,
    enum: [pending, successful, failed, manual],
    x-enum-descriptions: [pending, successful, '', '']
  }
checkStage: {
    type: string,
      description: "The last stage completed for risk underwriting review.\n\
      \n<details>\n<summary>Valid Values</summary>\n\n   - createEntity\
      \  -  **Merchant created.** No Signup Form submitted.\n   \n   - underwriting\
      \  -  **Risk/Underwriting Review.** Merchant Signup Form submitted.\n\
      \   \n   - preboard  -  **Preboard.** Check the Merchant before they\
      \ are boarded.\n   \n   - postboard  -  **Check the Merchant after\
      \ they are boarded.**\n   \n   - txn  -  **Check the Merchant when\
      \ they process a Transaction.**\n   \n   - txnVolume  -  **Check the\
      \ Merchant when their transaction volume hits a certain amount.**\n\
      \   \n   - payout  -  **Check the Merchant when a Payout occurs.**\n\
      \   \n   - payoutVolume  -  **Check the Merchant when the volume of\
      \ Payouts to the Merchant hits a certain amount.**\n\n</details>",
    enum: [createEntity, underwriting, preboard, postboard, txn, txnVolume,
      payout, payoutVolume],
    x-enum-descriptions: ['', '', Preboard. Check the Merchant before they
        are boarded., Check the Merchant after they are boarded., Check
        the Merchant when they process a Transaction., Check the Merchant
        when their transaction volume hits a certain amount., Check the
        Merchant when a Payout occurs., Check the Merchant when the volume
        of Payouts to the Merchant hits a certain amount.]
  }               
