      currently accepting values including 'USA', CAN.",
    enum: [USA, CAN],
    x-enum-descriptions: [United States, Canada]
  }               
timezone:
  {
    type: string,
    description: "The timezone for the address associated with the terminal''s location.
    \n\n<details>\n<summary>Valid Values</summary> \n\n 
    - `est` - **Eastern Standard Time**\n\n
    - `pst` - **Pacific Standard Time**\n\n
    - `cst` - **Central Standard Time**\n\n
    - `mst` - **Mountain Daylight Time**\n\n
    - `akst` - **Alaska Standard Time**\n\n
    - `hst` - **Hawaii Standard Time**\n\n
    - `sst` - **Samoa Standard Time**\n\n
    - `chst` - **Chamorro Standard Time**\n\n 
    - `ast`  - **Atlantic Standard Time**\n\n
    - `pwt` - **Palau Time**\n\n
    - `mht` - **Marshall Islands Time**\n\n
    - `chut` - **Chuuk Time**\n\n
    - `nst` - **Newfoundland Standard Time**\n\n
     </details>\n",
  enum: [est, cst, pst, mst, akst, hst, sst, chst, ast, pwt, mht, chut, nst],
  x-enum-descriptions: [Eastern Standard Time, Central Standard Time,
      Pacific Standard Time, Mountain Standard Time, Alaska Standard Time,
      Hawaii Standard Time, Singapore Standard Time, Chamorro Standard Time,
      Atlantic Standard Time, '', '', '', '']
  }               
