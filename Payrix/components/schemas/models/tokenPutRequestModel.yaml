properties:
  customer: {type: string, description: The Customer that this Token is associated with.}
  status:
    type: string
    description: "Indicates if this token is ready for use in transactions\
      \ and subscriptions or not. \nA token without complete payment details\
      \ will be marked as 'pending'.\n\n<details>\n<summary>Valid Values</summary>\n\
      \n- `pending` - The payment data is not yet available, Token is not\
      \ ready for use.\n\n- `ready` - The payment data is available, Token\
      \ is ready for use.\n\n</details>\n"
    enum: [pending, ready]
    x-enum-descriptions: ['', '']
  payment:
    description: The payment method that is associated with this Token.
    properties: {$ref: ../params/tokenPaymentParam.yaml}
    required: [method, number]
  token: {type: string, description: The auto-generated token identifier.}
  expiration: {type: string, description: 'The expiry month for the payment method associated
      with this Token.In This field is stored as a text string in ''MMYY''
      format, where ''MM'' is the number of a month and ''YY'' is the last
      two digits of a year. For example, ''0623'' for June 2023. The value
      must reflect a future date.'}
  name: {type: string, description: The name of this Token. This field is stored as a
      text string and must be between 0 and 100 characters long.}
  description: {type: string, description: A description of this Token. This field is
      stored as a text string and must be between 0 and 100 characters long.}
  custom: {type: string, description: 'Custom, free-form field for client-supplied text,
      must be between 0 and 1000 characters long.'}
  authTokenCustomer: {type: string, description: The customer reference from the authToken used for user authentication}
  inactive:
    {$ref: ../inactive.yaml}
  frozen:
    {$ref: ../frozen.yaml}
required: [customer, frozen, inactive, payment, status, type]
