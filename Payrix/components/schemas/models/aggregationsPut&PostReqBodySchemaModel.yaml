  search: { type: string, description: The search query used to find records and
    apply the desired calculation. This field is stored as a text
    string and must be between 0 and 1000 characters long. }
  totals: { type: string, description: 'The especification of the desired aggregation
                          functions including count, sum, min and max. This field is
                          stored as a text string and must be between 1 and 100 characters
                          long.' }
  degrouping: { type: string }
  status: {
    type: string,
    description: "The current status of the aggregation process.\n\
                          \n<details>\n<summary>Valid Values</summary>\n\n- `notReady`\
                          \ - **Aggregation is not ready.** \n\n- `ready` - **Aggregation\
                          \ is ready.**\n\n- `processing` - **Aggregation is processing.**\n\
                          \n- `processed` -  **Aggregation has been processed.**\n\n</details>\
                          \          \n",
    enum: [ notReady, ready, processing, processed ] }
  schedule: {
    type: string,
    description: "The schedule that determines when the aggregation\
                          \ function will be processed.\n\n<details>\n<summary>Valid\
                          \ Values</summary>\n\n- `hours` - **Hourly schedule.** \n\n- `days`\
                          \ - **Daily schedule.** \n\n- `weeks` - **Weekly schedule.** \n\n\
                          - `months` - **Monthly schedule.** \n\n- `years` - **Annual schedule.**\
                          \ \n\n</details>\n",
    enum: [ hours, days, weeks, months, years ] }
  scheduleFactor: { type: integer, description: 'A multiplier that you can use to
                          adjust the schedule set in the ''schedule'' field, such as
                          daily, weekly, monthly, or annually. In This field is specified
                          as an integer and its value determines how the interval is
                          multiplied.' }
  start: { type: integer, description: 'The date on which the aggregation processing
                          should start. The date is specified as a twelve digit string
                          in YYYYMMDDHHII format, for example, ''201601201528'' for
                          January 20, 2016 at 15:28 (3:28 pm). The value of this field
                          must represent a date in the future, or the present date.
                          When the schedule is set to HOURLY (1) the minute part of
                          the time must be divisible by 10 (15:10, 15:20, 15:30, etc...).' }
  default: {
    type: integer,
    description: "Indicates whether this aggregation was automatically\
                          \ created.\n\n<details>\n<summary>Valid Values</summary>\n\
                          \n- `0` - **Manually created.** \n\n- `1` - **Automatically\
                          \ created.**\n</details>\n",
    enum: [ 0, 1 ] }
