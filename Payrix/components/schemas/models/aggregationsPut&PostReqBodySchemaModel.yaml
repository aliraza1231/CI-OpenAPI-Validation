    type: string,
    description: "The type of aggregation. This will automatically\
                          \ set the search and total values.\n\n<details>\n<summary>Valid\
                          \ Values</summary>\n\n- `entityEntryEventMerchant` - **A merchant\
                          \ entry.** \n\n- `merchantTxnApprovedAll` - **All merchant transactions\
                          \ approved.** \n\n- `merchantTxnCapturedAll` - **All merchant\
                          \ transactions captured.** \n\n- `merchantTxnFailedAll` - **All\
                          \ merchant transactions failed.** \n\n</details>           \
                          \ \n",
