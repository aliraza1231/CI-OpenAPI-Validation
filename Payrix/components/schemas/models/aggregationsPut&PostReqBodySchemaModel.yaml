    type: string,
    description: "The level of user that this aggregation will run\
                          \ for.\n\n<details>\n<summary>Valid Values</summary>\n\n-\
                          \ `admin` - **Admin User.**\n\n- `division` - **Division-level\
                          \ User.**\n\n- `merchant` - **Merchant-level User.**\n\n-\
                          \ `partition` - **Partition-level User.**\n\n</details>  \
                          \                  \n",
    enum: [ admin, division, merchant, partition ] }
