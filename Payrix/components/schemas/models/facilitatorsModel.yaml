entity: { type : "string", description: The identifier of the Entity that this Facilitators resource belongs to.}
prefix: { type : "string", description: "The billing descriptor prefix for this Facilitator. \n\
          This string appears at the start of the description for transactions\
          \ on credit card statements when any sub-Merchant of this Facilitator\
          \ charges a card." 
          }
