properties:
  id: { $ref: ../id.yaml }
  created: { $ref: ../created.yaml }
  modified: { $ref: ../modified.yaml }
  creator: { $ref: ../creator.yaml }
  modifier: { $ref: ../modifier.yaml }
  disbursement: { description: The identifier of the Disbursement
                    that this disbursementRef resource refers to., type: string }
  disbursementRef: { description: The identifier of the DisbursementRef
                       that this disbursementRef resource refers to., type: string }
  platform:
    type: string
    description: "The platform used to process this Transaction. \n\n<details>\n\
                 <summary>Valid Values</summary>\n\n- `ELAVON`  - The Elavon processor.\n\n\
                 - `VANTIV`  - The WorldPay (aka Vantiv or Litle) eComm (aka VAP) processor.\n\n- `VCORE` - The WorldPay (aka Vantiv) Core processor.\n\n\
                 - `TDBANK` - External funding with TD Bank via the Operating Account.\n\n- `TDBANKCA` - External funding with TD Bank Canada via the Operating Account.\n\n\
                 - `WELLSACH` - The Wells Fargo ACH processor.\n\n- `WELLSFARGO` - The Wells Fargo Merchant Services processor.\n\n\
                 - `WFSINGLE` - The WFSINGLE processor.\n\n- `WORLDPAY` - The WORLDPAY processor.\n\n</details>\n"
    enum: [ ELAVON, VANTIV, VCORE, TDBANK, TDBANKCA, WELLSACH, WELLSFARGO,
            WFSINGLE, WORLDPAY ]
    example: VCORE
    x-enum-descriptions: [ '', '', '', '', '', '', '', '', '' ]
  companyId: { type: string }
  ref: { description: The Disbursement reference code itself.
           This field is stored as a text string and must be between
           1 and 50 characters long., type: string }
  fileRef: { description: A file reference code that is stored
               as a text string and must be between 1 and 50 characters
               long., type: string }
  stage:
    type: string
    description: "The stage of the Disbursement reference. \n\
                             \n<details>\n<summary>Valid Values</summary>\n\n- `create`\
                             \  - Funding is sent to the processor (based on prior\
                             \ split setup).\n\n- `approve`  - Funding approved by\
                             \ the processor.\n\n- `split` - Disbursement amount is\
                             \ split for processing.\n\n- `failed` - Funding failed.\n\
                             \n</details>\n"
    enum: [ create, approve, split, failed ]
    x-enum-descriptions: [ '', '', '', '' ]
  amount:
    type: integer
    description: The amount of the disbursement related to this disbursementRef.
  frozen:
    { $ref: ../frozen.yaml }
  inactive:
    { $ref: ../inactive.yaml }