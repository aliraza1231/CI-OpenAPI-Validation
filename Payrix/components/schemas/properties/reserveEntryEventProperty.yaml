description:  "The event that triggered the funding activity.
  <details><summary>Valid Values</summary>\n\
  \n- `1` - **DAYS.** DisbursementEntry for an Entry that triggers every day. \n\
  \n- `2` - **WEEKS.** DisbursementEntry for an Entry that triggers every week. \n\
  \n- `3` - **MONTHS.** DisbursementEntry for an Entry that triggers every month. \n\
  \n- `4` - **YEARS.** DisbursementEntry for an Entry that triggers every year. \n\
  \n- `5` - **SINGLE.** DisbursementEntry for an Entry related to a one-off event. \n\
  \n- `6` - **AUTH.** DisbursementEntry for an Entry related to the time of authorization of a transaction. \n\
  \n- `7` - **CAPTURE.** DisbursementEntry for an Entry related to the capture time of a Transaction. \n\
  \n- `8` - **REFUND.** DisbursementEntry for an Entry related to when a refund transaction is processed. \n\
  \n- `9` - **BOARD.** DisbursementEntry for an Entry related to when the Merchant is boarded. \n\
  \n- `10` - **PAYOUT.** DisbursementEntry for an Entry related to when a payout is processed. \n\
  \n- `11` - **CHARGEBACK.** DisbursementEntry for an Entry related to when a card chargeback occurs. \n\
  \n- `12` - **OVERDRAFT.** DisbursementEntry for an Entry related to when an overdraft usage charge from a bank is levied. \n\
  \n- `13` - **INTERCHANGE.** DisbursementEntry for an Entry related to when interchange Fees are assessed for the Transactions of this Merchant. \n\
  \n- `14` - **PROCESSOR.** DisbursementEntry for an Entry related to when the Transactions of this Merchant are processed by a payment processor. \n\
  \n- `15` - **ACHFAIL.** DisbursementEntry for an Entry related to when an automated clearing house failure occurs. \n\
  \n- `16` - **ACCOUNT.** DisbursementEntry for an Entry related when a bank account is verified. \n\
  \n- `17` - **SIFT.** DisbursementEntry for an Entry related to Transaction fraud score. \n\
  \n- `18` - **ADJUSTMENT.** DisbursementEntry for an Entry related to adjusted funds. \n\
  \n- `19` - **RETRIEVAL.** DisbursementEntry for an Entry related to Retrieval Request Chargeback. \n\
  \n- `20` - **ARBITRATION.** DisbursementEntry for an Entry related to Arbitration Chargeback. \n\
  \n- `21` - **ECSALE.** DisbursementEntry for an Entry related to an eCheck Sale. \n\
  \n- `22` - **ECREFUND.** DisbursementEntry for an Entry related to an eCheck Refund. \n\
  \n- `23` - **ECRETURN.** DisbursementEntry for an Entry related to an eCheck Return. \n\
  \n- `24` - **SETTLEMENT.** DisbursementEntry for an Entry related to transaction settlement. \n\
  \n- `25` - **MISUSE.** DisbursementEntry for an Entry related to Misuse of authorization. \n\
  \n- `26` - **PROFIT_SHARE.** DisbursementEntry for an Entry related to a profit sharing entry. \n\
  \n- `27` - **UNAUTH.** DisbursementEntry for an Entry related to an unauthorized entry. \n\
  \n- `28` - **ACHNOC.** DisbursementEntry for an Entry related to an ACH Notification of Change. \n\
  \n- `29` - **ECNOC.** DisbursementEntry for an Entry related to an eCheck Notifications of Change. \n\
  \n- `30` - **ECFAIL.** DisbursementEntry for an Entry related to an eCheck Fail. \n\
  \n- `31` - **ECNSF.** DisbursementEntry for an Entry related to an eCheck Non-Sufficient Funds. \n\
  \n- `32` - **CURRENCY_CONVERSION.** DisbursementEntry for an Entry related to a currency conversion. \n\
  \n- `33` - **TERMINAL_TXN.** DisbursementEntry for an Entry related to a terminal transaction. \n\
  \n- `34` - **REVERSE_PAYOUT.** DisbursementEntry for an Entry related to a payout that's been reversed. \n\
  \n- `35` - **PARTIAL_REVERSE_PAYOUT.** DisbursementEntry for an Entry related to a payout that's been partially reversed. \n\n"
