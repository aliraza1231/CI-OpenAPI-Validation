#                 \  <summary>Valid Values</summary> \n\n    - `0` - **Not Primary**\n\
#                 \n    - `1` - **Primary**\n\n  </details> "
  type:
    type: string
    description: "The type of financial account, debit, credit or both.\
                 \ \n\n  <details>\n  <summary>Valid Values</summary> \n\n    - `all`\
                 \ - Debit/Checking + Credit\n\n    - `credit` - Credit-Only\n\n  \
                 \  - `debit` - Debit/Checking-Only\n\n  </details>\n"
    enum: [all, credit, debit]
    x-enum-descriptions: ['', '', '']
  status:
    type: integer
    description: "The status of the Account is ready to be verified. \n\n<details>\n<summary>Valid Values</summary>\n\n\
                 - `0` - **Not Ready.**\n\n- `1` - **Ready.**\n\n- `2` - **Challenged.**\n\n- `3` - **Verified.**\n\n- `4` - **Manual.**\
                 \ \n\n</details> \n"
    enum: [0, 1, 2, 3, 4]
    x-enum-descriptions: [Not Ready. The account holder is not yet ready
      to verify the Account., Ready. The account is ready to be verified.,
      Challenged. The account has processed the challenge., Verified. The
        Account has been verified., Manual. There has been an issue during
        verification and further attempts to verify the Account will require
        manual intervention.]
#    descriptionx-current: The status of the Account
#    descriptionx-supplemental: "The status of the Account. \n\n<details>\n\
