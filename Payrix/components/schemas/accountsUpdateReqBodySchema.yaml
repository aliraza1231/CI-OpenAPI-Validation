properties:
  account:
    type: integer
    description: An object representing details of the Account, including
      the type of Account (method), Account number and routing code.
    properties:
      method:
        description: The type of the Account.
        enum: [8, 9, 10, 11]
        x-enum-descriptions: [Checking, Savings, Corporate Checking, Corporate
          Savings]
      number: {description: The number of the bank account.}
      routing:
        description: "The routing number of the bank account. \nThis field\
                     \ is stored as a text string and must be between 5 and 20 characters\
                     \ long."
    required: [method, number]
  name:
    type: string
    description: "A client-supplied name for this bank account. \nThis field\
                 \ is stored as a text string and must be between 0 and 100 characters\
                 \ long."
  description:
    type: string
    description: "A client-supplied description for this bank account. \n\
                 This field is stored as a text string and must be between 0 and 100\
                 \ characters long."
  primary:
    type: integer
    description: Indicates whether the Account is the 'primary' Account
      for the associated Entity. Only one Account associated with each Entity
      can be the 'primary' Account.
    enum: [0, 1]
    x-enum-descriptions: [Not primary, Primary]
