    - {$ref: ../components/schemas/requestQueryUnmaskParams.yaml}
    - {$ref: ../components/schemas/requestHeaderSearchParams.yaml}
    responses:
      '200':
        content:
          application/json:
            examples: 
              Fetch all entries:
                value: {$ref: ../components/schemas/samples/entriesJson.yaml}
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        {$ref: ../components/schemas/models/entriesEntryModel.yaml}
                    details: {$ref: ../components/schemas/details.yaml}
                    errors: {$ref: ../components/schemas/error.yaml}
          application/xml:
            examples: 
              Fetch all entries:
                value: {$ref: ../components/schemas/samples/entriesXml.yaml}              
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        {$ref: ../components/schemas/models/entriesEntryModel.yaml}
