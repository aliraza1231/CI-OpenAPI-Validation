      explode: false
      in: path
      name: id
      required: true
      schema: {type: string}
      style: simple
    - {$ref: ../components/schemas/requestQueryExpandParams.yaml}
    - {$ref: ../components/schemas/requestQueryUnmaskParams.yaml}
    - {$ref: ../components/schemas/requestHeaderSearchParams.yaml}
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items: {$ref: ../components/schemas/models/disbursementResultsModel.yaml}
                    details: {$ref: ../components/schemas/details.yaml}
                    errors: {$ref: ../components/schemas/error.yaml}
          application/xml:
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items: {$ref: ../components/schemas/models/disbursementResultsModel.yaml}
                    details: {$ref: ../components/schemas/details.yaml}
                    errors: {$ref: ../components/schemas/error.yaml}
        description: Retrieve the Response for the query on the disbursementResults
          resource.
      '400':
        content: {$ref: ../components/schemas/error400ResponseContent.yaml}
        description: Error
    summary: Retrieve Disbursement Result by it's ID.
    tags: [Disbursements]
    operationId: getDisbursementResultsId
