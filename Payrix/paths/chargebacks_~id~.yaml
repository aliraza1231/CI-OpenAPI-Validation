get:
  description: 'Query a Chargeback: A Chargeback is the reversal of a Transaction
      and means that the funds have been returned to their source; The resource for
      each Chargeback gives details of the Chargeback, including the reason why it occurred
      and the date when it occurred.'
  parameters:
    - description: The ID of this resource or The Chargeback ID.
      explode: false
      in: path
      name: id
      required: true
      schema: { type: string }
      style: simple
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/chargebacksModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/chargebacksModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
      description: Retrieve Chargeback Response for query on chargebacks resource.
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  summary: Retrieve a Chargeback by it's ID.
  tags: [ Chargebacks ]
  operationId: getChargebacksId
