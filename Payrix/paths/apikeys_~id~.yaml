get:
  description: |-
    Query an API key that represents a permanent method of authentication to the API, remaining active until marked as inactive or deleted.
    
    Details:
  parameters:
    - description: The ID of this resource and The API Key ID.
      explode: false
      in: path
      name: id
      required: true
      schema: { type: string }
      style: simple
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
