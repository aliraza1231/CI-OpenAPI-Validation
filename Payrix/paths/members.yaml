  get:
    description: Query a Member, A Member being a person who is associated with a Merchant,
      and one Member associated with each Merchant can be the 'primary' Member, meaning
      the Member with the most share of ownership in the Merchant.
    parameters:
    - description: "Set this path parameter to retrieve nested objects and return them\
        \ as part of the response. \nThe parameter name that you specify determines\
        \ the resources to return. \nFor example, set '?expand[login][]' to return a\
        \ nested login resource."
      explode: true
      in: query
      name: expand
      required: false
      schema: {}
      style: form
    - description: "Set this path parameter to retrieve unmasked details in the response.\
        \ \nThe fields specified will be returned in full. Only works for single-record\
        \ requests."
      explode: true
      in: query
      name: unmask
      required: false
      schema: {}
      style: form
    - description: "Set this header to filter or sort the list of resources that the\
        \ method returns. \nFor example, to find all resources that have a property\
        \ of 'public' set to '1', set this header to 'public[equals]=1'. You can use\
        \ the operators 'equals', 'greater', 'less', 'like', 'in' and 'sort'. To sort\
        \ the resources, use the keywords 'asc' (for an ascending sort) or 'desc' (for\
        \ a descending sort).\nYou may also use explicit 'and/or' querying by passing\
        \ arrays of or and arrays of and parameters. For example, to find all resources\
        \ that have a property of 'public' set to '1' or a property of 'active' set\
        \ to '0', set this header to 'or[][public][equals]=1&or[][active][equals]=0'."
      explode: false
      in: header
      name: search
      required: false
      schema: {}
      style: simple
    - description: "Set this path parameter to request a specific page of records. \n\
        For example, set '?page[number]=2' to retrieve the second page of records for\
        \ this request."
      explode: true
      in: query
      name: page[number]
      required: false
      schema: {}
      style: form
    - description: |-
        Set this path parameter to request up to a specific amount of records. By default 30 records are retrieved per page. The maximum limit that can be set is 100.
        For example, set '?page[limit]=50' to retrieve up to 50 records for this request.
      explode: true
      in: query
      name: page[limit]
      required: false
      schema: {}
      style: form
