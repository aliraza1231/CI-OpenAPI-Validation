    - description: The ID of this alert trigger.
      explode: false
      in: path
      name: id
      required: true
      schema: { type: string }
      style: simple
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
