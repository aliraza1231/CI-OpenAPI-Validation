                  data:
                    description: The data object that the API returns for this request.
                    items: { $ref: ../components/schemas/models/alertTriggersModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items: { $ref: ../components/schemas/models/alertTriggersModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
      description: Response for retrieve Alert Trigger response.
    '400':
      content:
        application/json:
          schema: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema: { $ref: ../components/schemas/error.yaml }
      description: Error
  summary: Retreive an Alert Trigger by it's ID.
  tags: [ Alert Triggers ]
  operationId: getAlertTriggersId
