              action:
                type: integer
                description: "The action taken on the referenced Txn. Block, Hold, or\
                  \ Reserve it.\n\n<details>\n<summary>Valid Values</summary> \n\n -\
                  \ `0` - **NONE** No Action\n\n - `1` - **Block.** Block the Transaction\
                  \ from proceeding. This returns an error.\n\n - `3` - **Hold.** Hold\
                  \ the Transaction. It will not be captured until it is manually released.\n\
                  \n - `4` - **Reserve** Reserve the Transaction. The funds for the\
                  \ transaction will not be released until the Transaction is manually\
                  \ reviewed.\n\n - `5` - **LIMIT** Block current activity.\n\n - `6`\
                  \ - **PASS** Passed decision(s).\n\n </details>\n"
                enum: [0, 1, 3, 4, 5, 6]
