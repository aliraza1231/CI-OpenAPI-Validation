                    until the Transaction is manually reviewed., '', '']
              released: {type: string, description: If this hold was released this will
                  contain the timestamp for when it was released., format: date-time}
              reviewed: {type: string, description: If this hold was reviewed this will
                  contain the timestamp for when it was reviewed., format: date-time}
              releaseAction:
                type: integer
                example: '[releaseAction]'
                enum: [1, 2, 3, 4]
                description: "The final action taken on the hold while its been released.Valid\
                  \ Values:\n\n<details>\n<summary>Valid Values</summary> \n\n - `1`\
