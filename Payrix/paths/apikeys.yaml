get:
  description: Query an API key that represents a permanent method of authentication
    to the API and remains active until marked as inactive or deleted.
  parameters:
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageNumberParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageLimitParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
      description: Response for query on API Keys Resource.
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  summary: Retrieve all API Keys.
  tags: [ API Keys ]
  operationId: getApikeys
post:
  description: Create an API key that represents a permanent method of authentication
    to the API, and remains active until marked as inactive or deleted.
  requestBody:
    content:
      application/json:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
      application/x-www-form-urlencoded:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
      application/xml:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
      multipart/form-data:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
      text/json:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
      text/xml:
        schema:
          { $ref: ../components/schemas/models/apiKeysPostRequestModel.yaml }
    description: Create API Key Request
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/apiKeysResponseModel.yaml }
                  details:
                    { $ref: ../components/schemas/details.yaml }
                  errors:
                    { $ref: ../components/schemas/error.yaml }
      description: Response for creating an API key.
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  security:
    - apiKey: [ ]
    - sessionKey: [ ]
    - txnSessionKey: [ ]
    - username: [ ]
      password: [ ]
  summary: Create a new API Key.
  tags: [ API Keys ]
  operationId: postApikeys
