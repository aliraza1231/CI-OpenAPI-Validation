get:
  description: Query a InvoiceResults resource that represents the result of an invoice
    processing. In other words, when the customer pays for an invoice it will then
    generate an invoice result.
  parameters:
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageNumberParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageLimitParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/invoicesResultsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/invoicesResultsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
      description: Response for query on invoiceResults resource
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  summary: Retrieve all Invoice Results.
  tags: [ Invoices ]
  operationId: getInvoiceResults
