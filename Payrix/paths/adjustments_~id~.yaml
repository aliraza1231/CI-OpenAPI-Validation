  get:
    description: Query an Adjustment, which is a way to make monetary adjustments to
      an entity's funds.
    parameters:
    - description: The ID of this resource and The Adjustment ID.
      explode: false
      in: path
      name: id
      required: true
      schema: {type: string}
      style: simple
    - {$ref: ../components/schemas/requestQueryExpandParams.yaml}
    - {$ref: ../components/schemas/requestQueryUnmaskParams.yaml}
    - {$ref: ../components/schemas/requestHeaderSearchParams.yaml}
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        { $ref: ../components/schemas/models/adjustmentsModel.yaml }
                    details: { $ref: ../components/schemas/details.yaml }
                    errors: { $ref: ../components/schemas/error.yaml }
          application/xml:
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        { $ref: ../components/schemas/models/adjustmentsModel.yaml }
                    details: { $ref: ../components/schemas/details.yaml }
                    errors: { $ref: ../components/schemas/error.yaml }
        description: Retrieve the adjustment response for query on adjustments resource.
      '400':
        content:
          { $ref: ../components/schemas/error400ResponseContent.yaml }
        description: Error
    summary: Retrieve Adjustment by it's ID.
    tags: [Entries]
    operationId: getAdjustmentsId
