                details:
                  description: An object describing the response, including the request
                    ID and pagination indicators.
                  properties:
                    requestId:
                      description: "A unique identifier set by the API client, that\
                        \ is echoed by the response. \nThe request ID can be useful\
                        \ in troubleshooting and monitoring."
                    page:
                      description: "Where the response lists multiple resources, the\
                        \ API splits the response into several 'pages'. \nThis object\
                        \ indicates the current and last available pages in the list."
                      properties:
                        current: {description: The current page in the paginated resource
                            list.}
                        last: {description: The last available page in the paginated
                            resource list.}
                errors:
                  description: An array of zero or more errors that occurred when the
                    API processed the request.
                  items:
                    properties:
                      code: {description: The error code associated with a particular
                          error.}
                      severity:
                        description: "The severity level of a particular error. \nPossible\
                          \ values are '0' (informational), '1' (warning), '2' (error)\
                          \ and '4' (failure)."
                      message: {description: The message associated with a particular
                          error.}
                      errorCode: {description: An identifying string code for this error.}
