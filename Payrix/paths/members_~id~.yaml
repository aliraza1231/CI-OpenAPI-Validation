                            description: "The title that this Member holds in relation\
                              \ to the associated Merchant. \nThis field is stored as\
                              \ a text string and must be between 0 and 100 characters\
                              \ long.\nFor example, 'CEO', 'Owner' or 'Director of Finance'."
