        description: Response for query on parameters resource
    tags: [Parameters]
    operationId: getParametersId
  put:
    description: "Update a Parameter resource. \nA Parameter resource is a setting that\
      \ you can apply to an Org or Entity that determines key attributes of how it is\
      \ able to use the API. \nWhen applied to an Org, the parameter affects every entity\
      \ in that Org. \nExamples of Parameters include minimum and maximum processing\
      \ totals and whether particular card types are enabled."
    parameters:
    - description: The ID of this resource.
      explode: false
      in: path
      name: id
      required: true
      schema: {}
      style: simple
    - description: "Set this header to filter or sort the list of resources that the\
        \ method returns. \nFor example, to find all resources that have a property\
        \ of 'public' set to '1', set this header to 'public[equals]=1'. You can use\
        \ the operators 'equals', 'greater', 'less', 'like', 'in' and 'sort'. To sort\
        \ the resources, use the keywords 'asc' (for an ascending sort) or 'desc' (for\
        \ a descending sort).\nYou may also use explicit 'and/or' querying by passing\
        \ arrays of or and arrays of and parameters. For example, to find all resources\
        \ that have a property of 'public' set to '1' or a property of 'active' set\
        \ to '0', set this header to 'or[][public][equals]=1&or[][active][equals]=0'."
      explode: false
      in: header
      name: search
      required: false
      schema: {}
      style: simple
