      \ you can apply to an Org or Entity that determines key attributes of how it is\
      \ able to use the API. \nWhen applied to an Org, the parameter affects every entity\
      \ in that Org. \nExamples of Parameters include minimum and maximum processing\
      \ totals and whether particular card types are enabled."
    parameters:
    - description: The ID of this resource.
      explode: false
      in: path
      name: id
      required: true
      schema: {}
      style: simple
    - description: "Set this path parameter to retrieve nested objects and return them\
        \ as part of the response. \nThe parameter name that you specify determines\
        \ the resources to return. \nFor example, set '?expand[login][]' to return a\
        \ nested login resource."
      explode: true
      in: query
      name: expand
      required: false
      schema: {}
      style: form
    - description: "Set this path parameter to retrieve unmasked details in the response.\
        \ \nThe fields specified will be returned in full. Only works for single-record\
        \ requests."
