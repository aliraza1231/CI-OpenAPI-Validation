get:
  description: Query an Alert resource, which represents a particular event notification
    delivered to a user; you can invoke alerts by setting up triggers in an alertTriggers
    resource.
  parameters:
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageNumberParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageLimitParams.yaml }
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/alertsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/alertsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
      description: Response for querying the alerts resource to retrieve all alerts.
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  summary: Retrieve all Alert configurations.
  tags: [ Alerts ]
  operationId: getAlerts
post:
  description: Create an Alert resource, which represents a particular event notification
    delivered to a user, and you can invoke alerts by setting up triggers in an alertTriggers
    resource.
  requestBody:
    content:
      application/json:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
      application/x-www-form-urlencoded:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
      application/xml:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
      multipart/form-data:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
      text/json:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
      text/xml:
        schema:
          { $ref: ../components/schemas/models/alertsPut&PostReqBodySchemaModel.yaml }
    description: Create Alert Configuration Request
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/alertsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/alertsModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
      description: Create Alert Configuration Response for creating an alert on the
        alerts resource.
    '400':
      content:
        { $ref: ../components/schemas/error400ResponseContent.yaml }
      description: Error
  summary: Create a new Alert configuration.
  tags: [ Alerts ]
  operationId: postAlerts
