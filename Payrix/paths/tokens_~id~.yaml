                     items:
                       {$ref: ../components/schemas/models/tokensModel.yaml}
                   details:
                     {$ref: ../components/schemas/details.yaml}
                   errors:
                    {$ref: ../components/schemas/error.yaml}
         application/xml:
           schema:
             properties:
               response:
                 properties:
                   data:
                     description: The data object that the API returns for this request.
                     items:
                       {$ref: ../components/schemas/models/tokensModel.yaml}
                   details:
                     {$ref: ../components/schemas/details.yaml}
                   errors:
                     {$ref: ../components/schemas/error.yaml}
       description: Response for retrieve token response.
     '400':
       content:
         {$ref: ../components/schemas/error400ResponseContent.yaml}
       description: Error
   summary: Retrieve Token by it's ID.
   tags: [Tokens]
   operationId: getTokensId
