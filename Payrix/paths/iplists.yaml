  post:
    description: "Create an iplists resource. An IP List represents a list of IP (Internet\
      \ Protocol) addresses, stored as a range between the lowest and highest IP addresses\
      \ that should be included. \nYou can use an IP List to whitelist (allow) or blacklist\
      \ (deny) particular incoming IP addresses for a given Login. If you set up a whitelist\
      \ for a Login, then the only allowed IP addresses are those in the whitelist,\
      \ minus any blacklisted IP addresses. If you do not set up a whitelist for a Login,\
      \ then all IP addresses are allowed, except for those explicitly blacklisted.\
      \ \nYou can select whether to store IPv4 or IPv6 addresses in an IP list."
    requestBody:
      content:
        application/json:
          schema:
            properties:
              login: {description: The Login that owns this resource.}
              version:
                description: 'Whether this IP List contains IPv4 or IPv6 addresses,
                  you can only use one type in each IP List resource. <details> <summary>Valid
                  Values</summary> - `4` - **IPv4 addresses**. (Example: 198.51.100.113)
                  - `6` - **IPv6 addresses**. (Example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334)
                  </details>'
                enum: ['4', '6']
                x-enum-descriptions: ['IPv4 addresses (for example, 198.51.100.113)',
                  'IPv6 addresses (for example, 2001:0db8:85a3:0000:0000:8a2e:0370:7334)']
              type:
                description: "The type of this IP List is Blacklisted IP address range\
                  \ or Whitelisted IP address range.\n\n<details>\n<summary>Valid Values</summary>\n\
                  \n   - `0`  -  **Blacklisted IP address range.**\n   \n   - `1`  -\
                  \  **Whitelisted IP address range.**\n\n</details>"
                enum: ['0', '1']
                x-enum-descriptions: [Blacklisted IP address range, Whitelisted IP address
