  get:
    description: Query an Entry resource. An Entry resource represents a record of amounts
      moving in or out of the funds held by an Entity. This could be a time-based activity
      such as a weekly or monthly summary, or an event-based activity such as a Capture,
      a Payout, or a Fee. In the case of an event-based activity, the Entry contains
      references to the activity in the appropriate field.
    parameters:
    - { $ref: ../components/schemas/requestQueryExpandParams.yaml }
    - { $ref: ../components/schemas/requestQueryUnmaskParams.yaml }
    - { $ref: ../components/schemas/requestHeaderSearchParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageNumberParams.yaml }
    - { $ref: ../components/schemas/requestQueryPageLimitParams.yaml }
    responses:
      '200':
        content:
          application/json:
            examples: 
              Fetch all entries:
                value: {$ref: ../components/schemas/samples/entriesJson.yaml}
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        {$ref: ../components/schemas/models/entriesEntryModel.yaml}
                    details: {$ref: ../components/schemas/details.yaml}
                    errors: {$ref: ../components/schemas/error.yaml}
          application/xml:
            examples: 
              Fetch all entries:
                value: {$ref: ../components/schemas/samples/entriesXml.yaml}
            schema:
              properties:
                response:
                  properties:
                    data:
                      description: The data object that the API returns for this request.
                      items:
                        {$ref: ../components/schemas/models/entriesEntryModel.yaml}
                    details: {$ref: ../components/schemas/details.yaml}
                    errors: {$ref: ../components/schemas/error.yaml}
        description: Response for query on entries resource
      '400':
        content:
          {$ref: ../components/schemas/error400ResponseContent.yaml}
        description: Error
    summary: Retrieve all entries.
    tags: [Entries]
    operationId: getEntries
