        application/json:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/chargebackStatusesModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
        application/xml:
          schema:
            properties:
              response:
                properties:
                  data:
                    description: The data object that the API returns for this request.
                    items:
                      { $ref: ../components/schemas/models/chargebackStatusesModel.yaml }
                  details: { $ref: ../components/schemas/details.yaml }
                  errors: { $ref: ../components/schemas/error.yaml }
