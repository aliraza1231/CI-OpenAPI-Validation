    /{notificationId}/status:
      patch:
        tags:
        - Complete Notification
        summary: Acknowledge a notification ID  with a success or failure after completion of business process activity
        description: Complete an event notification with a success message or detailed error message in case of processing failure
        operationId: Acknowledge notification
        parameters:
        - name: v-correlation-id
          in: header
          description: Correlation Id
          required: true
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
            type: string
            format: uuid
          example: 24578e35-9bd2-238f-b4c2-0bc9ad9aed2b
        - name: notificationId
          in: path
          description: Notification ID
          required: true
          style: simple
          explode: false
          schema:
            maxLength: 10
            type: integer
            example: 123456
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeRequest'
              examples:
                SuccessAcknowledgeRequest:
                  value:
                    httpStatusCode: "200"
                    httpStatusMessage: OK
                FailureAcknowledgeRequest:
                  value:
                    httpStatusCode: "500"
                    httpStatusMessage: INTERNAL_SERVER_ERROR
                    errors:
                    - errorCode: ERROR_SYSTEM_ERROR
                      errorMessage: A system error has occured.  Please contact support or try your request at a later time
                      target: ""
        responses:
          "200":
            description: OK
            headers:
              uuid:
                $ref: '#/components/headers/CorrelationId'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AcknowledgeResponse'
          default:
            description: Default errors
            headers:
              v-correlation-id:
                $ref: '#/components/headers/CorrelationId'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                examples:
                  "400 Bad Request":
                    $ref: '#/components/examples/400BadRequest'
                  "401 Unauthorized":
                    $ref: '#/components/examples/401Unauthorized'
                  "403 Forbidden":
                    $ref: '#/components/examples/403Forbidden'
                  "404 Not Found":
                    $ref: '#/components/examples/404NotFound'
                  "410 Gone":
                    $ref: '#/components/examples/410Gone'
                  "415 UnSupported Media Type":
                    $ref: '#/components/examples/415UnSupportedMediaType'
                  "500 Server Error":
                    $ref: '#/components/examples/500ServerError'
