            type: boolean
            description: This flag will let us know if a merchant has opted for premier issue gift card or not.
            example: true
          svsGiftCardEnabled:
            type: boolean
            description: This flag will let us know if a merchant has opted for SVS gift card or not.
            example: true
          additionalAcceptedCardInfo:
            description: This aggregate field includes additional accepted card data
            allOf:
            - $ref: '#/components/schemas/AdditionalAcceptedCardInfo'
