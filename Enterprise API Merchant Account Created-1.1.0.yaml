      Title:
        maxLength: 255
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: Required for AMEX acquired merchants otherwise optional.
        example: President
      PhoneType:
        maxLength: 8
        type: string
        description: Phone type.
        example: Mobile
        enum:
        - Mobile
        - Landline
      AlternatePhone:
        maxLength: 10
        pattern: "^[0-9]{10}$"
        type: string
        description: 10-digit alternate phone number of the format  1234567890.
        example: "1234567890"
      AlternatePhoneType:
        maxLength: 10
        type: string
        description: Alternate phone type.
        example: Mobile
        enum:
        - Mobile
        - Landline
      OwnershipPercentage:
        maximum: 100
        minimum: 0
        type: integer
        description: Ownership stake percentage.
        example: 10
      DOB:
        maxLength: 10
        pattern: "[0-9]{4}-[0-2]{2}-[0-2]{2}"
        type: string
        description: Date of Birth (CCYY-MM-DD). Must be at least 18 years old.
        format: date
        example: 1954-01-01
      SSN:
        maxLength: 9
        minLength: 9
        pattern: "^[0-9]{9}$"
        type: string
        description: Social security number. Dashes not included.
        example: '*****1234'
      Location:
        type: object
        properties:
          storeNumber:
            maxLength: 9
            type: string
            description: "Store identifier, you can store alphanumber value when creating the store"
            example: "000000001"
          storeName:
            maxLength: 40
            type: string
            description: Name of the store
            example: My Store Name
          merchantId:
            maxLength: 10
            type: string
            description: Unique identifier assigned for a processing location
            example: "1234567890"
          hostMerchantNumber:
            maxLength: 30
            type: string
            description: Merchant number associated with host
            example: "123456789"
          billingDescriptor:
            maxLength: 30
            type: string
            description: Name of the Merchant
            example: Merchant at Stonegate
          mcc:
            maxLength: 4
            type: string
            description: Merchant Category Code
            example: "5812"
          mccDescription:
            maxLength: 15
            type: string
            description: Description of the merchant category code
            example: Lodging
          seasonalMerchant:
            type: boolean
            description: Identifier for the merchant business being seasonal or not
            example: true
          activeMonths:
            maxLength: 3
            type: array
            description: List of Active Months for merchant business
            example:
            - AUG
            - SEP
            - NOV
            items:
              type: string
              enum:
              - JAN
              - FEB
              - MAR
              - APR
              - MAY
              - JUN
              - JUL
              - AUG
              - SEP
              - OCT
              - NOV
              - DEC
          lastBatchActivityDate:
            maxLength: 10
            pattern: "[0-9]{4}-[0-2]{2}-[0-2]{2}"
            type: string
            description: Date of last batch activity at merchant level
            format: date
            example: 2021-08-30
          status:
            maxLength: 255
            type: string
            description: Status of the merchant
            example: Open
          alternateMerchantId:
            maxLength: 30
            type: string
            description: Alternate identifier for the merchant
            example: "123456789"
          cardSwipedIndicator:
            type: boolean
            description: Indicator for card swiping
            example: true
          ecomIndicator:
            type: boolean
            description: Indicator for ecom business
            example: true
          emvIndicator:
            type: boolean
            description: Indicator for EMV acceptance
            example: false
          mastercardIca:
            maxLength: 6
            type: string
            description: Master Card Inter Bank Association Number
            example: "127684"
          motoIndicator:
            type: boolean
            description: Indicator for card not present transations
            example: true
          p2peIndicator:
            type: boolean
            description: Indicator for Point to Point Encryption
            example: false
          p2peServiceLevel:
            type: boolean
            description: Indicator for Service level Point to Point Encryption
            example: true
          thirdPartyMerchantId:
            maxLength: 30
            type: string
            description: Third Party Merchant ID
            example: "123456789"
          primaryContact:
            description: This aggregate field includes primary contact data
            allOf:
            - $ref: '#/components/schemas/AdditionalContact'
          physicalAddress:
            description: This aggregate field includes physical address data
            allOf:
            - $ref: '#/components/schemas/AdditionalAddress'
          deploymentContact:
            description: This aggregate  field includes deployment contact data
            allOf:
            - $ref: '#/components/schemas/AdditionalContact'
          deploymentAddress:
            description: This aggregate field includes deployment address data
            allOf:
            - $ref: '#/components/schemas/AdditionalAddress'
          paymentMethods:
            description: This aggregate field includes payment methods data
            allOf:
            - $ref: '#/components/schemas/PaymentMethods'
          products:
            description: This aggregate field includes products data
            allOf:
            - $ref: '#/components/schemas/Products'
          acceleratedFunding:
            description: This aggregate field includes accelerated funding data
            allOf:
            - $ref: '#/components/schemas/AcceleratedProducts'
        description: This aggregate field includes location details
      ReadGuarantor:
