      FirstName:
        maxLength: 15
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: First name. Region based validations will be applied to this field.
        example: John
      MiddleInitial:
        maxLength: 1
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: Middle initial.
        example: M
      LastName:
        maxLength: 25
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: Last name. Region based validations will be applied to this field.
        example: Doe
      PhoneNumber:
        maxLength: 10
        pattern: "^[0-9]{10}$"
        type: string
        description: 10-digit phone number of the format  5131234567.
        example: "5139004357"
      PhoneNumberExt:
        maxLength: 8
        pattern: "([0-9]{8})$"
        type: string
        description: Phone number extension. Up to 8 digits of the format 12345678.
        example: "12345678"
      Email:
        maxLength: 64
        pattern: "(\\\\b[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\\\\.)+[A-Za-z0-9]{2,}\\\\b{0,64})"
        type: string
        description: Email address of the contact. Must have @ and a .
        example: youremail@gmail.com
      FaxNumber:
        maxLength: 10
        pattern: "^[0-9]{10}$"
        type: string
        description: 10-digit fax number of the format 5131234567
        example: "5139003344"
      AddressLine1:
        maxLength: 40
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: "Address Line 1. Field for house number, street and direction."
        example: 4355 N Coalwhipe St.
      AddressLine2:
        maxLength: 40
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: "Address Line 2. Field for apartment or suite numbers, etc."
        example: suite 104
      City:
        maxLength: 28
        minLength: 1
        pattern: "^[a-zA-Z0-9 \\p{P}\\p{S}]+$"
        type: string
        description: Name of the City
        example: Denver
      State:
        maxLength: 2
        type: string
        description: "Valid state, commonwealth, and territory codes are allowed."
        example: CO
      Country:
        maxLength: 2
        type: string
        description: Name of Country.
        example: US
      County:
        maxLength: 20
        type: string
        description: Name of County.
        example: Douglas
      Timezone:
        maxLength: 3
        type: string
        description: Timezone
        example: MST
      PostalCode:
        maxLength: 5
        minLength: 5
        pattern: "^[a-zA-Z0-9]"
        type: string
        description: Postal code / zip code. The postal code must be valid for the address' country code.
        example: "80237"
      InternationalPostalCode:
        maxLength: 10
        minLength: 5
        pattern: "^[a-zA-Z0-9]"
        type: string
        description: International Postal code / zip code. The international postal code must be valid for the address'.
        example: H4N 1K4
      PostalCodeExtension:
        maxLength: 4
        minLength: 4
        pattern: "^[0-9]{4}$"
        type: string
        description: Postal code / zip code extension.  The postal code extension must be valid for the address'.
        example: "1384"
      PaymentMethods:
        type: object
        properties:
          acceptedCards:
            maxLength: 10
            type: array
            description: Accepted card types
            items:
              type: string
              example: "[\"VISA\",\"MASTERCARD\",\"AMEX\",\"DISCOVER\"]"
              enum:
              - VISA
              - MASTERCARD
              - AMEX
              - DISCOVER
