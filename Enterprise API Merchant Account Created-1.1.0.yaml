            example: Q
            enum:
            - Q
            - W
            - X
            - "N"
          statusDescription:
            maxLength: 12
            type: string
            description: Payment Accelerator status code description.
            example: PENDING
            enum:
            - PENDING
            - ACTIVE
            - DISABLED
            - NOT ENROLLED
          lastUpdatedDateTime:
            maxLength: 26
            pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{6}"
            type: string
            description: Status update date in UTC format
            format: Using ISO 8601 yyyy-MM-dd'T'HH:mm:ssZ
            example: 2021-04-19T01:56:35.000-04:00
