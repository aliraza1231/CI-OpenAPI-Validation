            description: Direct Funds Transfer Status code
            example: R
            enum:
            - F
            - K
            - "N"
            - R
          statusDescription:
            maxLength: 12
            type: string
            description: "Status description F-Pending, N-Not Enrolled, R-Active, K-Disabled by settlement"
            example: ACTIVE
            enum:
            - ACTIVE
            - DISABLED
            - PENDING
            - NOT ENROLLED
          lastUpdatedDateTime:
            maxLength: 26
            pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}:[0-9]{6}"
            type: string
            description: Status change date and time
            format: Using ISO 8601 yyyy-MM-dd'T'HH:mm:ssZ
            example: 2021-05-20T01:56:35.000-04:00
        description: EverdayFunding product enrollment status
      PaymentAcceleraterDetail:
        type: object
