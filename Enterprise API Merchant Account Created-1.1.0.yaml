          errors:
          - errorCode: ERROR_AUTHORIZATION_SAML
            errorMessage: Invalid API key. Please ensure the key is accurate and authorization
      "403Forbidden":
        value:
          errors:
          - errorCode: ERROR_AUTHORIZATION_SAML
            errorMessage: The credential provided failed to authorize
      "404NotFound":
        value:
          errors:
          - errorCode: ERROR_NOTFOUND
            errorMessage: Notificationid not found
      "410Gone":
        value:
          errors:
