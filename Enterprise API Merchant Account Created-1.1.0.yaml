            $ref: '#/components/schemas/PhoneNumberExt'
          phoneType:
            $ref: '#/components/schemas/PhoneType'
          alternatePhone:
            $ref: '#/components/schemas/AlternatePhone'
          alternatePhoneType:
            $ref: '#/components/schemas/AlternatePhoneType'
          faxNumber:
            $ref: '#/components/schemas/FaxNumber'
