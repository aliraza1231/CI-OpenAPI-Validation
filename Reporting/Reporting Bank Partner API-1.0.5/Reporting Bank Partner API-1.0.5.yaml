---
openapi: 3.0.0
info:
  title: "Reporting: Bank Partner API"
  description: "This API would be used to fetch settled summaries at independent sales channel . \n # Authentication \n<SecurityDefinitions />"
  contact:
    name: Developer Support
    email: APICustomerIntegration@fisglobal.com
  version: 1.0.5
servers:
- url: https://apis.cert.worldpay.com/merchant-reporting/bankpartnerreporting/v1
paths:
  /independentsaleschannels:
    get:
      tags:
      - ISC Details
      summary: This endpoint is used to retrieve the list of independent sales channel.
      description: Retrieves list of independent sales channel based on the license in use.
      operationId: getListOfIndependentSalesChannel
      responses:
        "200":
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  allOf:
                  - $ref: '#/components/schemas/ISCDetailsResponse'
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
  /revenues/summary/parties:
    post:
      tags:
      - Revenue
      summary: This endpoint is used to retrieve revenue summary by parties.
      description: "Amount (USD) to be receive per transaction. Revenue Endpoints provides drill down details contributing to gross revenue and settled volume. It  provides trend of revenue by considering effective rate, revenue earned per transaction and VAS (Value Added Services) for chains that falls under ISCs aligned with the partners."
      operationId: searchSummaryByParties.
      parameters:
      - name: v-correlation-id
        in: header
        description: A unique identifier value attached to a request
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          minLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
        example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevenueByPartyRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summaries'
              examples:
                summaries:
                  value:
                    summaries:
                    - party: AcquireCore
                      processMonth: 2017-06
                      totalProcessingRate: 5.54
                      totalEffectiveRate: 1.57
                    - party: AcquireNonCore
                      processMonth: 2017-06
                      totalProcessingRate: 8.12
                      totalEffectiveRate: 4.98
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
