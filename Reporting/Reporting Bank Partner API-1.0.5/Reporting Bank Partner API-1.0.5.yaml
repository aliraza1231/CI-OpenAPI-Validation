components:
  schemas:
    RevenueByPartyRequest:
      required:
      - independentSalesChannelCodes
      - monthRange
      type: object
      properties:
        independentSalesChannelCodes:
          type: array
          description: Independent sales channel value provides a secondary entity under the independent sales organization hierarchy level.
          example:
          - MTBCON
          - MTBNEW
          items:
            maxLength: 256
            type: string
        parties:
          type: array
          description: Individual or entity that is involved in a transaction.
          items:
            maxLength: 256
            type: string
            example: "[\"ACQUIRE\",\"ACQUIRE_NON_CORE\"]"
            enum:
            - ACQUIRE_CORE
            - ACQUIRE_NON_CORE
            - GATEWAY
            - INTERCHANGE
            - NETWORK
            - THIRD_PARTY
        monthRange:
          type: object
          description: Month Range for which the transaction is processed.
          allOf:
          - $ref: '#/components/schemas/MonthRange'
        sortResultsBy:
          type: object
          description: Used to sort the results.
          allOf:
          - $ref: '#/components/schemas/SortRevenueParty'
    RevenueByVerticalsRequest:
      required:
      - independentSalesChannelCodes
      - monthRange
      type: object
      properties:
        independentSalesChannelCodes:
          type: array
          description: Independent sales channel value provides a secondary entity under the independent sales organization hierarchy level.
          example:
          - MTBCON
          - MTBNEW
          items:
            maxLength: 256
            type: string
        verticals:
          type: array
          description: Indicates a specific industry or market carried out by the Organization
          items:
            maxLength: 15
            type: string
            example: "[\"B2B\",\"DRUG_STORES\"]"
            enum:
            - B2B
            - DRUG_STORES
            - GOVERNMENT
            - HEALTH_SERVICES
            - NONE
            - PETROLEUM
            - RESTAURANT
            - RESTAURANTQSR
            - RETAIL
            - SUPERMARKETS
            - TRAVEL
        monthRange:
          type: object
          description: Month Range for which the transaction is processed.
          allOf:
          - $ref: '#/components/schemas/MonthRange'
        sortResultsBy:
          type: object
          description: Used to sort the results.
          allOf:
          - $ref: '#/components/schemas/SortRevenueVertical'
    RevenueVASRequest:
      required:
      - independentSalesChannelCodes
      - monthRange
      type: object
      properties:
        independentSalesChannelCodes:
          type: array
          description: Independent sales channel value provides a secondary entity under the independent sales organization hierarchy level.
          example:
          - MTBCON
          - MTBNEW
          items:
            maxLength: 256
            type: string
        monthRange:
          type: object
          description: Month Range for which the transaction is processed.
          allOf:
          - $ref: '#/components/schemas/MonthRange'
        sortResultsBy:
          type: object
          description: Used to sort the results.
          allOf:
          - $ref: '#/components/schemas/SortRevenue'
    SortRevenue:
      type: object
      properties:
        fieldName:
          type: string
          description: List of fields for ordering the result set. <br> By default sorting will be done by GROSS_REVENUE.
          example: GROSS_REVENUE
          enum:
          - GROSS_REVENUE
          - VALUES_ADDED_SERVICE
          - NUMBER_OF_CHAINS
        orderBy:
          type: string
          description: Type of Ordering. Default - ASC
          example: ASC
          enum:
          - ASC
          - DESC
    SortPartner:
      type: object
      properties:
        fieldName:
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order. <br> By default sorting will be done by PROCESS_MONTH .
          example: PROCESS_MONTH
          enum:
          - GROSS_REVENUE
          - PROCESS_REVENUE
          - SETTLED_AMOUNT
          - SETTLED_COUNT
          - SETTLED_AVERAGE_TICKET
          - TOTAL_EFFECTIVE_RATE
          - PROCESS_MONTH
        orderBy:
          type: string
          description: Type of Ordering. Default - ASC
          example: ASC
          enum:
          - ASC
          - DESC
    SortPartnerCardNetwork:
      type: object
      properties:
        fieldName:
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order. <br> By default sorting will be done by CARD_NETWORK.
          example: CARD_NETWORK
          enum:
          - GROSS_REVENUE
          - PROCESS_REVENUE
          - SETTLED_AMOUNT
          - SETTLED_COUNT
          - CARD_NETWORK
        orderBy:
          type: string
          description: Type of Ordering. Default - ASC
          example: ASC
          enum:
          - ASC
          - DESC
    SortPartnerVertical:
      type: object
      properties:
        fieldName:
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order. <br> By default sorting will be done by VERTICAL.
          example: VERTICAL
          enum:
          - GROSS_REVENUE
          - PROCESS_REVENUE
          - SETTLED_AMOUNT
          - SETTLED_COUNT
          - VERTICAL
        orderBy:
          type: string
          description: Way of ordering the result. Default - ASC.
          example: ASC
          enum:
          - ASC
          - DESC
    SortRevenueVertical:
      type: object
      properties:
        fieldName:
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order. <br> By default sorting will be done by PROCESS_MONTH.
