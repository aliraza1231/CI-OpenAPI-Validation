        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryVerticals'
              examples:
                summary:
                  value:
                    summaries:
                    - vertical: B2B
                      processMonth: 2017-06
                      totalProcessingRate: 5.54
                      totalEffectiveRate: 1.57
                    - vertical: DRUG_STORES
