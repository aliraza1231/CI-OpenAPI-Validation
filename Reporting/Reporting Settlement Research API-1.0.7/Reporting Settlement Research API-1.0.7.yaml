              SettleTxnMandatorySearchReqExample:
                value:
                  pagination:
                    pageNumber: "0"
                    pageSize: "25"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  hierarchy:
                  - level: DIVISION
                    values: "001"
                    chainCode: "000086"
                  dateType: PROCESS_DATE
                  dateRange:
                    fromDate: 2020-07-28
                    toDate: 2020-08-31
