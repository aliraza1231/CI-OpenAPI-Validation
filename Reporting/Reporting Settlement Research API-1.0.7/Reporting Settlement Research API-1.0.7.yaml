                  pagination:
                    pageNumber: "1"
                    pageSize: "25"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  hierarchy:
                  - level: MERCHANT
                    values: "4445045300324"
                  dateType: TRANSACTION_DATE
                  dateRange:
                    fromDate: 2020-07-28
                    toDate: 2020-08-31
                  cardTypes:
                  - CREDIT
                  - DEBIT
              SettleTxnMandatoryandfilterbycardnetworkSearchReqExample:
                value:
                  pagination:
                    pageNumber: "0"
                    pageSize: "25"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  hierarchy:
                  - level: DIVISION
                    values: "001"
                    chainCode: "000086"
                  dateType: PROCESS_DATE
                  dateRange:
                    fromDate: 2020-07-28
                    toDate: 2020-08-31
                  cardTypes:
                  - CREDIT
                  cardNetwork:
                  - AMEX
                  - VISA
              SettleTxnMandatoryandfilterbytransactionamountSearchReqExample:
                value:
                  pagination:
                    pageNumber: "1"
                    pageSize: "25"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  hierarchy:
                  - level: DIVISION
                    values: "001"
                    chainCode: "000086"
                  dateType: TRANSACTION_DATE
                  dateRange:
                    fromDate: 2020-07-28
                    toDate: 2020-08-31
                  transactionAmountRange:
                    fromAmount: 100.09
                    toAmount: 200.89
              SettleTxnSearchReqExample:
                value:
                  pagination:
                    pageNumber: "0"
                    pageSize: "25"
                  sortResultsBy:
                    fieldName: TRANSACTION_DATE_TIME
                    orderBy: ASC
                  hierarchy:
                  - level: DIVISION
                    values: "001"
                    chainCode: "000086"
                  cardTypes:
                  - CREDIT
                  - DEBIT
                  cardNetwork:
                  - BML_CORE
                  - VISA
                  dateRange:
                    fromDate: 2022-07-28
                    toDate: 2022-07-28
                  referenceNumber: "65678787979"
                  transactionTypeCode: IP
                  transactionStatusCode: AA
                  customerFields:
                    field1: "565656"
                    field2: "6767676"
                    field3: "534323"
