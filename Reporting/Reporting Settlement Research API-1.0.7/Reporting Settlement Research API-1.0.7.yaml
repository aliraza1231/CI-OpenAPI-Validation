  contact:
    name: Developer Support
    email: APICustomerIntegration@fisglobal.com
  version: 1.0.7
servers:
- url: https://apis.stage.worldpay.com/merchant-reporting/settlementresearch/v1
security:
- api_key: []
tags:
- name: Settlements
  description: Resources to retrieve the settlement transactions
- name: Settlement Errors
  description: Resources to retrieve the settlement transactions rejections
paths:
  /settlements/search:
    post:
      tags:
      - Settlements
      summary: Retrieve settled transactions for a given hierarchy and a date range.
      description: Endpoint is used to retrieve the settled transaction details for a given hierarchy and date range. It helps the user to perform a search based on optional fields.
      operationId: searchSettlements
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation Id
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
          type: string
          format: uuid
          example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSettleTransactionsRequest'
