          description: Refers to the settled amount between the parties.
          format: double
          example: 3445.56
        authorizationCurrency:
          maxLength: 3
          type: object
          description: Authorization Currency Code defines alpha codes and numeric codes for the representation of currencies and provides information about the relationships between individual currencies and their minor units. Code is as per ISO Standard country code for United States".
          example:
            code: 840
            shortDescription: USA
            longDescription: USA
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        referenceNumber:
          maxLength: 16
          type: string
          description: Refers to a key to uniquely identify a card transaction based on the ISO 8583 standard.
          example: "2444600338440029"
        entryMode:
          type: object
          description: POS Entry Mode defines the conditions under which the card account number/PAN is entered and the terminal PIN capabilities.
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        avsResponseCode:
          type: object
          description: "Address Verification Service (AVS) data is the address and/or zip code of the cardholder. AVS data is only valide for credit.AVS data is not valid for fleet, debit, or EBT cards.Store policy dictates if a transaction is approved or denied based on the AVS response. ( Length - 2 Characters)"
