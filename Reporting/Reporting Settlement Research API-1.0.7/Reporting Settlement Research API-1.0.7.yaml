          description: Transaction id is a number generated from the electronic transafer of funds. It is a unique identifier that is generated with every card transaction. (a 12-18 digit code)
          example: "141710009519"
        transactionDateTime:
          maxLength: 19
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}[T]{1}[0-9]{2}:[0-9]{2}:[0-9]{2}"
          type: string
          description: Refers to the date and time when the bank has settled the transaction (deposits or withdraws funds).
          format: YYYY-MM-DDThh:mm:ss
          example: 2016-07-19T16:41:31
        processDate:
          maxLength: 10
          pattern: "[0-9]{4}-[0-9]{2}-[0-9]{2}"
          type: string
          description: Refers to the date when the transaction has been processed for settlement between the two parties.
          format: YYYY-MM-DD
          example: 2021-07-19
        transactionType:
          type: object
          description: Indicates the type of transaction that involves funds transfers or a financial transaction.
          example:
            code: "253"
            description: SALE
            longDescription: SALE
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        transactionStatus:
          type: object
          description: Indicates the functions performed in a transaction.
          example:
            code: NC
            description: "DECLINE, PICKUP"
            longDescription: "DECLINE, PICK UP CARD"
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
