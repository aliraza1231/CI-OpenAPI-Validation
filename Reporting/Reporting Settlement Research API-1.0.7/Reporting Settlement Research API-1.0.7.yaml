  responses:
    default:
      description: Default errors
      headers:
        v-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            "204":
              $ref: '#/components/examples/204NoContent'
            "400 Bad Request":
              $ref: '#/components/examples/400BadRequest'
            "401 Unauthorized":
              $ref: '#/components/examples/401Unauthorized'
            "403 Forbidden":
              $ref: '#/components/examples/403Forbidden'
            "404 Not Found":
              $ref: '#/components/examples/404NotFound'
            "500 Server Error":
              $ref: '#/components/examples/500ServerError'
  examples:
    "204NoContent":
      value:
        message: No content
    "400BadRequest":
      value:
        errors:
        - errorMessage: No entries found with provided id.
    "401Unauthorized":
      value:
        errors:
        - errorMessage: Invalid API key. Please ensure the key is accurate and authorization is included.
    "403Forbidden":
      value:
        errors:
        - errorMessage: Resource
    "404NotFound":
      value:
        errors:
        - errorMessage: Resource Not Found
    "500ServerError":
      value:
        errors:
        - errorMessage: Internal Client Error
  headers:
    CorrelationId:
      description: Correlation ID
      required: true
      style: simple
      explode: false
      schema:
        maxLength: 36
        minLength: 36
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        type: string
        format: uuid
        example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
  securitySchemes:
    api_key:
      type: apiKey
      description: "``` License format is WORLDPAY license='xxxx'``` \n"
      name: Authorization
      in: header