components:
  schemas:
    SearchSettleTransactionsRequest:
      required:
      - dateRange
      - hierarchy
      type: object
      properties:
        pagination:
          type: object
          description: This is used to retrieve the numbers or marks used to indicate the sequence of pages.
          allOf:
          - $ref: '#/components/schemas/Paginationtype'
        sortResultsBy:
          type: object
          description: A field in a record that is used in determining the final sorted sequence of the records
          allOf:
          - $ref: '#/components/schemas/OrderByForSettledTransactionsType'
        hierarchy:
          type: object
          description: This object holds the entity and its hierarchy level
          allOf:
          - $ref: '#/components/schemas/EntityListType'
        dateType:
          maxLength: 16
          type: string
          description: Either processDate or transactionDate need to be passed but not both.
          example: PROCESS_DATE
          enum:
          - PROCESS_DATE
          - TRANSACTION_DATE
        dateRange:
          type: object
          description: "Refers to number of dates that includes a particular start and end date and all dates in between specific periods of time.<br> Date range supported<br><br>07 Days<br>Independent Sales Organization(SO)<br>Independent Sales Affiliate(SA)<br>National(NL)<br>Partner(PT)<br>Super Chain(SC)<br><br>45 days<br>Chain(CH), Merchant(MT)."
          allOf:
          - $ref: '#/components/schemas/Processdaterange'
        cardTypes:
          maxLength: 6
          type: string
          description: Types of card type supported for payments.
          example: "[\"CREDIT\",\"DEBIT\",\"GIFT\"]"
        cardNetworks:
          description: Network which facilitates the payment card transactions as per the card association.
          example: VISA
          allOf:
          - $ref: '#/components/schemas/CardNetworks'
        token:
          maxLength: 19
          type: integer
          description: Tokenization is a substitution for Primary AccountNumber (PAN) with proxy data. Tokenization limits the ability to conduct fraudulent payment transactions. A token value is numeric and is the same length as the card number. Max length is 19 characters.<br> Either CardNumber or Token is allowed.
          example: 123456789056789
        networkToken:
          maxLength: 20
          type: string
          description: Token associated to a transaction by the Card Network
          example: "3434343"
        referenceNumber:
          maxLength: 16
          type: string
          description: Refers to a key to uniquely identify a card transaction based on the ISO 8583 standard.
          example: "2444600338440029"
        transactionId:
          maxLength: 18
          minLength: 12
          type: string
          description: Transaction id is a number generated from the electronic transafer of funds. It is a unique identifier that is generated with every card transaction. (a 12-18 digit code)
          example: "141710009519"
        transactionTypeCode:
          maxLength: 3
          type: string
          description: Indicates the type of transaction that involves funds transfers or a financial transaction. <br> GA - ACTIVATION <BR> GAX- ACTVN REVSL <BR> GB- ADDRESS VERIFY <BR> GC- BAL TRNSFR <BR> GCX- BALANCE INQUIRY <BR> GE- CARD FROM TOKEN <BR> GEX- CASH ADVANCE <BR> GF- CLOSE <BR> GFX- CLOSE REVERSAL <BR> GK- CNVRT HV LVT <BR> GL- INACTIVITY FEES <BR> GLX- MAIL ORDER<BR> GM- MAIL/PHO ADVICE<BR> GP- MAKE KEY ADVCON<BR> GPX- MAKE KEY ADVICE<BR> GS- MAKE KEY ADVSTG<BR> GU- MAKE KEY REQUES<BR> GUX- MINISTMT<BR> GV- PARTIAL REVRSL<BR> GVX- PREAUT COMP REV<BR> GZ- PREAUTH COMPLTN<BR> GZX- PREAUTH REQUEST<BR> G1- PREAUTH RQ REV<BR> IC- PREPAID ACT REV<BR> IF- PREPAID ACTVN<BR> IL- PREPAID LD REV<BR> IM- PREPAID LOAD<BR> IP- PURCHASE<BR> IR- PARTIAL REVRSL<BR> IS- PURCHASE ADVICE<BR> IV- PURCHASE REVRSL<BR> IX- REFUND<BR> KA- REFUND REVERSAL<BR> KC- RELOAD<BR> KM- RELOAD REVERSAL<BR> KS- REVERSAL<BR> MM- REVERSAL<BR> MP- STATUS/UNSTATUS<BR> RF- TOKEN FROM CARD<BR> RL- UNLOAD<BR> TC- UNLOAD REVERSAL<BR> TK- VIRTL ACTVN<BR> TR- VIRTL ACTVN REV<BR> 00- INCOMPLETE TRAN<BR> 01- DB WITH<BR> 02- DB WITH<BR> 06- SPECIAL TRAN<BR> 10- POS DB CRD PUR<BR> 11- POS DB CRD RET<BR> 12- POS DB INQ<BR> 13- POS PRE AUTH DB<BR> 14- POS PRE ATH<BR> 15- POS DB INQ<BR> 16- POS PRE AUTH DB<BR> 17- POS PRE ATH<BR> 25- CHECK VERIFY<BR> 29- POS CR CRD PUR<BR> 30- POS CR CRD RET<BR> 31- POS CR CRD PUR <BR> 32- POS CR CRD RET <BR> 38- CC AUTH <BR> 39- CC COMPLETION <BR> 40- CC AUTH <BR> 41- CC COMPLETION <BR> 48- INTERBANK DR <BR> 49- INTERBANK CR <BR>
          example: GA
          enum:
          - GA
          - GAX
          - GB
          - GC
          - GCX
          - GE
          - GEX
          - GF
          - GFX
          - GK
          - GL
          - GLX
          - GM
          - GP
          - GPX
          - GS
