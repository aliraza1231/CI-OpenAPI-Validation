        style: simple
        explode: false
        schema:
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
        example: 3fcb1437-4e52-4946-9ae1-e618351b6d16
    securitySchemes:
      api_key:
        type: apiKey
        description: "``` License format is WORLDPAY license='xxxx'``` \n"
        name: Authorization
        in: header
  