        allOf:
        - $ref: '#/components/schemas/CommonSummaryResponses'
        - type: object
          properties:
            summaries:
              type: array
              items:
                type: object
                allOf:
                - $ref: '#/components/schemas/CommonSummaryDetail'
                - $ref: '#/components/schemas/DepositSummaryDetailEntityChain'
      DepositSummarySuperChainResponse:
        allOf:
        - $ref: '#/components/schemas/CommonSummaryResponses'
        - type: object
          properties:
            summaries:
              type: array
              items:
                type: object
                allOf:
                - $ref: '#/components/schemas/CommonSummaryDetail'
                - $ref: '#/components/schemas/DepositSummaryDetailEntitySuperChain'
      DepositSummaryDetailEntityMerchant:
        type: object
        properties:
          merchantId:
            maxLength: 20
            type: string
            description: "The Merchant hierarchy level is the last level in the Vertical Hierarchy. MID is the unique identifier assigned for a processing location, business type, MCC Code that requires a specific value to define merchant authorizations, settlement, reporting, pricing and billing levels."
            example: "4445091034215"
      DepositSummaryDetailEntityChain:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: "172111"
      DepositSummaryDetailEntitySuperChain:
        type: object
        properties:
          superChainCode:
            maxLength: 10
            type: string
            description: The identifier code that represents the group of related chains of the partner.
            example: AC026
      EntityStoreResponse:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: "172111"
          storeNumber:
            maxLength: 9
            type: string
            description: "The Store/Location is the lowest roll-up level in the hierarchy system, grouping multiple merchant account numbers (MIDs) used in a single merchant location assigned to different terminals and/or business lines (MCC’s). A Store Number is of 9 digits and unique to a particular Chain meaning same Store Number can exist for a Store under a different Divison/Chain but no duplicates under the same Divison/Chain. <br> Supports entities Chain, National."
            example: "000000001"
      EntityDivisionResponse:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: "172111"
          divisionNumber:
            maxLength: 3
            type: string
            description: "The Division Number is a hierarchy level that enables merchants to roll-up child entities for Stores / Locations into different groups under a Chain. The Division Code is an optional hierarchy level but if created, is required for all child entities under the Division Number. <br> Supports entities Chain, National."
            example: "088"
      EntityListType:
        type: object
        description: "Supports entities such as SalesOrganization/Sales Channel limit 1 Entity<br>National, SuperChain, Partner with maximum limit of 10 entities<br>Chain, Division, Store and Merchant with maximum limit of 2000 entities."
        allOf:
        - $ref: '#/components/schemas/Entity'
      Entity:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: MERCHANT
            enum:
            - MERCHANT
            - STORE
            - DIVISION
            - CHAIN
            - PARTNER
            - SUPERCHAIN
            - NATIONAL
            - INDEPENDENT_SALES_CHANNEL
            - INDEPENDENT_SALES_ORGANIZATION
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "4445001234567"
            - "4445002345678"
            items:
              maxLength: 2000
              type: string
          chainCode:
            maxLength: 6
            type: string
