---
  openapi: 3.0.0
  info:
    title: "Reporting: Deposit Summary API"
    description: "Retrieve deposit summaries and supports group by operations. \n # Authentication \n<SecurityDefinitions />"
    contact:
      name: Developer Support
      email: APICustomerIntegration@fisglobal.com
    version: 1.0.12
  servers:
  - url: https://apis.stage.worldpay.com/merchant-reporting/depositsummary/v2
  paths:
    /deposits/summary:
      post:
        tags:
        - Deposit Summary
        summary: Resource to get total summary of deposits.
        description: Resource to get total summary of deposits for given hierarchy and date range. Refer to the  schema object for the allowed hierarchies and specifications.
        operationId: Summary
        parameters:
        - name: v-correlation-id
          in: header
          description: Correlation Id.
          required: false
          style: simple
          explode: false
          schema:
            maxLength: 36
            minLength: 36
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            type: string
            format: uuid
          example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryRequest'
              examples:
                SearchSummaryByMandatoryFields:
                  value:
                    hierarchy:
                      level: MERCHANT
                      values:
                      - "4445000123456"
                      - "4345023507756"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-12
                SearchSummaryByHierarchyLevel-Merchant:
                  value:
                    hierarchy:
                      level: MERCHANT
                      values:
                      - "4445000123456"
                      - "4345023507756"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-12
                SearchSummaryByHierarchyLevel-Chain:
                  value:
                    hierarchy:
                      level: CHAIN
                      values:
                      - AB1234
                      - "111217"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-12
                SearchSummaryByHierarchyLevel-Store:
                  value:
                    hierarchy:
                      level: STORE
                      values:
                      - "0000123"
                      - "0000456"
                    chainCode: AB1234
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-12
                SearchSummaryByHierarchyLevel-Division:
                  value:
                    hierarchy:
                      level: DIVISION
                      values:
                      - "356"
                      - "453"
                    chainCode: AB1234
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-12
          required: true
        responses:
          "200":
            description: OK.
            headers:
              v-correlation-id:
                $ref: '#/components/headers/CorrelationId'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DepositSummary'
                examples:
                  Summary:
                    value:
                      totalCreditsCount: 7346
                      totalCreditedAmount: 2353785.11
                      totalDebitsCount: 3574
                      totalDebitedAmount: 84464.28
                      totalNetAmount: 2269320.83
          default:
            description: Default errors
            headers:
              v-correlation-id:
                $ref: '#/components/headers/CorrelationId'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                examples:
                  "400 Bad Request":
                    $ref: '#/components/examples/400BadRequest'
                  "401 Unauthorized":
                    $ref: '#/components/examples/401Unauthorized'
                  "403 Forbidden":
                    $ref: '#/components/examples/403Forbidden'
                  "404 Not Found":
                    $ref: '#/components/examples/404NotFound'
                  "405 Method Not Allowed":
                    $ref: '#/components/examples/405MethodNotAllowed'
                  "415 UnSupported Media Type":
                    $ref: '#/components/examples/415UnSupportedMediaType'
                  "500 Server Error":
                    $ref: '#/components/examples/500ServerError'
        security:
        - api_key: []
