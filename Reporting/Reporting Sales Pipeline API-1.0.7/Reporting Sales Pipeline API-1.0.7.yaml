  responses:
    Default:
      description: Default errors
      headers:
        v-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            "400 Bad Request":
              $ref: '#/components/examples/400BadRequest'
            "401 Unauthorized":
              $ref: '#/components/examples/401Unauthorized'
            "403 Forbidden":
              $ref: '#/components/examples/403Forbidden'
            "404 Not Found":
              $ref: '#/components/examples/404NotFound'
            "500 Server Error":
              $ref: '#/components/examples/500ServerError'
  parameters:
    CorrelationId:
      name: v-correlation-id
      in: header
      description: Unique correlation id.
      required: false
      style: simple
      explode: false
      schema:
        maxLength: 36
        minLength: 36
        pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
        type: string
        format: uuid
      example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
  examples:
    "400BadRequest":
      description: Bad Request
      value:
        errors:
        - errorMessage: must not be blank
          target: "independentSalesChannelCodes[0]"
    "401Unauthorized":
      value:
        errors:
        - errorMessage: Invalid API key. Please ensure key is accurate and the Authorization is included.
          target: Authorization
    "403Forbidden":
      value:
        errors:
        - errorMessage: You are not authorized to access this resource.
    "404NotFound":
      value:
        errors:
        - errorMessage: "The entities with the following ids were not found: MTBCON123"
    "500ServerError":
      value:
        errors:
        - errorMessage: "Internal server error, please contact support referencing correlationId: 871a2a88-064f-4124-a864-e03a47573144"
  headers:
    CorrelationId:
      description: Unique correlation id.
      style: simple
      explode: false
      schema:
        maxLength: 36
        minLength: 36
        pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
        type: string
        format: uuid
      example: 3fcb1437-4e52-4946-9ae1-e618351b6d16
  securitySchemes:
    api_key:
      type: apiKey
      description: '``` License format is WORLDPAY license=''xxxx''```'
      name: Authorization
      in: header
