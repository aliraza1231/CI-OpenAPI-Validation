---
openapi: 3.0.0
info:
  title: "Reporting: Sales Pipeline API"
  description: "API used to retrieve Sales Pipeline Information. \n # Authentication \n<SecurityDefinitions />"
  contact:
    name: Developer Support
    email: APICustomerIntegration@fisglobal.com
  version: 1.0.7
servers:
- url: https://apis.stage.worldpay.com/merchant-reporting/sales-pipeline/v1
security:
- api_key: []
paths:
  /sales/summary/month:
    post:
      tags:
      - Sales
      summary: Sales summary grouped by month.
      description: Retrieves sales summary for independendent sales channel code(s) for selected month range.
      operationId: postSalesSummaryMonth
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation id
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          minLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
          example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSummaryMonthRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryMonthResponse'
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
