components:
  schemas:
    SortSalesSummaryMonth:
      type: object
      properties:
        fieldName:
          maxLength: 36
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order <br> By default sorting will be done by PROCESS_MONTH.
          example: PROCESS_MONTH
          enum:
          - PROCESS_MONTH
          - LEAD_COUNT
          - DISQUALIFIED_LEAD_COUNT
          - ACTIONABLE_LEAD_COUNT
          - ACTIONABLE_LEAD_PERCENTAGE
          - SIGNED_DEAL_COUNT
          - SIGNED_DEAL_RATIO
          - SIGNED_DEAL_PERCENTAGE
          - SIGNED_DEAL_AVERAGE_AMOUNT
          - SIGNED_DEAL_ESTIMATED_REVENUE_AMOUNT
          - ACTIVATED_ACCOUNTS
          - ACTIVATION_PERCENTAGE
          - AVERAGE_DAYS_TO_ACTIVATE
        orderBy:
          maxLength: 4
          type: string
          description: Type of ordering. <BR> ASC stands for ascending order. <BR> DESC stands for descending order.
          example: ASC
          enum:
          - ASC
          - DESC
      description: Sorting order for the search results of sales summary.
    SortLeadsSummaryMonth:
      type: object
      properties:
        fieldName:
          maxLength: 26
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order <br> By default sorting will be done by PROCESS_MONTH.
          example: PROCESS_MONTH
          enum:
          - PROCESS_MONTH
          - LEAD_COUNT
          - ACTIONABLE_LEAD_COUNT
          - SIGNED_DEAL_COUNT
          - SIGNED_DEAL_AVERAGE_AMOUNT
          - SIGNED_DEAL_PERCENTAGE
          - ACTIVATED_ACCOUNTS
        orderBy:
          maxLength: 4
          type: string
          description: Type of ordering. <BR> ASC stands for ascending order. <BR> DESC stands for descending order.
          example: ASC
          enum:
          - ASC
          - DESC
      description: Sorting order for the search results of leads summary.
    SortLeadsCountCategory:
      type: object
      properties:
        fieldName:
          maxLength: 8
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order <br> By default sorting will be done by CATEGORY.
          example: CATEGORY
          enum:
          - CATEGORY
          - COUNT
        orderBy:
          maxLength: 4
          type: string
          description: Type of ordering. <BR> ASC stands for ascending order. <BR> DESC stands for descending order.
          example: ASC
          enum:
          - ASC
          - DESC
      description: Sorting order for the search results of leads category.
    SortLeadsCountSource:
      type: object
      properties:
        fieldName:
          maxLength: 6
          type: string
          description: List of fields for sorting the result set. The result set is sorted in the given order <br> By default sorting will be done by SOURCE.
          example: SOURCE
          enum:
          - SOURCE
          - COUNT
        orderBy:
          maxLength: 4
          type: string
          description: Type of ordering. <BR> ASC stands for ascending order. <BR> DESC stands for descending order.
          example: ASC
          enum:
          - ASC
          - DESC
      description: Sorting order for the search results of leads source.
    SalesSummaryMonthRequest:
      required:
      - independentSalesChannelCodes
