          - $ref: '#/components/schemas/CodeAndDescription'
        authorizationComm:
          maxLength: 4
          type: string
          description: "Authorization communication refers to the process of transmitting and verifying permission or approvals for certain actions, transactions, or access to specific resources."
          example: "189"
        lineIPAddress:
          maxLength: 15
          type: string
          description: Refers to IP address
          example: 10.102.17.21
        merchantReferenceNumber:
          maxLength: 15
