          - OPEN
          - CLOSED
          - ERROR
        openDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Batch opened date
          format: YYYY-MM-DD
          example: 2021-12-06
        releasedDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
