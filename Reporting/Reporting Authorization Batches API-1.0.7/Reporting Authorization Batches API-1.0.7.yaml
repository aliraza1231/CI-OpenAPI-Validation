          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        cvv2ResponseCode:
          type: object
          description: "This field indicates card verification value, which used for payments."
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        terminalEMV:
          type: boolean
          description: possible values True or False
          example: true
        cardEMV:
          type: boolean
          description: "This field indicates the Card EMV Capability Flag , when it Set the value to Y if the card is EMV capable. Possible Values True or False"
          example: true
        isEMVOfflineTransaction:
          type: boolean
          description: An indication as to whether the EMV transaction was offline
          example: false
        isEMVTransaction:
          type: boolean
          description: Transaction in line with the EMV standards
          example: false
        actualAuthorizationCode:
          maxLength: 6
          type: string
          description: Authorization actual code refers to a unique code provided by a payment processor or financial institution that verifies the successful authorization of a transaction.
          example: 73994M
        networkIssuerCode:
          maxLength: 3
          type: string
          description: "Refers to a unique identifier assigned to financial institutions, such as banks or credit card issuers, that participate in electronic payment networks."
          example: VVS
        voucherNumber:
          maxLength: 10
          type: string
          description: Refers the unique reference number associated with a voucher.
          example: "888826"
        cardNumber:
          maxLength: 19
          type: string
          description: "This is the number found on the card used to make a purchase, also referred to as the bank card number."
          example: '**********0001'
        cardType:
          type: object
          description: Refers to the category or classification of a payment card based on the issuing network.
          example:
            code: C
            shortDescription: Credit
            longDescription: Credit
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        token:
          maxLength: 19
          type: string
          description: Tokenization is a substitution for primary account number (PAN) with proxy data. Tokenization limits the ability to conduct fraudulent payment transactions. A token value is numeric and is the same length as the card account number length. Max length of token is 19 characters.
          example: "374245111181117"
        tokenId:
          maxLength: 6
          type: string
          description: Token ID is a host-generated numeric value created during the tokenization process using a token key assigned to a merchant. This value is returned to the POS when tokenization is requested along with the token for utilization.
          example: A123GD
        tokenStatus:
          maxLength: 1
          type: string
          description: Token status
          example: "N"
        cardExpiryDate:
          maxLength: 7
          minLength: 7
          pattern: "^[0-9]{4}-[0-9]{2}$"
