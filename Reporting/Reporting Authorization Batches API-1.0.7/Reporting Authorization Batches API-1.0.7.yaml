          example: ABCD1234
        avsAddress:
          maxLength: 20
          type: string
          description: address Verification System - address
          example: 111 EDGE AVE
        feeCode:
          maxLength: 3
          type: string
          description: Fee Code
          example: WY
        posEntryMode:
          type: object
          description: Point of sale entry mode
          example:
            code: "01"
            shortDescription: MAN KEYED
            longDescription: KEY ENTERED
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        e2EEIndicator:
          type: boolean
          description: Refers to indicator of end to end encrypted. <br> Possible Value True and False.
          example: true
        cvv2PresenceIndicator:
