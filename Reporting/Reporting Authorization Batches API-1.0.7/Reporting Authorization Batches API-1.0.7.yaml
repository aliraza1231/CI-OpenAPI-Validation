          example: 2021-12
    GetBatchDetailsResponse:
      type: object
      properties:
        pageNumber:
          maximum: 9999
          minimum: 0
          type: integer
          description: Current page number returned.
          example: 1
        pageSize:
          maximum: 2000
          minimum: 0
          type: integer
          description: Total number of records returned per page.
          example: 50
        totalRowCount:
          maximum: 2000
          minimum: 0
          type: integer
          description: Total number of records meeting the search criteria.
          example: 85
        totalReturnedCount:
          maximum: 2000
          minimum: 0
          type: integer
          description: Total number of records returned in the response.
          example: 25
        merchantName:
          maxLength: 16
          minLength: 8
          type: string
          description: Merchant ID (card acceptor identification code)
          example: PRODDEV 122218
        merchantId:
          maxLength: 16
          minLength: 8
          type: string
          description: Merchant ID (card acceptor identification code)
          example: "1000910955961234"
        bankNumber:
          maxLength: 4
          minLength: 1
          type: integer
          description: the acquiring institution identification code (Bank ID)
          format: int32
          example: 1444
        batchInfo:
          description: Authorization Batch Details
          allOf:
          - $ref: '#/components/schemas/TerminalBatchDetail'
        transactionList:
          type: array
          description: Refers to transaction information
          items:
            allOf:
            - $ref: '#/components/schemas/TransactionLists'
      description: Detailed response for a batch
    GetBatchTransactionDetailsResponse:
      allOf:
      - $ref: '#/components/schemas/MerchantDetail'
      - $ref: '#/components/schemas/GetBatchTransactionDetails'
    GetBatchTransactionDetails:
      type: object
      properties:
        batchInfo:
          type: object
          description: Authorization Batch Details
          allOf:
          - $ref: '#/components/schemas/BatchDetail'
          - $ref: '#/components/schemas/TerminaltransactionDetail'
        transactionInfo:
          type: object
          description: Refers to the transaction information
          allOf:
          - $ref: '#/components/schemas/TransactionDetail'
      description: Full details on an individual transaction within the batch
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          type: object
          description: Refers to error details
          allOf:
          - $ref: '#/components/schemas/ErrorResponseError'
    ErrorResponseError:
      required:
      - errorMsg
      type: object
      properties:
        correlationId:
          maxLength: 36
          type: string
          description: Worldpay generated Correlation Id
          example: 3fcb1437-4e52-4946-9ae1-e618351b6d16
        errorCode:
          maxLength: 256
          type: string
          description: Code of error
          example: ERROR_CODE
        errorMessage:
          maxLength: 256
          type: string
          description: Error Message
          example: Error message here.
    CodeAndDescription:
      type: object
      properties:
        code:
          maxLength: 1
          type: string
          description: code.
          example: "01"
        shortDescription:
          maxLength: 255
          type: string
          description: Short Description.
          example: Short description of field
        longDescription:
          maxLength: 255
          type: string
          description: Long Description.
          example: Long description of field
  responses:
    default:
      description: Default errors
      headers:
        v-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            "400 Bad Request":
              $ref: '#/components/examples/400BadRequest'
            "401 Unauthorized":
              $ref: '#/components/examples/401Unauthorized'
            "403 Forbidden":
              $ref: '#/components/examples/403Forbidden'
            "404 Not Found":
              $ref: '#/components/examples/404NotFound'
            "405 Method Not Allowed":
              $ref: '#/components/examples/405MethodNotAllowed'
            "415 UnSupported Media Type":
              $ref: '#/components/examples/415UnSupportedMediaType'
            "500 Server Error":
              $ref: '#/components/examples/500ServerError'
  examples:
    "400BadRequest":
      value:
        errors:
        - errorMessage: must be numeric
          target: merchantId
    "401Unauthorized":
      value:
        errors:
        - errorMessage: "You are not authorized to access the following entities: [1000011111]"
    "403Forbidden":
      value:
        errors:
        - errorMessage: Access is denied
    "404NotFound":
      value:
        errors:
        - errorMessage: merchant not found
    "405MethodNotAllowed":
      value:
        errors:
        - errorMessage: Request method 'GET' is not supported
    "415UnSupportedMediaType":
      value:
        errors:
        - errorMessage: Content-Type 'text/plain;charset=UTF-8' is not supported
    "500ServerError":
      value:
        errors:
        - errorMessage: "Internal server error, please contact support referencing correlationId: 871a2a88-064f-4124-a864-e03a47573144"
  headers:
    CorrelationId:
      description: Unique correlation Id.
      style: simple
      explode: false
      schema:
        maxLength: 36
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        type: string
        format: uuid
      example: 3fcb1437-4e52-4946-9ae1-e618351b6d16
  securitySchemes:
    api_key:
      type: apiKey
      description: "``` License format is WORLDPAY license='xxxx'``` \n"
      name: Authorization
      in: header
