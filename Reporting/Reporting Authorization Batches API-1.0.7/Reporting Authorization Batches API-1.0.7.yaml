          format: float
          example: 10
        networkId:
          maxLength: 4
          type: string
          description: Network id refers to a unique identifier assigned to a computer network to distinguish it from other networks. It is a numerical or alphanumeric code that serves as the networks.
          example: STAR
        transactionResult:
          type: boolean
          description: Result of the transaction
          example: true
        isEcommTransaction:
          type: boolean
          description: Indicates if a transaction is ecomm
          example: true
        internalTPS:
          type: object
