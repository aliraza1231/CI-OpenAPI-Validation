---
openapi: 3.0.0
info:
  title: "Reporting: Authorization Batches API"
  description: "Search and retrieve batch transaction details for terminal merchants \n # Authentication \n<SecurityDefinitions />"
  contact:
    email: EnterpriseAPI@fisglobal.com
  version: 1.0.7
servers:
- url: https://apis.stage.worldpay.com/merchant-reporting/authorizationbatches/v1
paths:
  /batches/search:
    post:
      tags:
      - Authorization Batches
      summary: Resource is helpful when users need to find specific batches of data based on certain paramerters or filters.
      description: "Endpoint allows users to search for batches of data using specific criteria (date type, date range and merchant id). Refer to the schema object for the filters."
      operationId: searchBatches
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation ID
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          minLength: 36
          pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
          type: string
          format: uuid
        example: 24578e35-9bd2-238f-b4c2-0bc9ad9aed2b
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDetailsSearchRequest'
            examples:
              All Mandatory fields:
                value:
                  dateType: ' OPEN_DATE'
                  dateRange:
                    fromDate: 2021-10-26
                    toDate: 2021-10-27
                  merchantId: "1234910955961234"
              All fields:
                value:
                  dateType: RELEASED_DATE
                  dateRange:
                    fromDate: 2021-10-26
                    toDate: 2021-10-27
                  merchantId: "1234910955961234"
                  batchNumber: "111002"
                  batchStatus: Open
                  terminalNumber: "304"
                  paginationRequest:
                    pageSize: 25
                    pageNumber: 1
                  sortResultsBy:
                    fieldName: BATCH_STATUS
                    orderBy: ' DESC'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDetailsResponse'
              examples:
                Batch Details:
                  value:
                    pagination:
                      pageNumber: 0
                      pageSize: 19
                      totalRowCount: 19
                      totalReturnedCount: 19
                    merchantId: "1234910955961234"
                    merchantName: PRODDEV 122218
                    bankNumber: 1444
                    batchInfo:
                    - terminalNumber: 1
                      terminalSettlementType: MANUAL
                      batchNumber: "111002"
                      batchStatus: Closed
                      batchType: Auth
                      openDate: 2023-06-21
                      releasedDate: 2023-06-21
                      totalTransactionsAmount: 1.25
                      totalTransactionsCount: 1
                      processorErrorMessage: DENIED HEADER RECORD
                    - terminalNumber: 1
                      terminalSettlementType: MANUAL
                      batchNumber: "222001"
                      batchStatus: Closed
                      batchType: Auth
                      openDate: 2023-06-21
                      releasedDate: 2023-06-21
                      totalTransactionsAmount: 5.0
                      totalTransactionsCount: 2
                      processorErrorMessage: DENIED HEADER RECORD
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "405 Method Not Allowed":
                  $ref: '#/components/examples/405MethodNotAllowed'
                "415 UnSupported Media Type":
                  $ref: '#/components/examples/415UnSupportedMediaType'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
  /batches/transactions:
    get:
      tags:
      - Authorization Batches
      summary: Resource allows users to retrieve information about transactions that are grouped together in a batch.
      description: Resource provides to retrieve information about transactions that have been grouped and processed together in a batch. A batch is a collection of related transactions that are processed and managed together for reconciliation.
      operationId: GetBatchDetails
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation ID
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          minLength: 36
          pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
          type: string
          format: uuid
        example: 24578e35-9bd2-238f-b4c2-0bc9ad9aed2b
      - name: merchantId
        in: header
        description: Merchant ID (card acceptor identification code)
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 16
          minLength: 8
          type: string
          example: "1234910955961234"
      - name: batchNumber
        in: header
        description: Number of the batch
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 6
          minLength: 6
          type: string
          example: "111002"
      - name: bankNumber
        in: header
        description: the acquiring institution identification code (Bank ID)
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 4
          minLength: 1
          type: integer
          format: int32
          example: 1440
      - name: batchType
        in: query
        description: "Type of batch - AUTH, UPLOAD. <br>AUTH - Authorization batches captured by processing system (host). <br>UPLOAD - Batch uploaded by merchant from the terminal."
        required: true
        style: form
        explode: false
        schema:
          type: string
          example: AUTH
          enum:
          - AUTH
          - UPLOAD
      - name: openDate
        in: query
        description: Batch Opened date
        required: true
        style: form
        explode: false
        schema:
          maxLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          format: YYYY-DD-MM
          example: 2022-12-06
      - name: terminalNumber
        in: query
        description: The Unique identification number for every terminal of a merchant
        required: true
        style: form
        explode: false
        schema:
          maxLength: 3
          minLength: 1
          type: integer
          format: int32
          example: 5
      - name: pageSize
        in: query
        description: 'Number of record that you would want to retrieve per page <br> Default is 25 items per page. '
        required: false
        style: form
        explode: true
        schema:
          maxLength: 9999
          minLength: 1
          type: integer
          format: int32
        example: 100
      - name: pageNumber
        in: query
        description: 'This is the page number that you would like to retrieve <br> Default is page number 01 '
        required: false
        style: form
        explode: true
        schema:
          maxLength: 9999
          minLength: 1
          type: integer
          format: int32
        example: 4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatchDetailsResponse'
              examples:
                Batch Details:
                  value:
                    pageNumber: 0
                    pageSize: 25
                    totalRowCount: 3
                    totalReturnedRowCount: 3
                    merchantId: "1234498886731830"
                    merchantName: PRODDEV 122218
                    bankNumber: 1444
                    batchInfo:
                      batchNumber: "111002"
                      batchStatus: Closed
                      batchType: Auth
                      openDate: 2023-05-30
                      releasedDate: 2023-05-30
                      nextReleaseTime: 2023-05-31T11:31:00
                      adjustmentIndicator: true
                      fcsNumber: "2814911"
                      e2EEIndicator: false
                      terminalNumber: 31
                      terminalApplication: FAPING2K
                      terminalSettlementType: MANUAL
                      terminalActiveIndicator: true
                      totalSalesTransactionAmount: 435.04
                      totalSalesTransactionCount: 210
                      totalReturnsTransactionAmount: 211.05
                      totalReturnsTransactionCount: 24
                      totalTransactionsAmount: 545.13
                      totalTransactionsCount: 3
                      transactionList:
                      - transactionAmount: 321.09
                        transactionType:
                          code: BI
                          shortDescription: Batch Inquiry
                          longDescription: Batch Inquiry
                        transactionDateTime: 2023-05-30T11:31:19
                        transactionStatus:
                          code: "1"
                          shortDescription: INQUIRY
                          longDescription: INQUIRY
                        bankNetReferenceNumber: "723788333"
                        cardNumber: "6222225522395822"
                        cardType:
                          code: C
                          shortDescription: Credit
                          longDescription: Credit
                        retrievalReferenceNumber: 272629864323
                        sequenceNumber: "12"
                      - transactionAmount: 101.01
                        transactionType:
                          code: BR
                          shortDescription: Batch Release
                          longDescription: Batch Release
                        transactionDateTime: 2023-05-30T11:31:22
                        transactionStatus:
                          code: "5"
                          shortDescription: SETTLEMENT REC
                          longDescription: SETTLEMENT REC
                        bankNetReferenceNumber: "123786453"
                        cardNumber: "6333335522395822"
                        cardType:
                          code: C
                          shortDescription: Credit
                          longDescription: Credit
                        retrievalReferenceNumber: 28271198
                        sequenceNumber: "13"
                      - transactionAmount: 123.03
                        transactionType:
                          code: AJ
                          shortDescription: Credit Sale A
                          longDescription: Credit Sale Adjustment
                        transactionDateTime: 2023-05-30T16:29:40
                        transactionStatus:
                          code: "3"
                          shortDescription: AUTH AND COMP
                          longDescription: AUTHORIZED AND COMPLETED
                        networkTransactionId: 152615261811608
                        bankNetReferenceNumber: "223786433"
                        cardNumber: "5111125511395822"
                        cardType:
                          code: C
                          shortDescription: Credit
                          longDescription: Credit
                        retrievalReferenceNumber: 111630028037
                        sequenceNumber: "11"
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "405 Method Not Allowed":
                  $ref: '#/components/examples/405MethodNotAllowed'
                "415 UnSupported Media Type":
                  $ref: '#/components/examples/415UnSupportedMediaType'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
  /batches/transaction/{retrievalReferenceNumber}:
    get:
      tags:
      - Authorization Batches
      summary: Endpoint that allows users to retrieve detailed information about a specific batch of transactions associated with a given retrieval reference number.
      description: The Resource allows users to retrieve detailed information about a specific transaction within a batch. Users can pass the retrieval reference number in the API request to specify the transaction want to get the details.Specific transaction details within a batch can be used for reconciliation and reporting purposes.
      operationId: GetBatchTransactionDetails
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation ID
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          minLength: 36
          pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]-[0-9a-fA-F]{12}"
          type: string
          format: uuid
        example: 24578e35-9bd2-238f-b4c2-0bc9ad9aed2b
      - name: bankNumber
        in: header
        description: the acquiring institution identification code (Bank ID)
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 4
          minLength: 1
          type: integer
          format: int32
          example: 3456
      - name: merchantId
        in: header
        description: Merchant ID (card acceptor identification code)
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 16
          minLength: 8
          type: string
          example: "1000910955961234"
      - name: batchNumber
        in: header
        description: Number of the batch
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 6
          minLength: 6
          type: string
          example: "111002"
      - name: retrievalReferenceNumber
        in: path
        description: A unique identifier used to reference and locate the batch of transactions.
        required: true
        style: simple
        explode: false
        schema:
          maxLength: 12
          minLength: 12
          type: string
          example: "111119154359"
      - name: batchType
        in: query
        description: "Type of batch - AUTH, UPLOAD. <br>AUTH - Authorization batches captured by processing system (host). <br>UPLOAD - Batch uploaded by merchant from the terminal."
        required: true
        style: form
        explode: false
        schema:
          type: string
          example: AUTH
          enum:
          - AUTH
          - UPLOAD
      - name: openDate
        in: query
        description: Batch Opened date
        required: true
        style: form
        explode: false
        schema:
          maxLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          format: YYYY-MM-DD
          example: 2022-12-06
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatchTransactionDetailsResponse'
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "405 Method Not Allowed":
                  $ref: '#/components/examples/405MethodNotAllowed'
                "415 UnSupported Media Type":
                  $ref: '#/components/examples/415UnSupportedMediaType'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
components:
  schemas:
    BatchDetailsResponse:
      type: object
      properties:
        pagination:
          type: object
          description: Used for pagination.
          allOf:
          - $ref: '#/components/schemas/PaginationResponse'
        merchantId:
          maxLength: 16
          minLength: 8
          type: string
          description: A Merchant ID (card acceptor identification code) is a unique identifier assigned to a merchant by a payment processor or bank.
          example: "1000910955961234"
        merchantName:
          maxLength: 255
          minLength: 0
          type: string
          description: Refers to the name of a business or registered name of the company or entity operating the business.
          example: PRODDEV 122218
        bankNumber:
          maxLength: 4
          minLength: 1
          type: integer
          description: the acquiring institution identification code (Bank ID)
          format: int32
          example: 1444
        batchInfo:
          type: array
          description: Authorization batch details
          items:
            allOf:
            - $ref: '#/components/schemas/TerminalDetails'
            - $ref: '#/components/schemas/TerminalBatchDetails'
    BatchDetailsSearchRequest:
      required:
      - dateRange
      - dateType
      - merchantId
      type: object
      properties:
        dateType:
          type: string
          description: Type of date
          example: RELEASED_DATE
          enum:
          - ALL
          - OPEN_DATE
          - RELEASED_DATE
        dateRange:
          type: object
          description: Specifying start and end dates for transactions.
          allOf:
          - $ref: '#/components/schemas/DateRangeSearch'
        merchantId:
          maxLength: 16
          minLength: 8
          type: string
          description: "Merchant Number (also referred as MID) , sometimes this is combination of bank ID & alternate merchant number"
          example: "1000910955961234"
        batchNumber:
          maxLength: 6
          minLength: 6
          type: integer
          description: Batch number is a unique identifier assigned to a group of transaction that were handled together as a single unit.
          example: 111002
        batchStatus:
          type: string
          description: "The status of the batch - open, closed, error"
          example: CLOSED
          enum:
          - OPEN
          - CLOSED
          - ERROR
        terminalNumber:
          maxLength: 3
          minLength: 1
          type: integer
          description: The Unique identification number for every terminal of a merchant
          format: int32
          example: 5
        pagination:
          type: object
          description: Used for pagination.
          allOf:
          - $ref: '#/components/schemas/PaginationType'
        sortResultsBy:
          type: object
          description: Sort results by option for authorization batches.
          allOf:
          - $ref: '#/components/schemas/SortResultsBy'
      description: Request body for searching the batch
    DateRangeSearch:
      required:
      - fromDate
      - toDate
      type: object
      properties:
        fromDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Refer to the starting date of a particular period
          format: YYYY-MM-DD
          example: 2021-12-01
        toDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Refer to the period of time up until the current date
          format: YYYY-MM-DD
          example: 2021-12-01
      description: Specify the date range for search. Consumer can search upto 60 days of data in a single request.
    TerminalBatchDetails:
      type: object
      properties:
        batchNumber:
          maxLength: 6
          minLength: 6
          type: integer
          description: Batch number is a unique identifier assigned to a group of transaction that were handled together as a single unit.
          example: 111002
        batchStatus:
          type: string
          description: "The status of the batch - open, closed, error"
          example: CLOSED
          enum:
          - OPEN
          - CLOSED
          - ERROR
        batchType:
          type: string
          description: "Type of batch - AUTH, UPLOAD. <br>AUTH - Authorization batches captured by processing system (host). <br>UPLOAD - Batch uploaded by merchant from the terminal."
          example: AUTH
          enum:
          - AUTH
          - UPLOAD
        openDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Date when a batch of transactions is initiated for processing and settlement.
          format: YYYY-MM-DD
          example: 2021-12-06
        releasedDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Date when a group of transactions is processed and released for settlement.
          format: YYYY-MM-DD
          example: 2021-12-21
        totalTransactionsAmount:
          maximum: 1000000000000000
          minimum: 0
          type: number
          description: Total transactions amount refers to the sum of transactions that have taken place within a time period
          format: float
          example: 895623.02
        totalTransactionsCount:
          maximum: 9999999999999999
          minimum: 0
          type: integer
          description: Total transactions count refers to the complete number of transactions that have taken place within a time period
          format: int32
          example: 7845126
        processorErrorMessage:
          maxLength: 255
          type: string
          description: Error Message from processing Platform – RAFT
          example: DENIED HEADER RECORD
    SortResultsBy:
      type: object
      properties:
        fieldName:
          type: string
          description: Fields to sort the search results. <br> Default:OPEN_DATE
          example: BATCH_STATUS
          enum:
          - BATCH_STATUS
          - BATCH_NUMBER
          - TERMINAL_NUMBER
          - OPEN_DATE
          - RELEASED_DATE
        orderBy:
          type: string
          description: Decide the sorting order by ASC or DESC. <br> Default:ASC
          example: DESC
          enum:
          - ASC
          - DESC
    PaginationType:
      type: object
      properties:
        pageNumber:
          maxLength: 9999
          minLength: 1
          type: number
          description: This is the page number that you would like to retrieve.<br> Default is page number 0
          example: 2
          default: 0
        pageSize:
          maxLength: 2000
          minLength: 1
          type: number
          description: Number of record that you would want to retrieve per page. <br> Default is 25 times per page.
          example: 10
          default: 25
    MerchantDetail:
      type: object
      properties:
        merchantName:
          maxLength: 16
          minLength: 8
          type: string
          description: Merchant ID (card acceptor identification code)
          example: PRODDEV 122218
        merchantId:
          maxLength: 16
          minLength: 8
          type: string
          description: Merchant ID (card acceptor identification code)
          example: "1000910955961234"
        bankNumber:
          maxLength: 4
          minLength: 1
          type: integer
          description: the acquiring institution identification code (Bank ID)
          format: int32
          example: 1444
        merchantCategoryCode:
          maximum: 4
          type: integer
          description: Merchant category code is a four-digit number assigned to businesses by payment card networks. It helps identify the nature of merchant's business and the industry in which they operate.
          example: 5411
    TerminalBatchDetail:
      type: object
      properties:
        batchNumber:
          maxLength: 6
          minLength: 6
          type: integer
          description: Batch number is a unique identifier assigned to a group of transaction that were handled together as a single unit.
          example: 111002
        batchStatus:
          type: string
          description: "The status of the batch -open, closed, error"
          example: CLOSED
          enum:
          - OPEN
          - CLOSED
          - ERROR
        batchType:
          type: string
          description: "Type of batch - AUTH, UPLOAD. <br>AUTH - Authorization batches captured by processing system (host). <br>UPLOAD - Batch uploaded by merchant from the terminal."
          example: AUTH
          enum:
          - AUTH
          - UPLOAD
        openDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Batch opened date
          format: YYYY-MM-DD
          example: 2021-12-06
        releasedDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: The date batch was released
          format: YYYY-MM-DD
          example: 2021-12-21
        nextReleaseTime:
          maxLength: 19
          type: string
          description: Next release time of batch
          format: YYYY-MM-DDTHH:MM:SS
          example: 2017-08-21T13:49:36
        adjustmentIndicator:
          type: boolean
          description: identifies if batch contains adjustment
          example: false
        fcsNumber:
          maxLength: 10
          type: string
          description: FCS number( also referred as FNS number) is the unique number assigned by Food and Nutrition Service to merchants.<br> It is required to process EBT transactions.
          example: '***6682'
        e2EEIndicator:
          type: boolean
          description: Refers to indicator of end to end encrypted. <br> Possible Value True and False.
          example: false
        terminalNumber:
          maxLength: 3
          minLength: 1
          type: integer
          description: The Unique identification number for every terminal of a merchant
          format: int32
          example: 5
        terminalApplication:
          maxLength: 255
          minLength: 0
          type: string
          description: The payment software application installed on the Terminal
          example: ABC Software Inc
        terminalSettlementType:
          type: string
          description: "The type of settlement for a terminal. <br> Possible values are - \"UPLOAD\",\"AUTO_CLOSE\",\"MANUAL\""
          example: UPLOAD
          enum:
          - UPLOAD
          - AUTO_CLOSE
          - MANUAL
        terminalActiveIndicator:
          type: boolean
          description: identifies if terminal is active or not
          example: true
        totalSalesTransactionAmount:
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: Total value of sales during a specific financial transaction or period.
          format: double
          example: 2654
        totalSalesTransactionCount:
          maximum: 9999999999999999
          minimum: 0
          type: integer
          description: Total Sales Count
          format: int32
          example: 18
        totalReturnsTransactionAmount:
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: Total Returned Amount
          format: double
          example: 2654
        totalReturnsTransactionCount:
          maximum: 9999999999999999
          minimum: 0
          type: integer
          description: Total return Count
          format: int32
          example: 12
        totalTransactionsAmount:
          maximum: 9999999999999.99
          minimum: 0
          type: number
          description: Refers to the amount left over after all deductions are made. <br> Total Transactions Amount = Sales Amount - Returns Amount
          format: double
          example: 39115.21
        totalTransactionsCount:
          maximum: 9999999999999999
          minimum: 0
          type: integer
          description: Total Count of the transactions <br> Total Transactions Count = Sales Count + Returns Count
          format: int32
          example: 7845126
        processorErrorMessage:
          maxLength: 255
          type: string
          description: Error Message from processing Platform – RAFT
          example: DENIED HEADER RECORD
    BatchDetail:
      type: object
      properties:
        batchNumber:
          maxLength: 6
          minLength: 6
          type: integer
          description: Batch number is a unique identifier assigned to a group of transaction that were handled together as a single unit.
          example: 111002
        batchStatus:
          type: string
