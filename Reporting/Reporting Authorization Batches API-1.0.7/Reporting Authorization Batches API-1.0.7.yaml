          - $ref: '#/components/schemas/CodeAndDescription'
        retrievalReferenceNumber:
          maxLength: 12
          minLength: 12
          type: integer
          description: A unique identifier used to reference and locate the batch of transactions.
          example: 9154359
        sequenceNumber:
          maxLength: 12
          minLength: 12
          type: string
          description: Sequence Number (system trace Audit number or STAN)
          example: "154359"
      description: Refers to transaction information
    PaginationResponse:
      type: object
