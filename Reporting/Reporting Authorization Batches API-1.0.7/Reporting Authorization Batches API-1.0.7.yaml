          description: "The Authorization Code is a six digit number from the issuing bank to the vendor, authorizing a sale."
          example: 73883M
        paymentType:
          maxLength: 6
          type: string
          description: "Payment type refers to the method or mechanism used to transfer funds from one party to another in exchange for goods, services, or debts."
          example: DEBIT
        isAuthenticationTransaction:
          type: boolean
          description: Authentication transaction refers to a process where an individual or entity's identity is verified and validated.
          example: true
        aci:
          type: object
          description: Authorization characteristics indicator is a data element used in financial transactions to indicate specific authorization characteristics associated with a payment request.
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        ani:
          maxLength: 10
          type: string
          description: Automatic number identification is a technology used in telecommunications to automatically identify and display the phone number of call.
          example: "5551234567"
        rPIN:
          maxLength: 10
          type: string
          description: Refers to resident permanent indentification number.
          example: ABCDE1234F
        cashBackAmount:
