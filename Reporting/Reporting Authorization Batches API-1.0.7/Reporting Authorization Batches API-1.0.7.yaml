          description: Number of record that you would want to retrieve per page.
          format: int32
          example: 50
          default: 25
        totalRowCount:
          maximum: 2000
          type: integer
          description: Total number of records meeting the search criteria
          format: int32
          example: 45
        totalReturnedCount:
          maximum: 2000
          type: integer
          description: Total number of records returned in the response
          format: int32
          example: 25
      description: Pagination response details
    TerminalDetails:
      type: object
