          description: TimeStamp of transaction
          format: YYYY-MM-DDThh:mm:ss
          example: 2023-01-09T15:43:59
        transactionStatus:
          type: object
          description: "This field refers to the transaction status code received at the time a purchase is being made, including the status code,short and long descriptions."
          example:
            code: "2"
            shortDescription: DENIED
            longDescription: DENIED
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        sequenceNumber:
          maxLength: 12
          minLength: 12
          type: string
          description: Sequence Number (system trace Audit number or STAN)
          example: "124259"
        retrievalReferenceNumberOriginal:
          maxLength: 12
          minLength: 12
          type: string
          description: Original Retrival Reference Number
          example: "111119154359"
        retrievalReferenceNumberExpected:
          maxLength: 12
          minLength: 12
          type: string
          description: Expected Retrival Reference Number
          example: "123455432123"
        authenticationNumber:
          maxLength: 6
