          example: 2021-12-21
        expectedSettlementDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Refers to the anticipated date when a financial transaction is expected to be completed and funds are transferred between parties.
          format: YYYY-MM-DD
          example: 2021-08-21
    TransactionLists:
      type: object
