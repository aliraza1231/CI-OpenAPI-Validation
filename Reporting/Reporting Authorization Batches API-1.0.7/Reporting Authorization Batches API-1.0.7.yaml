          description: The Unique identification number for every terminal of a merchant
          format: int32
          example: 5
        terminalSettlementType:
          type: string
          description: "The type of settlement for a terminal. <br> Possible values are - \"UPLOAD\",\"AUTO_CLOSE\",\"MANUAL\""
          example: UPLOAD
          enum:
          - UPLOAD
          - AUTO_CLOSE
          - MANUAL
    TerminaltransactionDetail:
      type: object
      properties:
        terminalNumber:
          maxLength: 3
          minLength: 1
          type: integer
          description: The Unique identification number for every terminal of a merchant
          format: int32
          example: 5
        iiasCertified:
          type: boolean
          description: Inventory Information Approval System
          example: false
        terminalType:
          maxLength: 2
          type: string
          description: Refer to device used in payments to process card transactions and authorize payments.
          example: "03"
        terminalApplication:
          maxLength: 255
          minLength: 0
          type: string
          description: "Software for managing transactions, payments, or data in a specific location or device like a point-of-sale system."
          example: ABC Software Inc
        registerNumber:
          maxLength: 4
          type: string
          description: Unique id of point-of-sale terminals to identify and track transactions securely and accurately
          example: "1111"
    TransactionDetail:
      type: object
      properties:
        retrievalReferenceNumber:
          maxLength: 12
          minLength: 12
