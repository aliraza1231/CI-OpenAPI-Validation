    responses:
      default:
        description: Default errors
        headers:
          v-correlation-id:
            $ref: '#/components/headers/CorrelationId'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              "400 Bad Request":
                $ref: '#/components/examples/400BadRequest'
              "401 Unauthorized":
                $ref: '#/components/examples/401Unauthorized'
              "403 Forbidden":
                $ref: '#/components/examples/403Forbidden'
              "404 Not Found":
                $ref: '#/components/examples/404NotFound'
              "405 Method Not Allowed":
                $ref: '#/components/examples/405MethodNotAllowed'
              "415 UnSupported Media Type":
                $ref: '#/components/examples/415UnSupportedMediaType'
              "500 Server Error":
                $ref: '#/components/examples/500ServerError'
    examples:
      "400BadRequest":
        value:
          errors:
          - errorMessage: must be numeric
            target: merchantId
      "401Unauthorized":
        value:
          errors:
          - errorMessage: "You are not authorized to access the following entities: [1000011111]"
      "403Forbidden":
        value:
          errors:
          - errorMessage: Access is denied
      "404NotFound":
        value:
          errors:
          - errorMessage: merchant not found
      "405MethodNotAllowed":
        value:
          errors:
          - errorMessage: Request method 'GET' is not supported
      "415UnSupportedMediaType":
        value:
          errors:
          - errorMessage: Content-Type 'text/plain;charset=UTF-8' is not supported
      "500ServerError":
        value:
          errors:
          - errorMessage: "Internal server error, please contact support referencing correlationId: 871a2a88-064f-4124-a864-e03a47573144"
    headers:
      CorrelationId:
        description: Unique correlation Id.
        style: simple
        explode: false
        schema:
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
        example: 3fcb1437-4e52-4946-9ae1-e618351b6d16
    securitySchemes:
      api_key:
        type: apiKey
        description: "``` License format is WORLDPAY license='xxxx'``` \n"
        name: Authorization
        in: header
  