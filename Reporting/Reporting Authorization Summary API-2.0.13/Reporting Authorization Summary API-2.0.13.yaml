  components:
    schemas:
      PaginationType:
        type: object
        properties:
          pageNumber:
            maximum: 9999999999999999
            minimum: 0
            type: integer
            description: This is the page number that you would like to retrieve<br>Default is page number 01.
            example: 2
            default: 1
          pageSize:
            maximum: 9999999999999999
            minimum: 0
            type: integer
            description: Number of record that you would want to retrieve per page<br>Default is 25 items per page.
            example: 10
            default: 25
        description: Use for pagination.
      EntityListType:
        type: object
        description: "Supports entities such as IndependentSalesOrganization/IndependentSalesChannel limit 1 Entity<br>National, SuperChain, Partner with maximum limit of 10 entities<br>Chain, Division, Store and Merchant with maximum limit of 2000 entities."
        allOf:
        - $ref: '#/components/schemas/Entity'
      Entity:
        type: object
        properties:
          level:
            type: string
            description: "Supports entities such as Independent Sales Organization/Independent Sales Channel limit 1 Entity<br>National, SuperChain, Partner with maximum limit of 10 entities<br>Chain, Division, Store and Merchant with maximum limit of 2000 entities."
            example: MERCHANT
            enum:
            - MERCHANT
            - STORE
            - DIVISION
            - CHAIN
            - PARTNER
            - SUPERCHAIN
            - NATIONAL
            - INDEPENDENT_SALES_CHANNEL
            - INDEPENDENT_SALES_ORGANIZATION
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "4445000123456"
            - "4445000234567"
            items:
              maxLength: 255
              type: string
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system. <br> Chain code is mandatory to pass when hierarchy level is selected as store/division."
            example: 1X0010
      EntityListTypes:
        type: object
        description: "Supports entities such as National, SuperChain and Partner with maximum limit of 10 entities.<br>Merchant, Division, Store and Chain with maximum limit of 2000 entities."
        allOf:
        - $ref: '#/components/schemas/EntityMerchant'
      EntityMerchant:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: MERCHANT
            enum:
            - MERCHANT
            - NATIONAL
            - SUPERCHAIN
            - PARTNER
            - CHAIN
            - STORE
            - DIVISION
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "4445000123456"
            - "4445000234567"
            items:
              maxLength: 255
              type: string
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: 1X0010
      EntityListTypeChain:
        type: object
        description: Supports entities such as Independent Sales Organization and Independent Sales Channel limit 1 Entity<br>National and SuperChain with maximum limit of 10 entities<br>Chain with maximum limit of 2000 entities.
        allOf:
        - $ref: '#/components/schemas/EntityChain'
      EntityChain:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: CHAIN
            enum:
            - INDEPENDENT_SALES_ORGANIZATION
            - INDEPENDENT_SALES_CHANNEL
            - NATIONAL
            - SUPERCHAIN
            - CHAIN
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - 1X0010
            - BA0234
            items:
              maxLength: 255
              type: string
        description: "Supports entities IndependentSalesOrganization, IndependentSalesChannel, National, Chain."
      EntityListTypeStore:
        type: object
        description: "Supports entities such as National and SuperChain with maximum limit of 10 entities.<br>Chain, Store, Division with maximum limit of 2000 entities."
        allOf:
        - $ref: '#/components/schemas/EntityHierarchyStore'
      EntityHierarchyStore:
        type: object
        description: "Supports entities Chain, National."
        allOf:
        - $ref: '#/components/schemas/EntityParentTypeStore'
      EntityListTypeSuperChain:
        type: object
        description: Supports entities such as Sales Organization and Sales Channel with maximum limit of 1 entity<br>National and SuperChain with maximum limit of 10 entities.
        allOf:
        - $ref: '#/components/schemas/EntitySuperChain'
      EntitySuperChain:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: SUPERCHAIN
            enum:
            - INDEPENDENT_SALES_CHANNEL
            - INDEPENDENT_SALES_ORGANIZATION
            - NATIONAL
            - SUPERCHAIN
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "731234567"
            - "841234567"
            items:
              maxLength: 255
              type: string
        description: "Supports entities Independent Sales Oragnization, Independent Sales Channel, Super Chain."
      EntityListTypeDivision:
        type: object
        description: "Supports entities such as National and Super Chain with maximum limit of 10 entities.<br>Chain, Division with maximum limit of 2000 entities."
        allOf:
        - $ref: '#/components/schemas/EntityHierarchyDivision'
      EntityHierarchyDivision:
        type: object
        description: "Supports entities Chain, National, SuperChain."
        allOf:
        - $ref: '#/components/schemas/EntityParentTypeDivision'
      EntityParentTypeStore:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: STORE
            enum:
            - NATIONAL
            - SUPERCHAIN
            - CHAIN
            - DIVISION
            - STORE
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "000000001"
            - "000000002"
            items:
              maxLength: 255
              type: string
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system. <br> Chain code is mandatory to pass when hierarchy level is selected as store/division."
            example: 1X0010
      EntityStoreResponse:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: 1X0010
          storeNumber:
            maxLength: 9
            type: string
            description: "The Store/Location is the lowest roll-up level in the hierarchy system, grouping multiple merchant account numbers (MIDs) used in a single merchant location assigned to different terminals and/or business lines (MCC’s). A Store Number is of 9 digits and unique to a particular Chain meaning same Store Number can exist for a Store under a different Divison/Chain but no duplicates under the same Divison/Chain. <br> Supports entities Chain, National."
            example: "000000001"
      EntityParentTypeDivision:
        type: object
        properties:
          level:
            type: string
            description: Refers to hierarchy level
            example: DIVISION
            enum:
            - NATIONAL
            - SUPERCHAIN
            - CHAIN
            - DIVISION
          values:
            type: array
            description: Refers to hierarchy id. Accept list of ids.
            example:
            - "001"
            - "002"
            items:
              maxLength: 255
              type: string
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system. <br> Chain code is mandatory to pass when hierarchy level is selected as store/division."
            example: 1X0010
        description: "Supports entities Chain, National."
      EntityDivisionResponse:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: 1X0010
          divisionNumber:
            maxLength: 3
            type: string
            description: "The Division Number is a hierarchy level that enables merchants to roll-up child entities for Stores / Locations into different groups under a Chain. The Division Code is an optional hierarchy level but if created, is required for all child entities under the Division Number. <br> Supports entities Chain, National."
            example: "088"
      DateRangeType:
        required:
        - fromDate
        - toDate
        type: object
        properties:
          fromDate:
            maxLength: 10
            minLength: 10
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            type: string
            description: Field specifies the starting date
            format: YYYY-MM-DD
            example: 2016-01-01
          toDate:
            maxLength: 10
            minLength: 10
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
            type: string
            description: Field specifies the ending date
            format: YYYY-MM-DD
            example: 2017-08-14
        description: "Refers to number of dates that includes a particular start and finish date and all dates in between the range. <br> Date range supported at different hierarch level <br><br>07 Days<br>Independent Sales Organizationn(SO)<br>Independent Sales Affiliate(SA)<br>National(NL)<br>Partner(PT)<br>Super Chain(SC)<br><br>45 days<br>Chain(CH), Merchant(MT)."
      PaginationResponse:
        type: object
        properties:
          pageNumber:
            maximum: 9999999999999999
