    SearchAuthTransactionsRequestRealTimeTransactionDateRange:
      type: object
      properties:
        fromDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Start date
          format: YYYY-MM-DD
          example: 2021-12-01
        toDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: End date
          format: YYYY-MM-DD
          example: 2021-12-01
      description: "Real-Time requests can only search on the current date (1 day). The From and To Date fields must be set to the same date, to search on transaction details occurring on that day in real-time."
    SearchAuthTransactionsRequestTransactionTimeRange:
      type: object
      properties:
        fromTime:
          maxLength: 8
          type: string
          description: Starting period of time
          format: HH:MM:SS
          example: 08:59:45
        toTime:
          maxLength: 8
          type: string
          description: Ending period of time
          format: HH:MM:SS
          example: "39589"
      description: "Real-Time requests can only search on the current date and time (1 day). The From and To time fields must be set to the same date, to search on transaction details occurring on that day in real-time."
    SearchAuthTransactionsRequestTransactionDateRange:
      type: object
      properties:
        fromDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Start date
          format: YYYY-MM-DD
