  examples:
    "204NoContent":
      value:
        message: No content
    "400BadRequest":
      value:
        errors:
        - errorMessage: No entries found with provided id.
    "401Unauthorized":
      value:
        errors:
        - errorMessage: Invalid API key. Please ensure the key is accurate and authorization is included.
    "403Forbidden":
      value:
        errors:
        - errorMessage: Resource
    "404NotFound":
      value:
        errors:
        - errorMessage: Resource Not Found
    "500ServerError":
      value:
        errors:
        - errorMessage: Internal Client Error
  headers:
    CorrelationId:
      description: Correlation ID
      required: true
      style: simple
      explode: false
      schema:
        maxLength: 36
        minLength: 36
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        type: string
        format: uuid
        example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
  securitySchemes:
    api_key:
      type: apiKey
      description: "``` License format is WORLDPAY license='xxxx'``` \n"
      name: Authorization
      in: header