---
openapi: 3.0.0
info:
  title: "Reporting: Authorization Research API"
  description: "API used to search and retrieve authorized transactions. This API would be used to fetch search authorized transactions and retrieve individual transaction details based on card types. \n # Authentication \n<SecurityDefinitions />"
  contact:
    name: Developer Support
    email: APICustomerIntegration@fisglobal.com
  license:
    name: FIS Proprietary
  version: 1.0.4
servers:
- url: https://apis.stage.worldpay.com/merchant-reporting/authorizationresearch/v1
paths:
  /authorizations/nonrealtime/search:
    post:
      tags:
      - Non-RealTime Authorizations
      summary: Retrieve authorized transactions for a given hierarchy and a date range.
      description: Endpoint is used to retrieve the authorized transaction (approved or declined) details for a given hierarchy and date range. It provides the non-real time (till previous date) transaction details. It helps the user to perform a search based on optional fields.
      operationId: searchAuthorizations
      parameters:
      - name: v-correlation-id
        in: header
        description: Correlation Id
        required: false
        style: simple
        explode: false
        schema:
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          format: uuid
          example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAuthNonRealTransactionsRequest'
            examples:
              All Mandatory fields:
                value:
                  dateRange:
                    fromDate: 2021-12-26
                    toDate: 2021-12-27
                  hierarchy:
                  - level: MERCHANT
                    values: "4445045300324"
              AuthTxnSearchReqWithMTEntityandDateExample:
                value:
                  pagination:
                    pageSize: "25"
                    pageNumber: "1"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  dateRange:
                    fromDate: 2021-12-26
                    toDate: 2021-12-27
                  hierarchy:
                  - level: MERCHANT
                    values: "4445045300324"
              AuthTxnSearchReqWithdateandoptionalfieldsExample:
                value:
                  pagination:
                    pageSize: "25"
                    pageNumber: "1"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  dateRange:
                    fromDate: 2021-12-26
                    toDate: 2021-12-27
                  transactionAmountRange:
                    amountFrom: 20
                    amountTo: 100
                  authorizationCode: "34567"
                  phoneNumber: "1437825372"
                  hierarchy:
                  - level: MERCHANT
                    values: "4445045300324"
              AuthTxnSearchReqWithPartialCardNumberExample:
                value:
                  pagination:
                    pageSize: "25"
                    pageNumber: "1"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  dateRange:
                    fromDate: 2021-12-26
                    toDate: 2021-12-27
                  transactionAmountRange:
                    amountFrom: 2000
                    amountTo: 10000
                  authorizationCode: "34567"
                  phoneNumber: "1437825372"
                  hierarchy:
                  - level: CHAIN
                    values: OA1234
              AuthTxnSearchReqWithCardNumberExample:
                value:
                  pagination:
                    pageSize: "25"
                    pageNumber: "1"
                  sortResultsBy:
                    fieldName: TRANSACTION_ID
                    orderBy: ASC
                  dateRange:
                    fromDate: 2021-12-26
                    toDate: 2021-12-27
                  transactionAmountRange:
                    amountFrom: 2000
                    amountTo: 10000
                  authorizationCode: "34567"
                  phoneNumber: "14378253728"
                  hierarchy:
                  - level: CHAIN
                    values: OA1234
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAuthTransactionsResponse'
        default:
          description: Default errors
          headers:
            v-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                "204":
                  $ref: '#/components/examples/204NoContent'
                "400 Bad Request":
                  $ref: '#/components/examples/400BadRequest'
                "401 Unauthorized":
                  $ref: '#/components/examples/401Unauthorized'
                "403 Forbidden":
                  $ref: '#/components/examples/403Forbidden'
                "404 Not Found":
                  $ref: '#/components/examples/404NotFound'
                "500 Server Error":
                  $ref: '#/components/examples/500ServerError'
      security:
      - api_key: []
