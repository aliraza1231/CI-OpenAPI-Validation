components:
  schemas:
    SearchAuthNonRealTransactionsRequest:
      required:
      - dateRange
      - hierarchy
      type: object
      properties:
        pagination:
          type: object
          description: Used for pagination.
          allOf:
          - $ref: '#/components/schemas/PaginationType'
        sortResultsBy:
          type: object
          description: Sort results by option for non-real time authorization transactions.
          allOf:
          - $ref: '#/components/schemas/SortAuthTransactions'
        hierarchy:
          type: object
          description: Hierarchy details
          allOf:
          - $ref: '#/components/schemas/Entity'
        dateRange:
          type: object
          description: "Refers to number of dates that includes a particular start and end date and all dates in between specific periods of time.<br> Date range supported<br><br>07 Days<br>Independent Sales Organization(SO)<br>Independent Sales Affiliate(SA)<br>National(NL)<br>Partner(PT)<br>Super Chain(SC)<br><br>45 days<br>Chain(CH), Merchant(MT)."
          allOf:
          - $ref: '#/components/schemas/SearchAuthTransactionsRequestTransactionDateRange'
        transactionAmountRange:
          type: object
          description: Transaction amount range.
          allOf:
          - $ref: '#/components/schemas/SearchAuthTransactionsRequestTransactionAmountRange'
        authorizationCode:
          maxLength: 6
          type: string
          description: "Authorization codes are used for any transaction that has restrictions on which users are entitled to access. Authorization Code is a six number code from the issuing bank to the vendor, that authorizes the sale."
          example: 73994M
        cardTypes:
          maxLength: 6
          type: string
          description: "Types of card used for the payment. <br> Possible values are CREDIT, DEBIT, GIFT."
          example: "[\"CREDIT\",\"DEBIT\",\"GIFT\"]"
        cardNetworks:
          description: Network the card is associated with facilitating the payment.
          example: VISA
          allOf:
          - $ref: '#/components/schemas/nonrealCardNetworks'
        token:
          maxLength: 19
          type: string
          description: Tokenization is a substitution for Primary AccountNumber (PAN) with proxy data. Tokenization limits the ability to conduct fraudulent payment transactions. A token value is numeric and is the same length as the card account number length. Max length of token is 19 characters.
          example: "374245111181117"
        transactionId:
          maxLength: 18
          minLength: 12
          type: string
          description: Transaction id is a number generated from the electronic transfer of funds. It is a unique identifier that is generated with every card transaction. (a 12-18 digit code)
          example: "1863540165"
        transactionTypeCode:
          maxLength: 3
          type: string
          description: Indicates the type of transaction that involves funds transfers or a financial transaction. <br> GA - ACTIVATION <BR> GAX- ACTVN REVSL <BR> GB- ADDRESS VERIFY <BR> GC- BAL TRNSFR <BR> GCX- BALANCE INQUIRY <BR> GE- CARD FROM TOKEN <BR> GEX- CASH ADVANCE <BR> GF- CLOSE <BR> GFX- CLOSE REVERSAL <BR> GK- CNVRT HV LVT <BR> GL- INACTIVITY FEES <BR> GLX- MAIL ORDER<BR> GM- MAIL/PHO ADVICE<BR> GP- MAKE KEY ADVCON<BR> GPX- MAKE KEY ADVICE<BR> GS- MAKE KEY ADVSTG<BR> GU- MAKE KEY REQUES<BR> GUX- MINISTMT<BR> GV- PARTIAL REVRSL<BR> GVX- PREAUT COMP REV<BR> GZ- PREAUTH COMPLTN<BR> GZX- PREAUTH REQUEST<BR> G1- PREAUTH RQ REV<BR> IC- PREPAID ACT REV<BR> IF- PREPAID ACTVN<BR> IL- PREPAID LD REV<BR> IM- PREPAID LOAD<BR> IP- PURCHASE<BR> IR- PARTIAL REVRSL<BR> IS- PURCHASE ADVICE<BR> IV- PURCHASE REVRSL<BR> IX- REFUND<BR> KA- REFUND REVERSAL<BR> KC- RELOAD<BR> KM- RELOAD REVERSAL<BR> KS- REVERSAL<BR> MM- REVERSAL<BR> MP- STATUS/UNSTATUS<BR> RF- TOKEN FROM CARD<BR> RL- UNLOAD<BR> TC- UNLOAD REVERSAL<BR> TK- VIRTL ACTVN<BR> TR- VIRTL ACTVN REV<BR> 00- INCOMPLETE TRAN<BR> 01- DB WITH<BR> 02- DB WITH<BR> 06- SPECIAL TRAN<BR> 10- POS DB CRD PUR<BR> 11- POS DB CRD RET<BR> 12- POS DB INQ<BR> 13- POS PRE AUTH DB<BR> 14- POS PRE ATH<BR> 15- POS DB INQ<BR> 16- POS PRE AUTH DB<BR> 17- POS PRE ATH<BR> 25- CHECK VERIFY<BR> 29- POS CR CRD PUR<BR> 30- POS CR CRD RET<BR> 31- POS CR CRD PUR <BR> 32- POS CR CRD RET <BR> 38- CC AUTH <BR> 39- CC COMPLETION <BR> 40- CC AUTH <BR> 41- CC COMPLETION <BR> 48- INTERBANK DR <BR> 49- INTERBANK CR <BR>
          example: GA
          enum:
          - GA
          - GAX
          - GB
          - GC
          - GCX
          - GE
          - GEX
          - GF
          - GFX
          - GK
          - GL
          - GLX
          - GM
          - GP
          - GPX
          - GS
          - GU
          - GUX
          - GV
          - GVX
          - GZ
          - GZX
          - G1
          - IC
          - IF
          - IL
          - IM
          - IP
          - IR
          - IS
          - IV
          - IX
          - KA
          - KC
          - KM
          - KS
          - MM
          - MP
          - RF
          - RL
          - TC
          - TK
          - TR
          - "00"
          - "01"
          - "02"
          - "06"
