          enum:
          - MERCHANT
          - STORE
          - DIVISION
          - CHAIN
          - PARTNER
          - SUPER_CHAIN
          - NATIONAL
          - INDEPENDENT_SALES_CHANNEL
          - INDEPENDENT_SALES_ORGANIZATION
        values:
          type: array
          description: Values of hierarchy levels
          example:
          - "4445000860700"
          - "4445000860702"
          items:
            maxLength: 30
            type: string
        chainCode:
          maxLength: 6
          type: string
          description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system. <br> Chain Code is mandatory to pass when level is store or division."
          example: OA1234
      description: Entity details.
    PaginationResponse:
      type: object
      properties:
        pageNumber:
          maximum: 16777215
