          example: 2016-07-19T16:41:31
        processDate:
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          type: string
          description: Indicates the process date of a transaction that has been authorized between the two parties.
          format: YYYY-MM-DD
          example: 2016-07-19
        transactionStatus:
