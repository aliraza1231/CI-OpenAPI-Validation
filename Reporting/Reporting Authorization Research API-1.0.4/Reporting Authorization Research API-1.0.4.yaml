          type: string
          description: Refers the unique reference number associated with a voucher.
          example: "484426"
        transactionEMV:
          type: boolean
          description: possible values True or False
          example: true
        offlineEMV:
          type: boolean
          description: possible values True or False
          example: true
        posConditionCode:
          type: object
          description: This field indicates the POS Condition Code for transactions.
          example:
            code: 59
            shortDescription: E-Commerce
            longDescription: E-COMMERCE
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        terminalEMV:
          type: boolean
          description: possible values True or False
          example: true
        authorizationCommunicationType:
          type: object
          description: Authorization communication details.
          example:
            code: 0
            shortDescription: STANDARD RAFT
            longDescription: STANDARD RAFT
          allOf:
          - $ref: '#/components/schemas/CodeAndDescription'
        customerIdentifier:
          maxLength: 25
          type: string
          description: The unique identifier of the purchaser associated with the transaction.
          example: "98765"
        merchantOrderIdentifier:
          maxLength: 25
          type: string
          description: This field indicates the ecom merchant order identifier.
          example: A453
        campaign:
          maxLength: 25
          type: string
          description: This field indicates the ecom campaign.
          example: D453
        affiliate:
          maxLength: 25
          type: string
          description: This field indicates the ecom affiliate.
          example: G123
        merchantGroupingIdentifier:
          maxLength: 25
          type: string
          description: This field indicates the ecom merchant grouping identifier
          example: S673
        reportGroup:
          maxLength: 25
          type: string
          description: This field indicates the ecom report group
          example: E874
        chargeId:
          maxLength: 27
          type: string
          description: This field indicates the returns on a successful pay transaction. It must be returned on reversal/refund to restore PAN for routing.
          example: G453
        sequenceNumber:
          maxLength: 6
          type: string
          description: Sequence number.
          example: "823040"
        forcePost:
          type: boolean
          description: possible values True or False
          example: true
        hasAdjustmentRecords:
          maxLength: 12
          type: string
          description: Indicates whether the transaction has any adjustments.
          example: Not Adjusted
        terminalId:
          maxLength: 15
          type: string
          description: Id of terminal
          example: "0000000000"
        posRegisterNumber:
          maxLength: 4
          type: string
          description: Refers to registered POS Number
          example: "7546"
      description: Debit transaction details.
    MerchantInfo:
      type: object
      properties:
        chainCode:
          maxLength: 6
          type: string
          description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
          example: 0F0086
        merchantId:
          maxLength: 20
          type: string
          description: "The Merchant hierarchy level is the last level in the Vertical Hierarchy. MID is the unique identifier assigned for a processing location, business type, MCC Code that requires a specific value to define merchant authorizations, settlement, reporting, pricing and billing levels."
          example: "4445091191791"
        merchantName:
          maxLength: 50
          type: string
          description: Merchant Name refers to the name registered for businesses.
          example: HARPER ENGRAVING
      description: Merchant information.
    SensitiveGiftRealCardDetails:
      type: object
      properties:
        cardNumber:
          maxLength: 19
          type: string
          description: "This is the number found on the card used to make a purchase, also referred to as the bank card number.<br>Searches can be done on the full card number, on the first 6 and last 4 digits, or on the last 4 digit searches."
          example: '************1111'
        expirationDate:
          maxLength: 7
          minLength: 7
          pattern: "^[0-9]{4}-[0-9]{2}$"
          type: string
          description: An expiration date is a set time when a card will need to be replaced.
          format: YYYY-MM
          example: 2022-12
        lastFourOfPAN:
          maxLength: 4
          type: string
          description: Field is used to provide the last 4-digits of the PAN on the receipt.
          example: "3245"
      description: sensitive Card Details.
    SortAuthTransactions:
      type: object
      properties:
        fieldName:
          type: string
          description: This is the field used to sort on in the request.
          example: CARD_NUMBER
          enum:
          - CARD_NUMBER
          - AUTHORIZATION_CODE
          - AUTHORIZATION_AMOUNT
          - TRANSACTION_STATUS
          - TRANSACTION_DATE_TIME
          - FIELD_1
          - FIELD_2
          - FIELD_3
        orderBy:
          type: string
          description: Order by refers to the ordering being requested in the search that is based on the Field Name.  The response will return the data records in ascending or descending order.
          example: ASC
          enum:
          - ASC
          - DESC
      description: The sort results by fields are used in request to establish the sort order for the data to be returned in ascending or descending order.
    PaginationType:
      type: object
