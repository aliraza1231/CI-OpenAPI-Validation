      SummaryDetailEntityMerchant:
        type: object
        properties:
          merchantId:
            maxLength: 16
            type: string
            description: "The Merchant hierarchy level is the last level in the Vertical Hierarchy. MID is the unique identifier assigned for a processing location, business type, MCC Code that requires a specific value to define merchant authorizations, settlement, reporting, pricing and billing levels."
            example: "4445123456789"
      SummaryDetailEntityHierarchyStore:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: AB1234
          storeNumber:
            maxLength: 9
            type: string
            description: "The Store/Location is the lowest roll-up level in the hierarchy system, grouping multiple merchant account numbers (MIDs) used in a single merchant location assigned to different terminals and/or business lines (MCC’s). A Store Number is of 9 digits and unique to a particular Chain meaning same Store Number can exist for a Store under a different Divison/Chain but no duplicates under the same Divison/Chain."
            example: "1000000001"
        description: Supports entities chain and national.
      SummaryDetailEntityHierarchyDivision:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: AB1234
          divisionNumber:
            maxLength: 3
            type: string
            description: "The Division Number is a hierarchy level that enables merchants to roll-up child entities for Stores / Locations into different groups under a Chain. The Division Code is an optional hierarchy level but if created, is required for all child entities under the Division Number."
            example: "088"
        description: Supports entities chain and national.
      SummaryDetailEntitySuperChain:
        type: object
        properties:
          superChainCode:
            maxLength: 10
            type: string
            description: The identifier code that represents the group of related chains of the partner.
            example: SCNPCB8811
      SummaryDetailEntityChain:
        type: object
        properties:
          chainCode:
            maxLength: 6
            type: string
            description: "The Chain Code is the level of the merchant hierarchy that groups merchant identifiers (MIDs) and any related roll-up values under a common identifier for settlement, billing and reporting. Chain Code is the primary identifier for merchants boarded in MDB (Merchant Database) system."
            example: AB1234
