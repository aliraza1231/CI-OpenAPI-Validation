            maxLength: 36
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            type: string
            format: uuid
            example: a0efdf0f-eb0b-4353-80bb-ec520e02885e
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementsRequest'
              examples:
                SearchSummaryByMandatoryFields:
                  value:
                    hierarchy:
                      level: MERCHANT
                      values:
                      - "4445000123456"
                      - "4345023507756"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-13
                SearchSummaryByHierarchyLevel-MERCHANT:
                  value:
                    hierarchy:
                      level: MERCHANT
                      values:
                      - "4445000123456"
                      - "4345023507756"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-13
                    cardType: CREDIT
                    cardNetworks:
                    - VISA
                    - MASTERCARD
                    - DISCOVER
                    - AMEX
                SearchSummaryByHierarchyLevel-CHAIN:
                  value:
                    hierarchy:
                      level: CHAIN
                      values:
                      - AB1234
                      - "111217"
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-13
                    cardType: CREDIT
                    cardNetworks:
                    - VISA
                    - MASTERCARD
                    - DISCOVER
                    - AMEX
                SearchSummaryByHierarchyLevel-STORE:
                  value:
                    hierarchy:
                      level: STORE
                      values:
                      - "0000123"
                      - "0000456"
                    chainCode: AB1234
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-13
                    cardType: CREDIT
                    cardNetworks:
                    - VISA
                    - MASTERCARD
                    - DISCOVER
                    - AMEX
                SearchSummaryByHierarchyLevel-DIVISION:
                  value:
                    hierarchy:
                      level: DIVISION
                      values:
                      - "0000356"
                      - "0038453"
                    chainCode: AB1234
                    dateRange:
                      fromDate: 2019-07-27
                      toDate: 2019-09-13
                    cardType: CREDIT
                    cardNetworks:
                    - VISA
                    - MASTERCARD
                    - DISCOVER
                    - AMEX
        responses:
          "200":
            description: OK.
            headers:
              v-correlation-id:
                $ref: '#/components/headers/CorrelationId'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SettlementsSummaryResponse'
                examples:
                  Summary:
                    value:
                      totalSaleCount: 200
                      totalSaleAmount: 2000.11
                      totalReturnCount: 218
                      totalReturnAmount: 844.28
                      totalNetAmount: 1155.72
          default:
            description: Default errors
            headers:
              v-correlation-id:
                $ref: '#/components/headers/CorrelationId'
