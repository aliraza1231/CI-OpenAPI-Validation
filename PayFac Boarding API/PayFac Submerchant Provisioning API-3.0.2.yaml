              - CreditConvenienceFees
              - DebitDeposits
              - DebitChargebacks
              - DebitConvenienceFees
          oneACHForAllCategories:
            type: string
            description: "Denotes one ACH (Automated Clearing House) item for all categories - Deposits, Chargebacks,ProcessingFees, ConvenienceFees with in a method of payment - Credit and Debit for this adavanced settlement account"
            default: "No"
            enum:
            - "Yes"
            - "No"
          oneACHForCreditAndDebit:
            type: string
            description: Denotes one ACH item for credit and debit methods of payment with in a category for this adavanced settlement account
            default: "No"
            enum:
            - "Yes"
            - "No"
        description: Provides information about the various advanced settlement options and associated bank accounts
      ExpressSubAccount:
        type: object
        properties:
          expressGatewayId:
            maxLength: 6
            type: integer
            description: Express Gateway Id associated with the chain code - used to board to express
            example: 123456
          batchCloseMethod:
            type: string
            description: The options are Time Initiated or Merchant Initiated. Default Value is TimeInitiated.
            default: TimeInitiated
            enum:
            - TimeInitiated
            - MerchantInitiated
          batchCloseTime:
            pattern: "^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
            type: string
            description: The time in Central Time (CT) that the transactions are settled each day. Required if Batch Close Method is set to Auto (Time Initiated).  Format should be hh:mm:ss (in CT). Default Value is 20:00:00 (in CT)
            example: 20:00:00
            default: 20:00:00
          checkForDuplicateTransactions:
            type: string
            description: The same card number submitted for a same general transaction type and amount within the last 25 transactions of the current open batch will be rejected in real-time as a duplicate decline.  Default Value is Yes.
            default: "Yes"
            enum:
            - "Yes"
            - "No"
          accountToken:
            type: string
            readOnly: true
          accountId:
            type: string
            readOnly: true
          acceptorId:
            type: string
            readOnly: true
          defaultTerminalId:
            type: string
            readOnly: true
          enableCommercialCardBINQuery:
            type: string
            description: Feature on Express to allow submerchants to send level 3 data with card transactions
            example: "No"
            enum:
            - "Yes"
            - "No"
        description: Express gateway information
