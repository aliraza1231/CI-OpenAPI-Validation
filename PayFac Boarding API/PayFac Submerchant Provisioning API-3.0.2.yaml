  components:
    schemas:
      SubMerchant:
        required:
        - acceptedCards
        - addresses
        - billingDescriptor
        - businessEstablishedDate
        - businessType
        - chainCode
        - contacts
        - dbaName
        - defaultBankAccount
        - federalTaxId
        - legalName
        - mccCode
        - ownershipType
        - transactionType
        - uuid
        type: object
        properties:
          id:
            type: integer
            description: "ResourceId. ReadOnly. Returned by GET, not used in POST/PUT"
            format: int64
            readOnly: true
          mid:
            type: integer
            description: "Merchant Identifier. ReadOnly. Returned by GET, not used in POST/PUT"
            format: int64
            readOnly: true
          uuid:
            maxLength: 36
            type: string
            description: Required. PayFac generated Sub-Merchant unique id. UUID stands for Universally Unique Identifier.
            format: uuid
          chainCode:
            pattern: "^[0-9A-Z]{6}$"
            type: string
            description: Required. Existing PayFac Chain code.
            example: 0A1B2C
          divisionCode:
            type: string
            description: Required for PayFacs that are using division codes
            example: "001"
          storeNumber:
            type: string
            description: Optional. For PayFacs that want to specify a Store Number for a submerchant.
            example: "000000001"
          federalTaxId:
            pattern: "^\\d{9}$"
            type: string
            description: "a) Required. For US Sub-merchants Federal Tax ID is the Tax Identification Number (TIN). If Sub-Merchant Ownership type is SolePropietor, then use SSN. \n \n b) Required. For Canadian Sub-merchants provide EIN (Employer Identification Number). If Sub-Merchant Ownership type is SolePropietor, then use SIN.\n "
            example: "123456789"
          legalName:
            maxLength: 40
            pattern: "^[0-9A-Za-z ,'.&amp;-_]{1,40}$"
            type: string
            description: "Required. Legal Name of the Sub Merchant.Valid special characters are space , ' & ; - _"
            example: PayFac_Submerchant 01
          dbaName:
            maxLength: 40
            pattern: "^[0-9A-Za-z ,'.&amp;-_]{1,40}$"
            type: string
            description: "Required. Doing Business As Name of the Sub-Merchant. Valid special characters are space , ' & ; - _"
            example: PayFac Submerchant 01
          billingDescriptor:
            maxLength: 25
            type: string
            description: "Required. An asterik is required. The asterik has to be in the 4th, 8th, or 13th position of the string"
            example: PFA*SM
          ownershipType:
            type: string
            description: Required. Type of the Sub-Merchant organization
            example: PublicCorporation
            enum:
            - PublicCorporation
            - PrivateCorporation
            - SECRegulatedCorporation
            - Government
            - SoleProprietorship
            - LLC
            - Partnership
            - NonProfit
            - FinancialInstitution
            - Trust
          businessType:
            type: string
            description: Required. Business Type of the Sub-Merchant. MOTO - Mail Order Telephone Order
            enum:
            - AutoRental
            - ECommerce
            - Lodging
            - MOTO
            - Restaurant
            - Retail
          mccCode:
            pattern: "^\\d{4}$"
            type: string
            description: Required. SIC Code / MCC Code (Sub-Merchant Category Code)
            example: "1520"
          businessEstablishedDate:
            type: string
            description: Required. Format yyyy-mm-dd. Date on which Sub-Merchant business was established
            format: date
          transactionType:
            type: string
            description: Required. Transaction Type for the Sub-Merchant to indicate whether they do any percentage of business online. OnlineStore or NoOnlineStore
            example: OnlineStore
            enum:
            - OnlineStore
            - NoOnlineStore
          websiteUrl:
            maxLength: 80
            pattern: "^(http:\\/\\/www\\.|https:\\/\\/www\\.|http:\\/\\/|https:\\/\\/)?[a-z0-9]+([\\-\\.]{1}[a-z0-9]+)*\\.[a-z]{2,5}(:[0-9]{1,5})?(\\/.*)?$"
            type: string
            description: Website URL of the Sub-Merchant. Website URL is required if merchant selects OnlineStore as transactionType
            format: uri
            example: https://payfacsm.com
          addTerminals:
            type: string
            description: "The addTerminal field indicates whether or not all the terminals that exist on the template mid will be created for the submerchant. This is an optional field. If it is omitted, the value will default to “Yes”. If the value is “Yes”, all terminals on the template mid will be created for the submerchant. If “No”, no terminals will be created for the submerchant using this call. Terminals can be created using the Create Terminal endpoint."
            enum:
            - "Yes"
            - "No"
          terminals:
            $ref: '#/components/schemas/TerminalsPost'
          expressSubAccount:
            $ref: '#/components/schemas/ExpressSubAccount'
          owners:
            type: array
            items:
              $ref: '#/components/schemas/Owner'
          contacts:
            type: array
            description: |-
              * CustomerService Contact is mandatory. It could be same as any Owner Contact information.
              * For Customer Service Contact, firstName, lastName, phoneNumber, and email are mandatory.
              * For any other contactTtype, firstName and lastName are mandatory.
            items:
              $ref: '#/components/schemas/Contact'
          addresses:
            type: array
            description: |-
              *  Physical address is mandatory.
              *  For any addressType, streetAddress1, city, state, postalCode, and countryCode are mandatory.
            items:
              $ref: '#/components/schemas/Address'
          acceptedCards:
            type: array
            description: |-
              Method of Payment or Card Type related attributes. Only the attributes specific to the Card type needs to be included.
              *  Visa and Mastercard are mandatory
            items:
              $ref: '#/components/schemas/AcceptedCard'
          defaultBankAccount:
            $ref: '#/components/schemas/BankAccount'
          advancedSettlementAccounts:
            type: array
            items:
              $ref: '#/components/schemas/AdvancedSettlementAccount'
