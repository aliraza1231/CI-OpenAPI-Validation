      TerminalsForUpdate:
        required:
        - batchCloseTime
        type: object
        properties:
          batchCloseTime:
            type: string
            description: Required field
            example: "0430"
          batchCloseType:
            type: string
            description: "Optional field. Allowed values are H, T, N. H- Host auto close, T- Terminal auto close, N- None. Default value is H"
            example: H
          batchTurnOff:
            type: string
            description: "Optional field. Allowed values are Yes, No. Default value is No. If this value is No then batchCloseType must be sent as H. If this value is Yes then batchCloseType can be sent as either T or N"
            example: "No"
      TerminalForUpdate:
        type: object
        properties:
          customizations:
            type: array
            description: "Only Auto-Close Time and Auto-Close Type can be updated. The following are the name value pair formats that are allowed.\n\n a) name = Auto-Close Time \n    value = '0430'\n    \n b) name = Auto-Close \n    value = 'T'\n    \n    T- Terminal Auto Close. The Auto Close Time will occur in relation to the time on the terminal itself\n    \n c) name = Auto-Close\n    value = 'H'\n    \n    H - Host Auto Close. The Auto Close Time will occur according to Eastern Standard Time (EST)\n    \n d) name = Auto-Close \n    value = 'N'\n   \n    The Auto Close Time option is off, and the terminal will NOT auto close no matter that time set for Auto Close Time"
            items:
