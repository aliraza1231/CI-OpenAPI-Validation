  - name: Advanced Settlement Account
    description: Resources to create and maintain account information for a Advanced Settlement Categories
  - name: Underwriting Status
    description: Resource to check the underwriting status for a PayFac submerchant
  - name: Terminals
    description: Resources to create and maintain Terminal Settings for a PayFac SubMerchant
  - name: Express Sub-Account
