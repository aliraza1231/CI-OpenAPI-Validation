        required:
        - lastScanDate
        - pciValidated
        - pciValidatedDate
        - vulnerabilityScanRequired
        type: object
        properties:
          vulnerabilityScanRequired:
            type: boolean
            description: vulnerabilityScanningRequired true or false
          lastScanDate:
            maxLength: 10
            type: string
            description: Last PCI Scan Date
            format: YYYY-MM-DD
          pciValidated:
            maxLength: 15
            type: string
            description: Pci Validated status
            enum:
            - COMPLIANT
            - NON_COMPLIANT
            - INCOMPLETE
            - EXPIRED
          pciValidatedDate:
            maxLength: 10
            type: string
            description: PCI Validated Date
            format: YYYY-MM-DD
          pciScanStatus:
            maxLength: 15
            type: string
            description: "Pci scan status, Y-passed, F-failed,I-In-progress, X-Not started"
            enum:
            - COMPLIANT
            - NON_COMPLIANT
            - INCOMPLETE
            - EXPIRED
      SaqData:
        required:
        - nextDueDate
        - status
        - statusDate
        type: object
        properties:
          type:
            type: string
            description: SAQ type
            enum:
            - "A (applies to card-not-present merchants who have completely outsourced all cardholder data processing functions and have no electronic storage, processing or transmitting of cardholder data)"
            - A-EP (applies to e-commerce merchants who partially outsource all payment processing to PCI DSS compliant service providers)
            - B (applies to merchants with no electronic cardholder data storage and who process payments either by standalone terminals or imprint-only machines)
            - B-IP (is used for merchants who process payments via standalone PTS-approved point-of-interaction devices with an IP connection to the payment processor. )
            - C (applies to merchants with a payment application connected to the Internet and no electronic storage of cardholder data0)
            - C-VT (applies to externally hosted web payment solutions and virtual terminals for merchants with no electronic cardholder data storage. )
            - P2PE (is for merchants who process card data only via payment terminals included in a validated and PCI SSC-listed Point-to-Point Encryption solution.)
            - "D (applies to any merchants who do not meet the criteria for other SAQs, as well as all service providers)"
          status:
            maxLength: 15
            type: string
            description: "SAQ status, F-Failed, I-In-Progress, P-Passed, X-Not Started, Y-Passed, N-Failed"
            enum:
            - FAILED
            - INPROGRESS
            - PASSED
            - NOT_STARTED
            - FAILED
          completeDate:
            type: string
            description: SAQ completed Date
            format: YYYY-MM-DD
          statusDate:
            type: string
            description: SAQ status Date
            format: YYYY-MM-DD
          nextDueDate:
            type: string
            description: Next SAQ required Date
            format: YYYY-MM-DD
